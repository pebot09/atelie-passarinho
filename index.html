                  setShowNewTurma(false);
                }
              }} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">Criar Turma</button>
            </div>
          </div>
        </Modal>
      )}

      {confirm?.type === 'deleteTurma' && (
        <ConfirmModal
          title="Excluir turma?" danger
          message={`Remover ${ABREV[confirm.turma.diaSemana]} ${confirm.turma.horario}? Todas as faltas e vagas desta turma também serão removidas.`}
          onConfirm={() => { dispatch({type:'DELETE_TURMA', id: confirm.turma.id}); setConfirm(null); }}
          onCancel={() => setConfirm(null)}
          confirmLabel="Excluir"
        />
      )}
      {confirm?.type === 'deleteTurmaComAlunos' && (
        <ConfirmModal
          title="Turma não está vazia"
          message={`A turma ${ABREV[confirm.turma.diaSemana]} ${confirm.turma.horario} ainda tem ${confirm.turma.alunos.length} aluno${confirm.turma.alunos.length > 1 ? 's' : ''}. Remova todos os alunos antes de excluir a turma.`}
          confirmLabel="Entendi"
          onConfirm={() => setConfirm(null)}
          onCancel={() => setConfirm(null)}
        />
      )}
      {confirm?.type === 'removeAluno' && (
        <ConfirmModal
          title="Remover aluno?" danger
          message={`Remover ${confirm.nome} da turma ${confirm.turma.id === TURMA_EXTRA_ID ? 'Extra' : `${ABREV[confirm.turma.diaSemana]} ${confirm.turma.horario}`}?`}
          onConfirm={() => { dispatch({type:'REMOVE_ALUNO', turmaId: confirm.turma.id, nome: confirm.nome}); setConfirm(null); }}
          onCancel={() => setConfirm(null)}
          confirmLabel="Remover"
        />
      )}
      {confirm?.type === 'removeAlunoPendencias' && (
        <ConfirmModal
          title="Aluno com pendências" danger
          message={`${confirm.nome} possui faltas ou reposições pendentes. Remover mesmo assim?`}
          onConfirm={() => { dispatch({type:'REMOVE_ALUNO', turmaId: confirm.turma.id, nome: confirm.nome}); setConfirm(null); }}
          onCancel={() => setConfirm(null)}
          confirmLabel="Remover mesmo assim"
        />
      )}
    </div>
  );
}

// ==================== TAB: REGISTRAR FALTA ====================
function TabRegistrarFalta({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [selectedDates, setSelectedDates] = useState([]);
  const [success, setSuccess] = useState('');
  const [tiposModal, setTiposModal] = useState(null); // [{data, semAntecedencia}] for dates <24h
  const [retroModal, setRetroModal] = useState(false);
  const [retroDate, setRetroDate] = useState('');

  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turma = state.turmas.find(t => t.id === turmaId);
  const isTurmaExtra = turmaId === TURMA_EXTRA_ID;
  const occurrences = useMemo(() => (!turma || isTurmaExtra) ? [] : getNextOccurrences(turma.diaSemana, 8), [turma, isTurmaExtra]);
  const pastOccurrences = useMemo(() => {
    if (!turma || isTurmaExtra) return [];
    const threeMonthsAgo = new Date();
    threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    return getClassDatesInRange(turma, dateToStr(threeMonthsAgo), dateToStr(yesterday)).reverse();
  }, [turma, isTurmaExtra]);

  const toggleDate = d => setSelectedDates(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);

  const doSubmit = (datasComTipo) => {
    dispatch({ type: 'ADD_FALTA', alunoNome, turmaId, datasComTipo });
    setSuccess(`Falta de ${alunoNome} registrada para ${datasComTipo.length} data(s).`);
    setAlunoNome('');
    setSelectedDates([]);
    setTiposModal(null);
    setTimeout(() => setSuccess(''), 4000);
  };

  const handleSubmit = () => {
    if (!turmaId || !alunoNome || !selectedDates.length) return;
    const menosde24h = selectedDates.filter(d => {
      const dt = getClassDatetime(turmaId, d, state.turmas);
      if (!dt) return false;
      const horas = (dt - Date.now()) / 3600000;
      return horas >= 0 && horas < 24;
    });
    if (menosde24h.length > 0) {
      setTiposModal(menosde24h.map(d => ({ data: d, semAntecedencia: true })));
      return;
    }
    doSubmit(selectedDates.map(d => ({ data: d, semAntecedencia: false })));
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Registrar Falta</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); setSelectedDates([]); }} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => <option key={t.id} value={t.id}>{t.id === TURMA_EXTRA_ID ? 'Alunos Extras & Ex-alunos' : `${EXTENSO[t.diaSemana]} ${t.horario}${t.observacao ? ` (${t.observacao})` : ''}`}</option>)}
        </select>
      </div>

      {turma && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => setAlunoNome(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {turma.alunos.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {turma.alunos.length === 0 && <p className="text-amber-600 text-sm mt-1">Esta turma não tem alunos cadastrados.</p>}
        </div>
      )}

      {turma && alunoNome && isTurmaExtra && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Data da falta</label>
          <input type="date" value={selectedDates[0] || ''} onChange={e => setSelectedDates(e.target.value ? [e.target.value] : [])}
            className="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
      )}

      {turma && alunoNome && !isTurmaExtra && (
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-sm font-medium text-gray-700">Datas da falta (próximas ocorrências)</label>
            {alunoNome && pastOccurrences.length > 0 && (
              <button onClick={() => { setRetroModal(true); setRetroDate(''); }} className="text-xs px-2.5 py-1 rounded-lg border border-orange-300 bg-orange-50 text-orange-700 font-medium hover:bg-orange-100 transition-colors">
                ⏪ Retroativas
              </button>
            )}
          </div>
          <div className="grid grid-cols-2 gap-2">
            {occurrences.map(d => {
              const feriadoNome = getFeriadoNome(d);
              const recessoNome = !feriadoNome ? getRecessoNome(d) : null;
              const jaRegistrado = !feriadoNome && !recessoNome && state.faltas.some(f =>
                f.alunoNome === alunoNome && f.turmaId === turmaId &&
                f.datas.includes(d) && (f.status === 'pendente' || f.status === 'marcada')
              );
              const isDisabled = !!feriadoNome || !!recessoNome || jaRegistrado;
              return (
                <label key={d} className={`flex items-center gap-2 p-2.5 rounded-lg border transition-colors ${
                  feriadoNome || recessoNome ? 'border-gray-100 bg-gray-50 cursor-not-allowed opacity-60' :
                  jaRegistrado ? 'border-gray-100 bg-gray-50 cursor-not-allowed opacity-60' :
                  selectedDates.includes(d) ? 'border-blue-500 bg-blue-50 cursor-pointer' :
                  'border-gray-200 hover:bg-gray-50 cursor-pointer'
                }`}>
                  <input type="checkbox"
                    checked={!feriadoNome && !recessoNome && (jaRegistrado || selectedDates.includes(d))}
                    disabled={isDisabled}
                    onChange={() => { if (!isDisabled) toggleDate(d); }}
                    className="rounded" />
                  <span className="text-sm">
                    {fmtBRFull(d)} <span className="text-gray-400">({ABREV[getDiaSemanaFromDateStr(d)]})</span>
                    {feriadoNome && <span className="ml-1 text-xs text-purple-500 font-medium">🎌 {feriadoNome}</span>}
                    {recessoNome && <span className="ml-1 text-xs text-amber-600 font-medium">🏠 {recessoNome}</span>}
                    {!feriadoNome && !recessoNome && jaRegistrado && <span className="ml-1 text-xs text-orange-500 font-medium">já registrado</span>}
                  </span>
                </label>
              );
            })}
          </div>
        </div>
      )}

      {retroModal && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 space-y-3">
          <div className="font-semibold text-amber-800 text-sm">⏪ Falta retroativa</div>
          <div className="text-xs text-amber-700">Selecione a data da aula passada (até 3 meses atrás):</div>
          <select value={retroDate} onChange={e => setRetroDate(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <option value="">— Selecione a data —</option>
            {pastOccurrences.filter(d => {
              const jaReg = state.faltas.some(f => f.alunoNome === alunoNome && f.turmaId === turmaId && f.datas.includes(d) && (f.status === 'pendente' || f.status === 'marcada'));
              return !isRecesso(d) && !getFeriadoNome(d) && !jaReg;
            }).map(d => (
              <option key={d} value={d}>{fmtBRFull(d)} ({ABREV[getDiaSemanaFromDateStr(d)]})</option>
            ))}
          </select>
          <div className="text-xs text-amber-700">Tipo da falta:</div>
          <div className="flex gap-2">
            <button onClick={() => {
              if (!retroDate) return;
              setSelectedDates(prev => prev.includes(retroDate) ? prev : [...prev, retroDate]);
              setRetroModal(false);
              doSubmit([{ data: retroDate, semAntecedencia: false }]);
            }} className="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold disabled:opacity-40" disabled={!retroDate}>
              Comum
            </button>
            <button onClick={() => {
              if (!retroDate) return;
              setSelectedDates(prev => prev.includes(retroDate) ? prev : [...prev, retroDate]);
              setRetroModal(false);
              doSubmit([{ data: retroDate, semAntecedencia: true }]);
            }} className="flex-1 py-2 bg-orange-500 text-white rounded-lg text-sm font-semibold disabled:opacity-40" disabled={!retroDate}>
              Sem antecedência
            </button>
          </div>
          <button onClick={() => setRetroModal(false)} className="w-full py-2 border border-gray-300 rounded-lg text-sm text-gray-600">Cancelar</button>
        </div>
      )}

      {tiposModal && (
        <div className="bg-orange-50 border border-orange-200 rounded-xl p-4 space-y-3">
          <div className="font-semibold text-orange-800 text-sm">⚠️ Falta registrada com menos de 24h de antecedência</div>
          <div className="text-xs text-orange-700">Classifique cada data:</div>
          {tiposModal.map((item, i) => (
            <div key={item.data} className="flex items-center justify-between gap-3">
              <span className="text-sm font-medium text-gray-800">{fmtBRFull(item.data)}</span>
              <div className="flex gap-2">
                <button
                  onClick={() => setTiposModal(prev => prev.map((x, j) => j === i ? { ...x, semAntecedencia: false } : x))}
                  className={`text-xs px-3 py-1.5 rounded-lg border font-medium transition-colors ${!item.semAntecedencia ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 border-gray-300'}`}>
                  Comum
                </button>
                <button
                  onClick={() => setTiposModal(prev => prev.map((x, j) => j === i ? { ...x, semAntecedencia: true } : x))}
                  className={`text-xs px-3 py-1.5 rounded-lg border font-medium transition-colors ${item.semAntecedencia ? 'bg-orange-500 text-white border-orange-500' : 'bg-white text-gray-600 border-gray-300'}`}>
                  Sem antecedência
                </button>
              </div>
            </div>
          ))}
          <div className="flex gap-2 pt-1">
            <button onClick={() => setTiposModal(null)} className="flex-1 py-2 border border-gray-300 rounded-lg text-sm text-gray-600">Cancelar</button>
            <button onClick={() => {
              const datasComTipo = selectedDates.map(d => {
                const found = tiposModal.find(x => x.data === d);
                return { data: d, semAntecedencia: found ? found.semAntecedencia : false };
              });
              doSubmit(datasComTipo);
            }} className="flex-1 py-2 bg-orange-500 text-white rounded-lg text-sm font-semibold">Confirmar</button>
          </div>
        </div>
      )}
      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!turmaId || !alunoNome || !selectedDates.length}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Registrar Falta
      </button>
    </div>
  );
}

// ==================== TAB: REGISTRAR REPOSIÇÃO ====================
function TabRegistrarReposicao({ state, dispatch }) {
  const [turmaOrigemId, setTurmaOrigemId] = useState('');
  const [alunoNome, setAlunoNome]         = useState('');
  const [vagaSel, setVagaSel]             = useState(''); // vagaId | 'livre'
  const [extraData, setExtraData]         = useState('');
  const [extraTurma, setExtraTurma]       = useState('');
  const [tipoManual, setTipoManual]       = useState('reposicao'); // quando !hasPending + isManual
  const [creditoId, setCreditoId]         = useState('');
  const [success, setSuccess]             = useState('');

  const td     = todayStr();
  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turmaOrigem = state.turmas.find(t => t.id === turmaOrigemId);

  // Vagas futuras ordenadas e sem duplicatas
  const vagasFuturas = useMemo(() => {
    const seen = new Set();
    return [...state.vagas]
      .filter(v => v.data >= td)
      .sort((a, b) => {
        if (a.data !== b.data) return a.data.localeCompare(b.data);
        const ha = state.turmas.find(t => t.id === a.turmaId)?.horario || '';
        const hb = state.turmas.find(t => t.id === b.turmaId)?.horario || '';
        return ha.localeCompare(hb);
      })
      .filter(v => {
        const key = `${v.data}|${v.turmaId}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }, [state.vagas, state.turmas, td]);

  const hasPending  = alunoNome ? state.faltas.some(f => f.alunoNome === alunoNome && f.status === 'pendente') : false;
  const isManual    = vagaSel === 'livre';
  const vagaObj     = !isManual && vagaSel ? state.vagas.find(v => v.id === vagaSel) : null;
  const dataRepo    = isManual ? extraData   : (vagaObj?.data || '');
  const turmaRepoId = isManual ? extraTurma  : (vagaObj?.turmaId || '');
  const turmaRepo   = state.turmas.find(t => t.id === turmaRepoId);

  // Tipo: com falta pendente → sempre reposicao
  //       sem falta + vaga oficial → reposicao sem falta vinculada
  //       sem falta + manual → tipoManual (escolha explícita)
  const tipo = hasPending ? 'reposicao' : (isManual ? tipoManual : 'reposicao');

  const faltaInfo = useMemo(() => {
    if (!alunoNome) return null;
    const pending = state.faltas
      .filter(f => f.alunoNome === alunoNome && f.status === 'pendente')
      .sort((a, b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));
    if (!pending.length) return null;
    const oldest = pending[0];
    return { turmaId: oldest.turmaId, datas: oldest.datas, expiry: getFaltaExpiry(oldest) };
  }, [alunoNome, state.faltas]);

  const creditosDisponiveis = useMemo(() => {
    if (!alunoNome || !turmaOrigemId) return [];
    return arr(state.creditos).filter(c =>
      c.alunoNome === alunoNome && c.turmaId === turmaOrigemId && !c.usado && c.dataExpiracao >= td
    );
  }, [alunoNome, turmaOrigemId, state.creditos, td]);

  const occupancy = useMemo(() => {
    if (!turmaRepoId || !dataRepo) return null;
    return calcOccupancy(turmaRepoId, dataRepo, state);
  }, [turmaRepoId, dataRepo, state]);

  const jaTemReposicao = !!(alunoNome && dataRepo && turmaRepoId &&
    state.reposicoes.some(r =>
      r.alunoNome === alunoNome && r.dataReposicao === dataRepo &&
      r.turmaReposicaoId === turmaRepoId && !r.realizada
    ));

  const canSubmit = turmaOrigemId && alunoNome && vagaSel && dataRepo && turmaRepoId && !jaTemReposicao;

  const handleSubmit = () => {
    if (!canSubmit) return;
    dispatch({
      type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId,
      dataReposicao: dataRepo, turmaReposicaoId: turmaRepoId,
      tipo, semVagaOficial: isManual, vagaSelId: vagaObj?.id || null,
      creditoId: (!faltaInfo && creditoId) ? creditoId : null
    });
    setSuccess(`${tipo === 'aula_extra' ? 'Aula extra' : 'Reposição'} de ${alunoNome} agendada para ${fmtBRFull(dataRepo)}.`);
    setAlunoNome(''); setVagaSel(''); setExtraData(''); setExtraTurma(''); setTipoManual('reposicao'); setCreditoId('');
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Registrar Reposição</h3>

      {/* 1. Turma de origem */}
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaOrigemId} onChange={e => { setTurmaOrigemId(e.target.value); setAlunoNome(''); setVagaSel(''); }}
          className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => (
            <option key={t.id} value={t.id}>{t.id === TURMA_EXTRA_ID ? 'Alunos Extras & Ex-alunos' : `${EXTENSO[t.diaSemana]} ${t.horario}`}</option>
          ))}
        </select>
      </div>

      {/* 2. Aluno */}
      {turmaOrigem && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => { setAlunoNome(e.target.value); setVagaSel(''); setTipoManual('reposicao'); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {[...turmaOrigem.alunos].sort((a,b) => a.localeCompare(b,'pt')).map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {turmaOrigem.alunos.length === 0 && (
            <p className="text-amber-600 text-sm mt-1">Esta turma não tem alunos cadastrados.</p>
          )}
        </div>
      )}

      {/* Info: falta mais antiga */}
      {alunoNome && faltaInfo && (
        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm">
          <div className="font-medium text-blue-800">Falta mais antiga a consumir:</div>
          <div className="text-blue-700 mt-0.5">
            {getTurmaLabel(state.turmas, faltaInfo.turmaId)} — <strong>{fmtDatesText(faltaInfo.datas)}</strong>
          </div>
          <div className="text-blue-600 mt-0.5">Expira em: {fmtBRFull(faltaInfo.expiry)}</div>
        </div>
      )}

      {/* Info: crédito extra disponível */}
      {alunoNome && !faltaInfo && creditosDisponiveis.length > 0 && (
        <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 text-sm">
          <div className="font-medium text-purple-800">Crédito extra disponível:</div>
          {creditosDisponiveis.map(c => (
            <label key={c.id} className="flex items-center gap-2 mt-1 cursor-pointer">
              <input type="radio" name="creditoSel" value={c.id} checked={creditoId === c.id} onChange={() => setCreditoId(c.id)} />
              <span className="text-purple-700">Expira {fmtBRFull(c.dataExpiracao)}</span>
            </label>
          ))}
        </div>
      )}

      {/* 3. Vaga */}
      {alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Vaga</label>
          <select value={vagaSel} onChange={e => { setVagaSel(e.target.value); setExtraData(''); setExtraTurma(''); setTipoManual('reposicao'); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione a vaga —</option>
            {vagasFuturas.map(v => {
              const t = state.turmas.find(x => x.id === v.turmaId);
              const dia = getDiaSemanaFromDateStr(v.data);
              return (
                <option key={v.id} value={v.id}>
                  {fmtBRFull(v.data)} ({ABREV[dia]}) — {t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}{v.vagaExtra ? ' ✦ vaga extra' : ''}
                </option>
              );
            })}
            <option value="livre">✦ Escolher data / turma</option>
          </select>
          {vagasFuturas.length === 0 && !isManual && (
            <p className="text-gray-400 text-sm mt-1">Nenhuma vaga aberta no momento.</p>
          )}
        </div>
      )}

      {/* Campos para data/turma livre */}
      {isManual && (
        <div className="space-y-3 pl-3 border-l-2 border-blue-300">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Data</label>
            <input type="date" value={extraData} min={td} onChange={e => setExtraData(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
            <select value={extraTurma} onChange={e => setExtraTurma(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2">
              <option value="">— Selecione a turma —</option>
              {sorted.map(t => (
                <option key={t.id} value={t.id}>{t.id === TURMA_EXTRA_ID ? 'Alunos Extras & Ex-alunos' : `${EXTENSO[t.diaSemana]} ${t.horario}`}</option>
              ))}
            </select>
          </div>
          {/* Quando não tem falta pendente, pergunta o tipo */}
          {!hasPending && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Tipo</label>
              <div className="flex gap-3">
                <label className={`flex-1 flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${tipoManual === 'reposicao' ? 'border-blue-500 bg-blue-50' : 'border-gray-200'}`}>
                  <input type="radio" name="tipoManual" value="reposicao" checked={tipoManual === 'reposicao'} onChange={() => setTipoManual('reposicao')} />
                  <span className="text-sm font-medium">Reposição sem falta vinculada</span>
                </label>
                <label className={`flex-1 flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${tipoManual === 'aula_extra' ? 'border-purple-500 bg-purple-50' : 'border-gray-200'}`}>
                  <input type="radio" name="tipoManual" value="aula_extra" checked={tipoManual === 'aula_extra'} onChange={() => setTipoManual('aula_extra')} />
                  <span className="text-sm font-medium">Aula extra</span>
                </label>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Ocupação prevista */}
      {occupancy !== null && turmaRepo && (
        <div className={`rounded-lg px-3 py-2 text-sm font-medium border ${
          occupancy + 1 > turmaRepo.capacidade
            ? 'bg-red-50 text-red-700 border-red-200'
            : occupancy + 1 === turmaRepo.capacidade
              ? 'bg-amber-50 text-amber-700 border-amber-200'
              : 'bg-green-50 text-green-700 border-green-200'
        }`}>
          {getTurmaLabel(state.turmas, turmaRepoId)} em {fmtBRFull(dataRepo)}:{' '}
          {occupancy + 1}/{turmaRepo.capacidade} alunos esperados
          {occupancy + 1 > turmaRepo.capacidade && ' ⚠️ Acima da capacidade!'}
        </div>
      )}

      {jaTemReposicao && (
        <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700 font-medium">
          {alunoNome} já tem reposição marcada nesse horário ({getTurmaLabel(state.turmas, turmaRepoId)}, {fmtBRFull(dataRepo)}).
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!canSubmit}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Confirmar Reposição
      </button>
    </div>
  );
}

// ==================== TAB: CANCELAR REPOSIÇÃO ====================
function TabCancelarReposicao({ state, dispatch }) {
  const [selectedId, setSelectedId] = useState('');
  const [confirm, setConfirm] = useState(false);
  const [success, setSuccess] = useState('');
  const td = todayStr();

  const futuras = useMemo(() => state.reposicoes
    .filter(r => !r.realizada && r.dataReposicao >= td)
    .sort((a,b) => {
      if (a.dataReposicao !== b.dataReposicao) return a.dataReposicao.localeCompare(b.dataReposicao);
      const ta = state.turmas.find(t => t.id === a.turmaReposicaoId);
      const tb = state.turmas.find(t => t.id === b.turmaReposicaoId);
      return (ta?.horario || '').localeCompare(tb?.horario || '');
    }), [state.reposicoes, state.turmas, td]);
  const repo = futuras.find(r => r.id === selectedId);

  const handleCancel = () => {
    dispatch({ type: 'CANCEL_REPOSICAO', id: selectedId });
    setSuccess(`Reposição de ${repo.alunoNome} em ${fmtBRFull(repo.dataReposicao)} cancelada.`);
    setSelectedId(''); setConfirm(false);
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Cancelar Reposição</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Reposição agendada</label>
        <select value={selectedId} onChange={e => setSelectedId(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione —</option>
          {futuras.map(r => (
            <option key={r.id} value={r.id}>
              {r.alunoNome} — {fmtBRFull(r.dataReposicao)} ({getTurmaLabel(state.turmas, r.turmaReposicaoId)}) {r.tipo==='aula_extra' ? '· Aula extra' : ''}
            </option>
          ))}
        </select>
        {futuras.length === 0 && <p className="text-gray-400 text-sm mt-1">Nenhuma reposição futura agendada.</p>}
      </div>

      {repo && (
        <div className="bg-gray-50 rounded-lg p-3 text-sm space-y-1">
          <div><span className="font-medium">Aluno:</span> {repo.alunoNome}</div>
          <div><span className="font-medium">Data:</span> {fmtBRFull(repo.dataReposicao)}</div>
          <div><span className="font-medium">Turma:</span> {getTurmaLabel(state.turmas, repo.turmaReposicaoId)}</div>
          <div><span className="font-medium">Tipo:</span> {repo.tipo === 'reposicao' ? 'Reposição de falta' : 'Aula extra'}</div>
          {repo.tipo === 'reposicao' && <div className="text-blue-600">A falta vinculada voltará para pendente e a vaga será reaberta.</div>}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={() => setConfirm(true)}
        disabled={!selectedId}
        className="w-full py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Cancelar Reposição
      </button>

      {confirm && repo && (
        <ConfirmModal
          title="Cancelar reposição?" danger
          message={`Cancelar a reposição de ${repo.alunoNome} em ${fmtBRFull(repo.dataReposicao)}?`}
          onConfirm={handleCancel}
          onCancel={() => setConfirm(false)}
          confirmLabel="Cancelar reposição"
        />
      )}
    </div>
  );
}

// ==================== TAB: AUSÊNCIA PROGRAMADA ====================
function TabAusenciaProgramada({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [tipo, setTipo] = useState('ferias');
  const [mesAno, setMesAno] = useState('');
  const [success, setSuccess] = useState('');

  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turma = state.turmas.find(t => t.id === turmaId);

  // Current month as default
  useEffect(() => {
    const d = new Date();
    setMesAno(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }, []);

  const handleSubmit = () => {
    if (!turmaId || !alunoNome || !mesAno) return;
    dispatch({ type: 'ADD_AUSENCIA', alunoNome, turmaId, tipo, mesAno });
    setSuccess(`Ausência de ${alunoNome} em ${getMesNome(mesAno)} registrada.`);
    setAlunoNome('');
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Ausência Programada (Férias)</h3>

      <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-700">
        Aluno em férias recebe <strong>1 crédito de reposição</strong> e libera vagas nas suas aulas do mês. O prazo expira 30 dias após o último dia do mês.
        <div className="mt-1 text-blue-600 text-xs">Julho, dezembro e janeiro (recesso) não geram crédito, mas ainda liberam vagas.</div>
      </div>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); }} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => <option key={t.id} value={t.id}>{EXTENSO[t.diaSemana]} {t.horario}</option>)}
        </select>
      </div>

      {turma && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => setAlunoNome(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {turma.alunos.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      )}

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de ausência</label>
        <select value={tipo} onChange={e => setTipo(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="ferias">Férias</option>
        </select>
      </div>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Mês de ausência</label>
        <input type="month" value={mesAno} onChange={e => setMesAno(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>

      {mesAno && (
        <div className="text-sm text-gray-500">
          Prazo para reposição: até {fmtBRFull((() => { const d = parseDate(getLastDayOfMonth(mesAno)); d.setDate(d.getDate()+30); return dateToStr(d); })())}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!turmaId || !alunoNome || !mesAno}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Registrar Ausência
      </button>

      {/* List current ausencias */}
      {state.ausencias.length > 0 && (
        <div className="mt-4 border-t border-gray-200 pt-4">
          <h4 className="text-sm font-semibold text-gray-600 mb-2">Ausências registradas</h4>
          <div className="space-y-2">
            {state.ausencias.map(a => {
              const turmaAus = state.turmas.find(t => t.id === a.turmaId);
              const [ayy, amo] = a.mesAno.split('-').map(Number);
              const firstDay = a.mesAno + '-01';
              const lastDay = dateToStr(new Date(ayy, amo, 0));
              const expectedDates = turmaAus ? getClassDatesInRange(turmaAus, firstDay, lastDay) : [];
              const todasDatas = expectedDates.map(date => {
                if (isRecesso(date)) return { data: date, consumida: false, por: null, recesso: true };
                const vagaAberta = state.vagas.find(v => v.ausenciaId === a.id && v.data === date);
                if (vagaAberta) return { data: date, consumida: false, por: null };
                const repoConsumiu = state.reposicoes.find(r => r.vagaConsumedAusenciaId === a.id && r.dataReposicao === date);
                return { data: date, consumida: true, por: repoConsumiu?.alunoNome || null };
              });
              const semCredito = a.creditoReposicao === 0;
              return (
              <div key={a.id} className="bg-gray-50 rounded-lg p-3 text-sm">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="font-medium">{a.alunoNome}</span>
                    <span className="text-gray-400 ml-2">({getTurmaLabel(state.turmas, a.turmaId)})</span>
                    <div className="text-gray-500 mt-0.5">Férias: {getMesNome(a.mesAno)} — Crédito: {semCredito ? <span className="text-red-500">indisponível</span> : a.creditoUsado ? <span className="text-green-600">usado</span> : <span className="text-amber-600">disponível</span>}</div>
                    {todasDatas.length > 0 && (
                      <div className="text-xs text-teal-600 mt-0.5">
                        Vagas liberadas:{' '}
                        {todasDatas.map((v, i) => (
                          <span key={i}>
                            {i > 0 && ', '}
                            {v.recesso
                              ? <span className="text-gray-400" title="Recesso do ateliê">🏠 {fmtBR(v.data).slice(0,5)}</span>
                              : v.consumida
                              ? <span className="text-gray-400 line-through" title={v.por ? `Ocupada por ${v.por}` : ''}>{fmtBR(v.data)}</span>
                              : <span>{fmtBR(v.data)}</span>
                            }
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                  <button onClick={() => dispatch({type:'DELETE_AUSENCIA', id: a.id})} className="text-red-400 hover:text-red-600 text-xs ml-2 shrink-0">Remover</button>
                </div>
              </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function TabCancelarFalta({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [faltaId, setFaltaId] = useState('');
  const [confirm, setConfirm] = useState(false);
  const [success, setSuccess] = useState('');
  const td = todayStr();

  const faltasFuturas = useMemo(() =>
    state.faltas.filter(f => f.status === 'pendente' && f.datas[0] >= td),
    [state.faltas, td]);

  const turmas = useMemo(() => {
    const ids = new Set(faltasFuturas.map(f => f.turmaId));
    return sortTurmas(state.turmas.filter(t => ids.has(t.id)));
  }, [faltasFuturas, state.turmas]);

  const alunos = useMemo(() => {
    if (!turmaId) return [];
    const nomes = [...new Set(faltasFuturas.filter(f => f.turmaId === turmaId).map(f => f.alunoNome))].sort();
    return nomes;
  }, [turmaId, faltasFuturas]);

  const faltas = useMemo(() => {
    if (!turmaId || !alunoNome) return [];
    return faltasFuturas.filter(f => f.turmaId === turmaId && f.alunoNome === alunoNome)
      .sort((a,b) => a.datas[0].localeCompare(b.datas[0]));
  }, [turmaId, alunoNome, faltasFuturas]);

  const falta = faltas.find(f => f.id === faltaId);
  const repoVinc = falta ? state.reposicoes.find(r => r.vagaConsumedFaltaId === falta.id) : null;
  const outraVaga = repoVinc ? state.vagas.find(v =>
    v.turmaId === repoVinc.turmaReposicaoId && v.data === repoVinc.dataReposicao && v.faltaId !== falta.id
  ) : null;

  const handleCancel = () => {
    dispatch({ type: 'CANCEL_FALTA', id: faltaId });
    setSuccess(`Falta de ${alunoNome} em ${fmtBRFull(falta.datas[0])} cancelada.`);
    setTurmaId(''); setAlunoNome(''); setFaltaId(''); setConfirm(false);
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Cancelar Falta</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); setFaltaId(''); }}
          className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione —</option>
          {turmas.map(t => <option key={t.id} value={t.id}>{getTurmaLabel(state.turmas, t.id)}</option>)}
        </select>
      </div>

      {turmaId && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => { setAlunoNome(e.target.value); setFaltaId(''); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione —</option>
            {alunos.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
      )}

      {alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Falta</label>
          <select value={faltaId} onChange={e => setFaltaId(e.target.value)}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione —</option>
            {faltas.map(f => <option key={f.id} value={f.id}>{fmtBRFull(f.datas[0])}</option>)}
          </select>
        </div>
      )}

      {falta && (
        <div className="bg-gray-50 rounded-lg p-3 text-sm space-y-1">
          <div><span className="font-medium">Aluno:</span> {falta.alunoNome}</div>
          <div><span className="font-medium">Data:</span> {fmtBRFull(falta.datas[0])}</div>
          <div><span className="font-medium">Turma:</span> {getTurmaLabel(state.turmas, falta.turmaId)}</div>
          {repoVinc && (
            <div className={`mt-1 text-xs px-2 py-1 rounded ${outraVaga ? 'bg-amber-50 text-amber-700' : 'bg-orange-50 text-orange-700'}`}>
              {outraVaga
                ? `A reposição de ${repoVinc.alunoNome} em ${fmtBRFull(repoVinc.dataReposicao)} será vinculada a outra vaga disponível.`
                : `A reposição de ${repoVinc.alunoNome} em ${fmtBRFull(repoVinc.dataReposicao)} ficará sem vaga vinculada.`}
            </div>
          )}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={() => setConfirm(true)}
        disabled={!faltaId}
        className="w-full py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Cancelar Falta
      </button>

      {confirm && falta && (
        <ConfirmModal
          title="Cancelar falta?" danger
          message={`Cancelar a falta de ${falta.alunoNome} em ${fmtBRFull(falta.datas[0])}?`}
          onConfirm={handleCancel}
          onCancel={() => setConfirm(false)}
          confirmLabel="Cancelar falta"
        />
      )}
    </div>
  );
}

// ==================== GERENCIAR ALUNO MODAL ====================
function GerenciarAlunoModal({ turma, state, dispatch, onClose }) {
  const td = todayStr();
  const [expanded, setExpanded] = useState(null);
  const [renames, setRenames] = useState({});
  const [confirmRemove, setConfirmRemove] = useState(null);
  const otherTurmas = useMemo(() => sortTurmas(state.turmas).filter(t => t.id !== turma.id), [state.turmas, turma.id]);

  const canChangeTurma = (nome, destinoId) => {
    if (destinoId === TURMA_EXTRA_ID) return { can: true };
    const hasFutureFalta = state.faltas.some(f =>
      f.turmaId === turma.id && f.alunoNome === nome && f.datas.some(d => d >= td)
    );
    if (hasFutureFalta) return { can: false, reason: 'tem faltas futuras marcadas' };
    const hasFutureAusencia = state.ausencias.some(a =>
      a.turmaId === turma.id && a.alunoNome === nome && a.mesAno >= td.slice(0, 7)
    );
    if (hasFutureAusencia) return { can: false, reason: 'tem férias futuras marcadas' };
    return { can: true };
  };

  const hasPendencies = (nome) =>
    state.faltas.some(f => f.turmaId === turma.id && f.alunoNome === nome && f.status === 'pendente') ||
    state.reposicoes.some(r => r.turmaOrigemId === turma.id && r.alunoNome === nome && !r.realizada);

  const handleRename = (oldNome) => {
    const n = (renames[oldNome] ?? oldNome).trim();
    if (n && n !== oldNome) dispatch({ type: 'RENAME_ALUNO', turmaId: turma.id, oldNome, newNome: n });
  };

  const sorted = useMemo(() => [...turma.alunos].sort((a,b) => a.localeCompare(b,'pt')), [turma.alunos]);

  return (
    <Modal title={`Gerenciar alunos — ${ABREV[turma.diaSemana]} ${turma.horario}`} onClose={onClose}>
      {confirmRemove && (
        <div className="mb-4 bg-red-50 border border-red-200 rounded-lg p-3 text-sm space-y-2">
          <p className="text-red-700 font-medium">Remover <strong>{confirmRemove}</strong> da turma?</p>
          {hasPendencies(confirmRemove) && <p className="text-red-500 text-xs">⚠️ Este aluno tem faltas ou reposições pendentes.</p>}
          <div className="flex gap-2">
            <button onClick={() => { dispatch({ type:'REMOVE_ALUNO', turmaId: turma.id, nome: confirmRemove }); onClose(); }}
              className="px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs hover:bg-red-700">Confirmar</button>
            <button onClick={() => setConfirmRemove(null)} className="px-3 py-1.5 border border-gray-300 rounded-lg text-xs">Cancelar</button>
          </div>
        </div>
      )}
      <div className="space-y-1">
        {sorted.map(nome => {
          const isOpen = expanded === nome;
          const changeableDefault = canChangeTurma(nome, null);
          const renameVal = renames[nome] !== undefined ? renames[nome] : nome;
          return (
            <div key={nome} className="border border-gray-200 rounded-xl overflow-hidden">
              <button
                onClick={() => setExpanded(isOpen ? null : nome)}
                className="w-full flex items-center justify-between px-3 py-2.5 bg-gray-50 hover:bg-gray-100 transition-colors text-left"
              >
                <span className="text-sm font-medium text-gray-800">{nome}</span>
                <span className="text-gray-400 text-xs ml-2">{isOpen ? '▲' : '▼'}</span>
              </button>
              {isOpen && (
                <div className="px-3 pb-3 pt-2 bg-white space-y-2 border-t border-gray-100">
                  <div className="flex gap-2 items-center">
                    <input
                      className="flex-1 border border-gray-300 rounded-lg px-2 py-1.5 text-sm"
                      value={renameVal}
                      onChange={e => setRenames(r => ({ ...r, [nome]: e.target.value }))}
                      onKeyDown={e => { if (e.key === 'Enter') { handleRename(nome); onClose(); } }}
                      placeholder="Renomear…"
                    />
                    {renameVal.trim() !== nome && renameVal.trim() !== '' && (
                      <button onClick={() => { handleRename(nome); onClose(); }}
                        className="text-xs px-2.5 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shrink-0">
                        Salvar
                      </button>
                    )}
                  </div>
                  <div>
                    <select
                      value=""
                      onChange={e => {
                        if (!e.target.value) return;
                        const check = canChangeTurma(nome, e.target.value);
                        if (!check.can) return;
                        dispatch({ type:'CHANGE_TURMA_ALUNO', oldTurmaId: turma.id, newTurmaId: e.target.value, alunoNome: nome });
                        onClose();
                      }}
                      className="w-full border border-gray-300 rounded-lg px-2 py-1.5 text-sm bg-white"
                    >
                      <option value="">Mover para outra turma…</option>
                      {otherTurmas.map(t => {
                        const check = canChangeTurma(nome, t.id);
                        return <option key={t.id} value={t.id} disabled={!check.can}>{getTurmaLabel(state.turmas, t.id)}{!check.can ? ` (${check.reason})` : ''}</option>;
                      })}
                    </select>
                    {!changeableDefault.can && (
                      <p className="text-xs text-amber-600 mt-1">⚠️ {changeableDefault.reason} — só Turma Extra disponível</p>
                    )}
                  </div>
                  <button onClick={() => { setExpanded(null); setConfirmRemove(nome); }}
                    className="text-xs text-red-400 hover:text-red-600 transition-colors">
                    Remover aluno
                  </button>
                </div>
              )}
            </div>
          );
        })}
        {sorted.length === 0 && <p className="text-sm text-gray-400 text-center py-4">Nenhum aluno nesta turma.</p>}
      </div>
    </Modal>
  );
}

// ==================== TAB: CRÉDITO EXTRA ====================
function TabCreditoExtra({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [dataExpiracao, setDataExpiracao] = useState('');
  const [success, setSuccess] = useState('');
  const td = todayStr();

  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turma = state.turmas.find(t => t.id === turmaId);

  useEffect(() => {
    const d = new Date();
    d.setDate(d.getDate() + 30);
    setDataExpiracao(dateToStr(d));
  }, []);

  const handleSubmit = () => {
    if (!turmaId || !alunoNome || !dataExpiracao) return;
    const prof = localStorage.getItem(PROFESSOR_KEY) || '';
    dispatch({ type: 'ADD_CREDITO', alunoNome, turmaId, dataExpiracao, professor: prof });
    setSuccess(`Crédito de reposição adicionado para ${alunoNome}.`);
    setAlunoNome('');
    setTimeout(() => setSuccess(''), 4000);
  };

  const creditos = useMemo(() => arr(state.creditos).filter(c => !c.usado && c.dataExpiracao >= td), [state.creditos, td]);
  const creditosExpirados = useMemo(() => arr(state.creditos).filter(c => !c.usado && c.dataExpiracao < td), [state.creditos, td]);

  return (
    <div className="space-y-4">
      <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 text-sm text-purple-700">
        Dar um crédito de reposição avulso ao aluno. Ele pode usar para marcar uma reposição sem precisar de uma falta registrada.
      </div>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); }} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => <option key={t.id} value={t.id}>{t.id === TURMA_EXTRA_ID ? 'Alunos Extras & Ex-alunos' : `${EXTENSO[t.diaSemana]} ${t.horario}`}</option>)}
        </select>
      </div>

      {turma && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => setAlunoNome(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {[...turma.alunos].sort((a,b) => a.localeCompare(b,'pt')).map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      )}

      {alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Data de expiração</label>
          <input type="date" value={dataExpiracao} min={td} onChange={e => setDataExpiracao(e.target.value)}
            className="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!turmaId || !alunoNome || !dataExpiracao}
        className="w-full py-2.5 bg-purple-600 text-white rounded-lg font-medium hover:bg-purple-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Dar Crédito
      </button>

      {creditos.length > 0 && (
        <div className="mt-4 border-t border-gray-200 pt-4">
          <h4 className="text-sm font-semibold text-gray-600 mb-2">Créditos ativos</h4>
          <div className="space-y-2">
            {[...creditos].sort((a, b) => {
              const turmaOrder = sortTurmas(state.turmas).map(t => t.id);
              const ai = turmaOrder.indexOf(a.turmaId); const bi = turmaOrder.indexOf(b.turmaId);
              if (ai !== bi) return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
              return a.alunoNome.localeCompare(b.alunoNome, 'pt');
            }).map(c => (
              <div key={c.id} className="bg-gray-50 rounded-lg p-3 text-sm flex justify-between items-center">
                <div>
                  <span className="font-medium">{c.alunoNome}</span>
                  <span className="text-gray-400 ml-2">({getTurmaLabel(state.turmas, c.turmaId)})</span>
                  <div className="text-gray-500 mt-0.5">Expira: {fmtBRFull(c.dataExpiracao)}</div>
                  {(c.criadoPor || c.criadoEm) && (
                    <div className="text-gray-400 text-xs mt-0.5">
                      {c.criadoPor && <span>por {c.criadoPor}</span>}
                      {c.criadoEm && <span> · {fmtBR(c.criadoEm.slice(0,10))}</span>}
                    </div>
                  )}
                </div>
                <button onClick={() => dispatch({type:'DELETE_CREDITO', id: c.id})} className="text-red-400 hover:text-red-600 text-xs ml-2 shrink-0">Remover</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {creditosExpirados.length > 0 && (
        <div className="mt-2 border-t border-gray-100 pt-3">
          <h4 className="text-sm font-semibold text-gray-400 mb-2">Expirados</h4>
          <div className="space-y-1">
            {creditosExpirados.map(c => (
              <div key={c.id} className="bg-gray-50 rounded-lg px-3 py-2 text-sm flex justify-between items-center opacity-60">
                <div>
                  <span className="font-medium">{c.alunoNome}</span>
                  <span className="text-gray-400 ml-2 text-xs">expirou {fmtBRFull(c.dataExpiracao)}</span>
                </div>
                <button onClick={() => dispatch({type:'DELETE_CREDITO', id: c.id})} className="text-red-400 hover:text-red-600 text-xs ml-2">Remover</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
