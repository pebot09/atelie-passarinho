// ==================== HELPERS ====================
function parseDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dateToStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function fmtBR(dateStr) {
  if (!dateStr) return '';
  const [,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}

function fmtBRFull(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function fmtDatesText(datas) {
  const sorted = [...datas].sort();
  const br = sorted.map(fmtBR);
  if (br.length === 1) return br[0];
  if (br.length === 2) return `${br[0]} e ${br[1]}`;
  return br.slice(0,-1).join(', ') + ' e ' + br[br.length-1];
}

function getNextOccurrences(diaSemana, n = 8) {
  const target = DIA_JS[diaSemana];
  const dates = [];
  const d = new Date();
  d.setHours(0,0,0,0);
  while (dates.length < n) {
    if (d.getDay() === target) dates.push(dateToStr(d));
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

function getDiaSemanaFromDateStr(dateStr) {
  const d = parseDate(dateStr);
  const names = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  return names[d.getDay()];
}

function getFaltaEarliest(falta) {
  return [...falta.datas].sort()[0];
}

function getFaltaExpiry(falta) {
  const d = parseDate(getFaltaEarliest(falta));
  d.setDate(d.getDate() + 30);
  return dateToStr(d);
}

function getAusenciaExpiry(aus) {
  const [y,m] = aus.mesAno.split('-').map(Number);
  const last = new Date(y, m, 0);
  last.setDate(last.getDate() + 30);
  return dateToStr(last);
}

function getLastDayOfMonth(mesAno) {
  const [y,m] = mesAno.split('-').map(Number);
  return dateToStr(new Date(y, m, 0));
}

function getMesNome(mesAno) {
  const [,m] = mesAno.split('-').map(Number);
  return MESES_PT[m-1];
}

function genId(prefix='id') {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).substr(2,6)}`;
}

function getTurmaLabel(turmas, id) {
  const t = turmas.find(x => x.id === id);
  if (!t) return '?';
  return `${ABREV[t.diaSemana]} ${t.horario}`;
}

function sortTurmas(turmas) {
  return [...turmas].sort((a,b) => {
    const da = DIAS_ORDER.indexOf(a.diaSemana), db = DIAS_ORDER.indexOf(b.diaSemana);
    if (da !== db) return da - db;
    return a.horario.localeCompare(b.horario);
  });
}

function calcOccupancy(turmaId, date, state) {
  const turma = state.turmas.find(t => t.id === turmaId);
  if (!turma) return 0;
  const faltasOnDate = state.faltas.filter(f =>
    f.turmaId === turmaId && f.datas.includes(date) &&
    (f.status === 'pendente' || f.status === 'marcada')
  ).length;
  const repos = state.reposicoes.filter(r =>
    r.turmaReposicaoId === turmaId && r.dataReposicao === date && !r.realizada
  ).length;
  return turma.alunos.length - faltasOnDate + repos;
}

// ==================== REDUCER ====================
function reducer(state, action) {
  let next;
  switch (action.type) {

    case 'DISMISS_SEED_WARNING':
      next = {...state, _seedWarning: false};
      break;

    case 'ADD_TURMA': {
      const { diaSemana, horario, observacao } = action;
      const id = `${diaSemana.slice(0,3).replace('ç','c').replace('á','a')}-${horario}`;
      if (state.turmas.find(t => t.id === id)) return state;
      next = { ...state, turmas: [...state.turmas, { id, diaSemana, horario, capacidade: 8, observacao: observacao||'', alunos: [] }] };
      break;
    }

    case 'DELETE_TURMA': {
      next = {
        ...state,
        turmas: state.turmas.filter(t => t.id !== action.id),
        faltas: state.faltas.filter(f => f.turmaId !== action.id),
        vagas: state.vagas.filter(v => v.turmaId !== action.id),
        ausencias: state.ausencias.filter(a => a.turmaId !== action.id)
      };
      break;
    }

    case 'UPDATE_TURMA_OBS': {
      next = { ...state, turmas: state.turmas.map(t => t.id === action.id ? {...t, observacao: action.observacao} : t) };
      break;
    }

    case 'ADD_ALUNO': {
      next = { ...state, turmas: state.turmas.map(t => {
        if (t.id !== action.turmaId) return t;
        if (t.alunos.includes(action.nome)) return t;
        return {...t, alunos: [...t.alunos, action.nome]};
      })};
      break;
    }

    case 'REMOVE_ALUNO': {
      next = { ...state, turmas: state.turmas.map(t => {
        if (t.id !== action.turmaId) return t;
        return {...t, alunos: t.alunos.filter(a => a !== action.nome)};
      })};
      break;
    }

    case 'ADD_FALTA': {
      const { alunoNome, turmaId, datas } = action;
      const faltaId = genId('f');
      const newFalta = { id: faltaId, alunoNome, turmaId, datas, status: 'pendente' };
      // auto-create vagas, ignore duplicates
      const existingVagaKeys = new Set(state.vagas.map(v => `${v.turmaId}|${v.data}|${v.faltaId}`));
      const newVagas = datas
        .filter(d => !state.vagas.some(v => v.turmaId === turmaId && v.data === d && v.faltaId === faltaId))
        .map(d => ({ id: genId('v'), turmaId, data: d, faltaId }));
      next = { ...state, faltas: [...state.faltas, newFalta], vagas: [...state.vagas, ...newVagas] };
      break;
    }

    case 'ADD_REPOSICAO': {
      const { alunoNome, dataReposicao, turmaReposicaoId, tipo } = action;
      const repoId = genId('r');

      if (tipo === 'aula_extra') {
        const turmaOrigem = state.turmas.find(t => t.alunos.includes(alunoNome));
        next = { ...state, reposicoes: [...state.reposicoes, {
          id: repoId, alunoNome,
          turmaOrigemId: turmaOrigem?.id || null,
          faltaId: null, dataReposicao, turmaReposicaoId,
          tipo: 'aula_extra', realizada: false
        }]};
      } else {
        const pending = state.faltas
          .filter(f => f.alunoNome === alunoNome && f.status === 'pendente')
          .sort((a,b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));
        if (pending.length) {
          const oldest = pending[0];
          next = {
            ...state,
            faltas: state.faltas.map(f => f.id === oldest.id ? {...f, status:'marcada', reposicaoId: repoId} : f),
            reposicoes: [...state.reposicoes, {
              id: repoId, alunoNome,
              turmaOrigemId: oldest.turmaId, faltaId: oldest.id,
              dataReposicao, turmaReposicaoId, tipo: 'reposicao', realizada: false
            }],
            vagas: state.vagas.filter(v => v.faltaId !== oldest.id)
          };
        } else {
          // Reposição sem falta vinculada
          const turmaOrigem = state.turmas.find(t => t.alunos.includes(alunoNome));
          next = { ...state, reposicoes: [...state.reposicoes, {
            id: repoId, alunoNome,
            turmaOrigemId: turmaOrigem?.id || null,
            faltaId: null, dataReposicao, turmaReposicaoId,
            tipo: 'reposicao', realizada: false,
            semFaltaVinculada: true,
            observacao: 'Reposição sem falta vinculada — verificar'
          }]};
        }
      }
      break;
    }

    case 'CANCEL_REPOSICAO': {
      const repo = state.reposicoes.find(r => r.id === action.id);
      if (!repo) return state;
      let newFaltas = state.faltas;
      let newVagas = state.vagas;
      if (repo.faltaId) {
        // revert falta to pendente
        newFaltas = state.faltas.map(f => f.id === repo.faltaId ? {...f, status:'pendente', reposicaoId: undefined} : f);
        // reopen vagas for the original falta dates
        const falta = newFaltas.find(f => f.id === repo.faltaId);
        if (falta) {
          const extra = falta.datas
            .filter(d => !newVagas.some(v => v.turmaId === falta.turmaId && v.data === d && v.faltaId === falta.id))
            .map(d => ({ id: genId('v'), turmaId: falta.turmaId, data: d, faltaId: falta.id }));
          newVagas = [...newVagas, ...extra];
        }
      }
      next = {
        ...state,
        faltas: newFaltas,
        vagas: newVagas,
        reposicoes: state.reposicoes.filter(r => r.id !== action.id)
      };
      break;
    }

    case 'ADD_AUSENCIA': {
      const { alunoNome, turmaId, tipo, mesAno } = action;
      const ausId = genId('aus');
      next = {
        ...state,
        ausencias: [...state.ausencias, { id: ausId, alunoNome, turmaId, tipo, mesAno, creditoReposicao:1, creditoUsado:false }]
      };
      break;
    }

    case 'USE_AUSENCIA_CREDITO': {
      next = { ...state, ausencias: state.ausencias.map(a => a.id === action.id ? {...a, creditoUsado:true} : a) };
      break;
    }

    case 'DELETE_AUSENCIA': {
      next = { ...state, ausencias: state.ausencias.filter(a => a.id !== action.id) };
      break;
    }

    case 'SAVE_SNAPSHOT': {
      const snap = {
        id: genId('snap'),
        timestamp: new Date().toISOString(),
        label: action.label || fmtBRFull(todayStr()),
        conteudo: action.conteudo
      };
      const snaps = [snap, ...state.snapshots].slice(0, MAX_SNAPSHOTS);
      next = { ...state, snapshots: snaps };
      break;
    }

    case 'DELETE_SNAPSHOT': {
      next = { ...state, snapshots: state.snapshots.filter(s => s.id !== action.id) };
      break;
    }

    case 'IMPORT_MERGE': {
      const { faltas: newF = [], vagas: newV = [] } = action.data;
      const mergedFaltas = [...state.faltas];
      const mergedVagas = [...state.vagas];
      newF.forEach(f => {
        if (!mergedFaltas.find(x => x.alunoNome === f.alunoNome && x.turmaId === f.turmaId && JSON.stringify([...f.datas].sort()) === JSON.stringify([...x.datas].sort()))) {
          mergedFaltas.push(f);
        }
      });
      newV.forEach(v => {
        if (!mergedVagas.find(x => x.turmaId === v.turmaId && x.data === v.data)) {
          mergedVagas.push(v);
        }
      });
      next = { ...state, faltas: mergedFaltas, vagas: mergedVagas };
      break;
    }

    case 'CLEANUP': {
      const td = todayStr();
      const vagas = state.vagas.filter(v => v.data >= td);
      const reposicoes = state.reposicoes.map(r => r.dataReposicao < td ? {...r, realizada: true} : r);
      next = { ...state, vagas, reposicoes };
      break;
    }

    case 'SYNC_FROM_FIREBASE': {
      const td = todayStr();
      const incoming = action.data;
      next = {
        ...incoming,
        vagas: (incoming.vagas || []).filter(v => v.data >= td),
        reposicoes: (incoming.reposicoes || []).map(r => r.dataReposicao < td ? {...r, realizada: true} : r),
      };
      break;
    }

    default:
      return state;
  }

  // Persist locally as cache
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch(e) {}
  return next;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return SEED;
}

async function fetchFromFirebase() {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(`${DB_URL}/state.json`, { signal: ctrl.signal });
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

async function saveToFirebase(payload) {
  await fetch(`${DB_URL}/state.json`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
}

// ==================== MODAL ====================
function Modal({ title, children, onClose, danger }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);

  return (
    <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 p-4" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="bg-white rounded-xl shadow-2xl max-w-md w-full fade-in">
        <div className={`p-4 border-b flex justify-between items-center ${danger ? 'bg-red-50' : 'bg-gray-50'} rounded-t-xl`}>
          <h3 className={`font-semibold text-lg ${danger ? 'text-red-700' : 'text-gray-800'}`}>{title}</h3>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">×</button>
        </div>
        <div className="p-4">{children}</div>
      </div>
    </div>
  );
}

function ConfirmModal({ title, message, onConfirm, onCancel, danger, confirmLabel='Confirmar', children }) {
  return (
    <Modal title={title} onClose={onCancel} danger={danger}>
      {message && <p className="text-gray-700 mb-4">{message}</p>}
      {children}
      <div className="flex gap-2 justify-end mt-4">
        <button onClick={onCancel} className="px-4 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">Cancelar</button>
        <button onClick={onConfirm} className={`px-4 py-2 rounded-lg text-white font-medium ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}>{confirmLabel}</button>
      </div>
    </Modal>
  );
}

// ==================== SECTION 1: TURMAS ====================
function SectionTurmas({ state, dispatch }) {
  const [expandedId, setExpandedId] = useState(null);
  const [newNome, setNewNome] = useState({});
  const [addingAluno, setAddingAluno] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [newTurma, setNewTurma] = useState({ diaSemana:'segunda', horario:'09h', observacao:'' });
  const [showNewTurma, setShowNewTurma] = useState(false);
  const [editObs, setEditObs] = useState({});

  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);

  const hasPendencies = (turmaId, alunoNome) => {
    return state.faltas.some(f => f.turmaId === turmaId && f.alunoNome === alunoNome && f.status === 'pendente') ||
           state.reposicoes.some(r => r.turmaOrigemId === turmaId && r.alunoNome === alunoNome && !r.realizada);
  };

  const horarios = ['07h','08h','09h','10h','11h','12h','13h','14h','15h','16h','17h','18h','19h','20h','21h'];

  return (
    <div className="max-w-4xl mx-auto p-4 space-y-3">
      <div className="flex justify-between items-center mb-2">
        <h2 className="text-xl font-bold text-gray-800">Turmas</h2>
        <button onClick={() => setShowNewTurma(true)} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm">+ Nova Turma</button>
      </div>

      {sorted.map(turma => {
        const exp = expandedId === turma.id;
        const pct = turma.alunos.length / turma.capacidade;
        const over = turma.alunos.length > turma.capacidade;
        return (
          <div key={turma.id} className="bg-white rounded-xl shadow-sm border border-gray-200">
            <div className="flex items-center justify-between p-4 cursor-pointer" onClick={() => setExpandedId(exp ? null : turma.id)}>
              <div className="flex items-center gap-3">
                <div>
                  <div className="font-semibold text-gray-800 flex items-center gap-2">
                    {ABREV[turma.diaSemana]} {turma.horario}
                    {turma.observacao && <span className="text-gray-400 font-normal text-sm">({turma.observacao})</span>}
                  </div>
                  <div className="text-sm text-gray-500 mt-0.5">
                    <span className={`font-medium ${over ? 'text-red-600' : pct >= 0.875 ? 'text-amber-600' : 'text-green-600'}`}>
                      {turma.alunos.length}/{turma.capacidade}
                    </span>
                    <span className="ml-1">alunos</span>
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={e => { e.stopPropagation(); setConfirm({type:'deleteTurma', turma}); }} className="text-red-400 hover:text-red-600 text-sm px-2">Excluir</button>
                <span className="text-gray-400 text-lg">{exp ? '▲' : '▼'}</span>
              </div>
            </div>

            {exp && (
              <div className="border-t border-gray-100 p-4 fade-in">
                <div className="mb-3 flex gap-2">
                  <input
                    className="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
                    placeholder="Observação (ex: com Bia)"
                    value={editObs[turma.id] !== undefined ? editObs[turma.id] : turma.observacao}
                    onChange={e => setEditObs(prev => ({...prev, [turma.id]: e.target.value}))}
                  />
                  <button
                    onClick={() => { dispatch({type:'UPDATE_TURMA_OBS', id: turma.id, observacao: editObs[turma.id] ?? turma.observacao}); setEditObs(prev => ({...prev, [turma.id]: undefined})); }}
                    className="px-3 py-1.5 bg-gray-200 rounded-lg text-sm hover:bg-gray-300"
                  >Salvar</button>
                </div>

                <div className="space-y-1 mb-3">
                  {turma.alunos.length === 0 && <p className="text-gray-400 text-sm italic">Nenhum aluno cadastrado</p>}
                  {turma.alunos.map(nome => (
                    <div key={nome} className="flex justify-between items-center py-1.5 px-2 rounded-lg hover:bg-gray-50">
                      <span className="text-sm text-gray-700">{nome}</span>
                      <button onClick={() => {
                        if (hasPendencies(turma.id, nome)) {
                          setConfirm({type:'removeAlunoPendencias', turma, nome});
                        } else {
                          setConfirm({type:'removeAluno', turma, nome});
                        }
                      }} className="text-red-400 hover:text-red-600 text-xs px-2">Remover</button>
                    </div>
                  ))}
                </div>

                {addingAluno === turma.id ? (
                  <div className="flex gap-2">
                    <input
                      className="flex-1 border border-gray-300 rounded-lg px-3 py-1.5 text-sm"
                      placeholder="Nome do aluno"
                      value={newNome[turma.id] || ''}
                      onChange={e => setNewNome(prev => ({...prev, [turma.id]: e.target.value}))}
                      onKeyDown={e => {
                        if (e.key === 'Enter') {
                          const n = (newNome[turma.id]||'').trim();
                          if (n) { dispatch({type:'ADD_ALUNO', turmaId: turma.id, nome: n}); setNewNome(prev => ({...prev, [turma.id]: ''})); setAddingAluno(null); }
                        }
                        if (e.key === 'Escape') setAddingAluno(null);
                      }}
                      autoFocus
                    />
                    <button onClick={() => {
                      const n = (newNome[turma.id]||'').trim();
                      if (n) { dispatch({type:'ADD_ALUNO', turmaId: turma.id, nome: n}); setNewNome(prev => ({...prev, [turma.id]: ''})); }
                      setAddingAluno(null);
                    }} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">OK</button>
                    <button onClick={() => setAddingAluno(null)} className="px-3 py-1.5 border border-gray-300 rounded-lg text-sm">✕</button>
                  </div>
                ) : (
                  <button onClick={() => setAddingAluno(turma.id)} className="text-sm text-blue-600 hover:text-blue-800 font-medium">+ Adicionar aluno</button>
                )}
              </div>
            )}
          </div>
        );
      })}

      {showNewTurma && (
        <Modal title="Nova Turma" onClose={() => setShowNewTurma(false)}>
          <div className="space-y-3">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Dia da semana</label>
              <select value={newTurma.diaSemana} onChange={e => setNewTurma(p => ({...p, diaSemana: e.target.value}))} className="w-full border border-gray-300 rounded-lg px-3 py-2">
                {DIAS_ORDER.map(d => <option key={d} value={d}>{EXTENSO[d]}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Horário</label>
              <select value={newTurma.horario} onChange={e => setNewTurma(p => ({...p, horario: e.target.value}))} className="w-full border border-gray-300 rounded-lg px-3 py-2">
                {horarios.map(h => <option key={h} value={h}>{h}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Observação (opcional)</label>
              <input value={newTurma.observacao} onChange={e => setNewTurma(p => ({...p, observacao: e.target.value}))} className="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="ex: com Bia" />
            </div>
            {state.turmas.some(t => t.diaSemana === newTurma.diaSemana && t.horario === newTurma.horario) && (
              <p className="text-red-600 text-sm">Esta turma já existe.</p>
            )}
            <div className="flex gap-2 justify-end pt-2">
              <button onClick={() => setShowNewTurma(false)} className="px-4 py-2 border border-gray-300 rounded-lg text-gray-600">Cancelar</button>
              <button onClick={() => {
                if (!state.turmas.some(t => t.diaSemana === newTurma.diaSemana && t.horario === newTurma.horario)) {
                  dispatch({type:'ADD_TURMA', ...newTurma});
                  setShowNewTurma(false);
                }
              }} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">Criar Turma</button>
            </div>
          </div>
        </Modal>
      )}

      {confirm?.type === 'deleteTurma' && (
        <ConfirmModal
          title="Excluir turma?" danger
          message={`Remover ${ABREV[confirm.turma.diaSemana]} ${confirm.turma.horario}? Todas as faltas e vagas desta turma também serão removidas.`}
          onConfirm={() => { dispatch({type:'DELETE_TURMA', id: confirm.turma.id}); setConfirm(null); }}
          onCancel={() => setConfirm(null)}
          confirmLabel="Excluir"
        />
      )}
      {confirm?.type === 'removeAluno' && (
        <ConfirmModal
          title="Remover aluno?" danger
          message={`Remover ${confirm.nome} da turma ${ABREV[confirm.turma.diaSemana]} ${confirm.turma.horario}?`}
          onConfirm={() => { dispatch({type:'REMOVE_ALUNO', turmaId: confirm.turma.id, nome: confirm.nome}); setConfirm(null); }}
          onCancel={() => setConfirm(null)}
          confirmLabel="Remover"
        />
      )}
      {confirm?.type === 'removeAlunoPendencias' && (
        <ConfirmModal
          title="Aluno com pendências" danger
          message={`${confirm.nome} possui faltas ou reposições pendentes. Remover mesmo assim?`}
          onConfirm={() => { dispatch({type:'REMOVE_ALUNO', turmaId: confirm.turma.id, nome: confirm.nome}); setConfirm(null); }}
          onCancel={() => setConfirm(null)}
          confirmLabel="Remover mesmo assim"
        />
      )}
    </div>
  );
}

// ==================== TAB: REGISTRAR FALTA ====================
function TabRegistrarFalta({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [selectedDates, setSelectedDates] = useState([]);
  const [success, setSuccess] = useState('');

  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turma = state.turmas.find(t => t.id === turmaId);
  const occurrences = useMemo(() => turma ? getNextOccurrences(turma.diaSemana, 8) : [], [turma]);

  const toggleDate = d => setSelectedDates(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);

  const handleSubmit = () => {
    if (!turmaId || !alunoNome || !selectedDates.length) return;
    // Check for duplicate
    const exists = state.faltas.find(f => f.alunoNome === alunoNome && f.turmaId === turmaId && f.status === 'pendente');
    // Allow: duplicates are ignored (they'll just add new falta entry)
    dispatch({ type: 'ADD_FALTA', alunoNome, turmaId, datas: selectedDates });
    setSuccess(`Falta de ${alunoNome} registrada para ${selectedDates.length} data(s).`);
    setAlunoNome('');
    setSelectedDates([]);
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Registrar Falta</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); setSelectedDates([]); }} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => <option key={t.id} value={t.id}>{EXTENSO[t.diaSemana]} {t.horario}{t.observacao ? ` (${t.observacao})` : ''}</option>)}
        </select>
      </div>

      {turma && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => setAlunoNome(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {turma.alunos.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {turma.alunos.length === 0 && <p className="text-amber-600 text-sm mt-1">Esta turma não tem alunos cadastrados.</p>}
        </div>
      )}

      {turma && alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-2">Datas da falta (próximas ocorrências)</label>
          <div className="grid grid-cols-2 gap-2">
            {occurrences.map(d => (
              <label key={d} className={`flex items-center gap-2 p-2.5 rounded-lg border cursor-pointer transition-colors ${selectedDates.includes(d) ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                <input type="checkbox" checked={selectedDates.includes(d)} onChange={() => toggleDate(d)} className="rounded" />
                <span className="text-sm">{fmtBRFull(d)} <span className="text-gray-400">({ABREV[getDiaSemanaFromDateStr(d)]})</span></span>
              </label>
            ))}
          </div>
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!turmaId || !alunoNome || !selectedDates.length}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Registrar Falta
      </button>
    </div>
  );
}

// ==================== TAB: REGISTRAR REPOSIÇÃO ====================
function TabRegistrarReposicao({ state, dispatch }) {
  const [turmaOrigemId, setTurmaOrigemId] = useState('');
  const [alunoNome, setAlunoNome]         = useState('');
  const [vagaSel, setVagaSel]             = useState(''); // vagaId | 'extra'
  const [extraData, setExtraData]         = useState('');
  const [extraTurma, setExtraTurma]       = useState('');
  const [success, setSuccess]             = useState('');

  const td     = todayStr();
  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turmaOrigem = state.turmas.find(t => t.id === turmaOrigemId);

  // Vagas futuras ordenadas
  const vagasFuturas = useMemo(() =>
    [...state.vagas]
      .filter(v => v.data >= td)
      .sort((a, b) => {
        if (a.data !== b.data) return a.data.localeCompare(b.data);
        const ha = state.turmas.find(t => t.id === a.turmaId)?.horario || '';
        const hb = state.turmas.find(t => t.id === b.turmaId)?.horario || '';
        return ha.localeCompare(hb);
      }),
  [state.vagas, state.turmas, td]);

  const isExtra     = vagaSel === 'extra';
  const vagaObj     = !isExtra && vagaSel ? state.vagas.find(v => v.id === vagaSel) : null;
  const dataRepo    = isExtra ? extraData  : (vagaObj?.data || '');
  const turmaRepoId = isExtra ? extraTurma : (vagaObj?.turmaId || '');
  const turmaRepo   = state.turmas.find(t => t.id === turmaRepoId);

  const hasPending = alunoNome
    ? state.faltas.some(f => f.alunoNome === alunoNome && f.status === 'pendente')
    : false;

  const faltaInfo = useMemo(() => {
    if (!alunoNome) return null;
    const pending = state.faltas
      .filter(f => f.alunoNome === alunoNome && f.status === 'pendente')
      .sort((a, b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));
    if (!pending.length) return null;
    const oldest = pending[0];
    return { turmaId: oldest.turmaId, datas: oldest.datas, expiry: getFaltaExpiry(oldest) };
  }, [alunoNome, state.faltas]);

  const occupancy = useMemo(() => {
    if (!turmaRepoId || !dataRepo) return null;
    return calcOccupancy(turmaRepoId, dataRepo, state);
  }, [turmaRepoId, dataRepo, state]);

  const canSubmit = turmaOrigemId && alunoNome && vagaSel && dataRepo && turmaRepoId;

  const handleSubmit = () => {
    if (!canSubmit) return;
    const tipo = isExtra ? 'aula_extra' : 'reposicao';
    dispatch({ type: 'ADD_REPOSICAO', alunoNome, dataReposicao: dataRepo, turmaReposicaoId: turmaRepoId, tipo });
    setSuccess(`Reposição de ${alunoNome} agendada para ${fmtBRFull(dataRepo)}.`);
    setAlunoNome(''); setVagaSel(''); setExtraData(''); setExtraTurma('');
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Registrar Reposição</h3>

      {/* 1. Turma de origem */}
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaOrigemId} onChange={e => { setTurmaOrigemId(e.target.value); setAlunoNome(''); setVagaSel(''); }}
          className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => (
            <option key={t.id} value={t.id}>
              {EXTENSO[t.diaSemana]} {t.horario}{t.observacao ? ` (${t.observacao})` : ''}
            </option>
          ))}
        </select>
      </div>

      {/* 2. Aluno */}
      {turmaOrigem && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => { setAlunoNome(e.target.value); setVagaSel(''); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {turmaOrigem.alunos.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {turmaOrigem.alunos.length === 0 && (
            <p className="text-amber-600 text-sm mt-1">Esta turma não tem alunos cadastrados.</p>
          )}
        </div>
      )}

      {/* Info: falta mais antiga ou aviso sem falta */}
      {alunoNome && faltaInfo && (
        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm">
          <div className="font-medium text-blue-800">Falta mais antiga a consumir:</div>
          <div className="text-blue-700 mt-0.5">
            {getTurmaLabel(state.turmas, faltaInfo.turmaId)} — <strong>{fmtDatesText(faltaInfo.datas)}</strong>
          </div>
          <div className="text-blue-600 mt-0.5">Expira em: {fmtBRFull(faltaInfo.expiry)}</div>
        </div>
      )}
      {alunoNome && !hasPending && (
        <div className="bg-amber-50 border border-amber-300 rounded-lg p-3 text-sm text-amber-800">
          ⚠️ <strong>{alunoNome}</strong> não tem faltas pendentes. A reposição será marcada como <em>"sem falta vinculada"</em>.
        </div>
      )}

      {/* 3. Vaga */}
      {alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Vaga</label>
          <select value={vagaSel} onChange={e => { setVagaSel(e.target.value); setExtraData(''); setExtraTurma(''); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione a vaga —</option>
            {vagasFuturas.map(v => {
              const t = state.turmas.find(x => x.id === v.turmaId);
              const dia = getDiaSemanaFromDateStr(v.data);
              return (
                <option key={v.id} value={v.id}>
                  {fmtBRFull(v.data)} ({ABREV[dia]}) — {t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}
                </option>
              );
            })}
            <option value="extra">✦ Aula extra — escolher data e turma</option>
          </select>
          {vagasFuturas.length === 0 && !isExtra && (
            <p className="text-gray-400 text-sm mt-1">Nenhuma vaga aberta no momento.</p>
          )}
        </div>
      )}

      {/* Campos extras para aula extra */}
      {isExtra && (
        <div className="space-y-3 pl-3 border-l-2 border-blue-300">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Data da aula extra</label>
            <input type="date" value={extraData} min={td} onChange={e => setExtraData(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
            <select value={extraTurma} onChange={e => setExtraTurma(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2">
              <option value="">— Selecione a turma —</option>
              {sorted.map(t => (
                <option key={t.id} value={t.id}>
                  {EXTENSO[t.diaSemana]} {t.horario}{t.observacao ? ` (${t.observacao})` : ''}
                </option>
              ))}
            </select>
          </div>
        </div>
      )}

      {/* Ocupação prevista */}
      {occupancy !== null && turmaRepo && (
        <div className={`rounded-lg px-3 py-2 text-sm font-medium border ${
          occupancy + 1 > turmaRepo.capacidade
            ? 'bg-red-50 text-red-700 border-red-200'
            : occupancy + 1 === turmaRepo.capacidade
              ? 'bg-amber-50 text-amber-700 border-amber-200'
              : 'bg-green-50 text-green-700 border-green-200'
        }`}>
          {getTurmaLabel(state.turmas, turmaRepoId)} em {fmtBRFull(dataRepo)}:{' '}
          {occupancy + 1}/{turmaRepo.capacidade} alunos esperados
          {occupancy + 1 > turmaRepo.capacidade && ' ⚠️ Acima da capacidade!'}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!canSubmit}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Confirmar Reposição
      </button>
    </div>
  );
}

// ==================== TAB: CANCELAR REPOSIÇÃO ====================
function TabCancelarReposicao({ state, dispatch }) {
  const [selectedId, setSelectedId] = useState('');
  const [confirm, setConfirm] = useState(false);
  const [success, setSuccess] = useState('');
  const td = todayStr();

  const futuras = useMemo(() => state.reposicoes.filter(r => !r.realizada && r.dataReposicao >= td).sort((a,b) => a.dataReposicao.localeCompare(b.dataReposicao)), [state.reposicoes, td]);
  const repo = futuras.find(r => r.id === selectedId);

  const handleCancel = () => {
    dispatch({ type: 'CANCEL_REPOSICAO', id: selectedId });
    setSuccess(`Reposição de ${repo.alunoNome} em ${fmtBRFull(repo.dataReposicao)} cancelada.`);
    setSelectedId(''); setConfirm(false);
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Cancelar Reposição</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Reposição agendada</label>
        <select value={selectedId} onChange={e => setSelectedId(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione —</option>
          {futuras.map(r => (
            <option key={r.id} value={r.id}>
              {r.alunoNome} — {fmtBRFull(r.dataReposicao)} ({getTurmaLabel(state.turmas, r.turmaReposicaoId)}) {r.tipo==='aula_extra' ? '· Aula extra' : ''}
            </option>
          ))}
        </select>
        {futuras.length === 0 && <p className="text-gray-400 text-sm mt-1">Nenhuma reposição futura agendada.</p>}
      </div>

      {repo && (
        <div className="bg-gray-50 rounded-lg p-3 text-sm space-y-1">
          <div><span className="font-medium">Aluno:</span> {repo.alunoNome}</div>
          <div><span className="font-medium">Data:</span> {fmtBRFull(repo.dataReposicao)}</div>
          <div><span className="font-medium">Turma:</span> {getTurmaLabel(state.turmas, repo.turmaReposicaoId)}</div>
          <div><span className="font-medium">Tipo:</span> {repo.tipo === 'reposicao' ? 'Reposição de falta' : 'Aula extra'}</div>
          {repo.tipo === 'reposicao' && <div className="text-blue-600">A falta vinculada voltará para pendente e a vaga será reaberta.</div>}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={() => setConfirm(true)}
        disabled={!selectedId}
        className="w-full py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Cancelar Reposição
      </button>

      {confirm && repo && (
        <ConfirmModal
          title="Cancelar reposição?" danger
          message={`Cancelar a reposição de ${repo.alunoNome} em ${fmtBRFull(repo.dataReposicao)}?`}
          onConfirm={handleCancel}
          onCancel={() => setConfirm(false)}
          confirmLabel="Cancelar reposição"
        />
      )}
    </div>
  );
}

// ==================== PAINEL: GENERATE TEXT ====================
function generatePainelText(state) {
  const td = todayStr();
  const sorted = sortTurmas(state.turmas);

  // ---- FALTAS ----
  const pendentes = state.faltas
    .filter(f => f.status === 'pendente')
    .sort((a,b) => {
      const ea = getFaltaEarliest(a), eb = getFaltaEarliest(b);
      if (ea !== eb) return ea.localeCompare(eb);
      const ta = state.turmas.find(t => t.id === a.turmaId);
      const tb = state.turmas.find(t => t.id === b.turmaId);
      return (ta?.horario||'').localeCompare(tb?.horario||'');
    });

  const ausencias = state.ausencias
    .filter(a => !a.creditoUsado)
    .sort((a,b) => getLastDayOfMonth(a.mesAno).localeCompare(getLastDayOfMonth(b.mesAno)));

  const marcadas = state.faltas
    .filter(f => f.status === 'marcada')
    .sort((a,b) => {
      const ea = getFaltaEarliest(a), eb = getFaltaEarliest(b);
      if (ea !== eb) return ea.localeCompare(eb);
      const ta = state.turmas.find(t => t.id === a.turmaId);
      const tb = state.turmas.find(t => t.id === b.turmaId);
      return (ta?.horario||'').localeCompare(tb?.horario||'');
    });

  let faltasText = '*FALTAS*\n';

  // Merge pendentes + ausencias sorted
  const combined = [
    ...pendentes.map(f => ({ tipo:'falta', obj:f, sortKey: getFaltaEarliest(f) + (state.turmas.find(t=>t.id===f.turmaId)?.horario||'') })),
    ...ausencias.map(a => ({ tipo:'ausencia', obj:a, sortKey: getLastDayOfMonth(a.mesAno) }))
  ].sort((a,b) => a.sortKey.localeCompare(b.sortKey));

  if (combined.length) faltasText += '\n';
  combined.forEach(({ tipo, obj }) => {
    if (tipo === 'falta') {
      const t = state.turmas.find(x => x.id === obj.turmaId);
      const tLabel = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      faltasText += `${obj.alunoNome} (${tLabel})\nFalta: *${fmtDatesText(obj.datas)}*\n\n`;
    } else {
      const t = state.turmas.find(x => x.id === obj.turmaId);
      const tLabel = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      faltasText += `${obj.alunoNome} (${tLabel})\nFérias: ${getMesNome(obj.mesAno).toLowerCase()}\n\n`;
    }
  });

  if (marcadas.length) {
    faltasText += '*JÁ MARCADAS*\n\n';
    marcadas.forEach(f => {
      const t = state.turmas.find(x => x.id === f.turmaId);
      const tLabel = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      faltasText += `${f.alunoNome} (${tLabel})\nFalta: ${fmtDatesText(f.datas)}\n\n`;
    });
  }

  // ---- REPOSIÇÕES ----
  const reposAtivas = state.reposicoes
    .filter(r => !r.realizada)
    .sort((a,b) => a.dataReposicao.localeCompare(b.dataReposicao));

  let reposText = '*REPOSIÇÕES*\n';
  if (reposAtivas.length) {
    reposText += '\n';
    reposAtivas.forEach(r => {
      const tOrigem = state.turmas.find(t => t.id === r.turmaOrigemId);
      const tRepo = state.turmas.find(t => t.id === r.turmaReposicaoId);
      const origemLabel = tOrigem ? `${ABREV[tOrigem.diaSemana]} ${tOrigem.horario}` : '?';
      const dia = getDiaSemanaFromDateStr(r.dataReposicao);
      const prefix = r.tipo === 'reposicao' ? 'Repõe' : 'Aula extra';
      reposText += `${r.alunoNome} (${origemLabel})\n${prefix}: ${EXTENSO[dia]}, ${fmtBR(r.dataReposicao)}, ${tRepo?.horario||'?'}\n\n`;
    });
  } else {
    reposText += '\n_Nenhuma reposição agendada_\n\n';
  }

  // ---- VAGAS ----
  const vagasFuturas = state.vagas.filter(v => v.data >= td).sort((a,b) => {
    if (a.data !== b.data) return a.data.localeCompare(b.data);
    const ta = state.turmas.find(t => t.id === a.turmaId);
    const tb = state.turmas.find(t => t.id === b.turmaId);
    return (ta?.horario||'').localeCompare(tb?.horario||'');
  });

  // Group by turmaId + data
  const vagasGrouped = {};
  vagasFuturas.forEach(v => {
    const key = `${v.data}|${v.turmaId}`;
    if (!vagasGrouped[key]) vagasGrouped[key] = { data: v.data, turmaId: v.turmaId, count: 0 };
    vagasGrouped[key].count++;
  });
  const vagasList = Object.values(vagasGrouped).sort((a,b) => {
    if (a.data !== b.data) return a.data.localeCompare(b.data);
    const ta = state.turmas.find(t => t.id === a.turmaId);
    const tb = state.turmas.find(t => t.id === b.turmaId);
    return (ta?.horario||'').localeCompare(tb?.horario||'');
  });

  let vagasText = '*VAGAS*\n';
  if (vagasList.length) {
    vagasText += '\n';
    vagasList.forEach(v => {
      const t = state.turmas.find(x => x.id === v.turmaId);
      const dia = getDiaSemanaFromDateStr(v.data);
      vagasText += `${EXTENSO[dia]}, ${fmtBR(v.data)}, ${t?.horario||'?'}${v.count > 1 ? ` (${v.count})` : ''}\n`;
    });
    vagasText += '\n';
  } else {
    vagasText += '\n_Nenhuma vaga aberta_\n\n';
  }

  // ---- TURMAS ----
  let turmasText = '*TURMAS*\n\n';
  sorted.forEach(t => {
    const obs = t.observacao ? ` (${t.observacao})` : '';
    turmasText += `${ABREV[t.diaSemana]} ${t.horario} - ${t.alunos.length} aluno${t.alunos.length !== 1 ? 's' : ''}${obs}\n`;
  });

  // ---- OBSERVAÇÕES ----
  const obs = [];
  const today = td;
  const in7Days = (() => { const d = new Date(); d.setDate(d.getDate()+7); return dateToStr(d); })();

  // Expiring soon
  const expirando = state.faltas.filter(f => {
    if (f.status !== 'pendente') return false;
    const exp = getFaltaExpiry(f);
    return exp >= today && exp <= in7Days;
  });
  expirando.forEach(f => {
    const t = state.turmas.find(x => x.id === f.turmaId);
    obs.push(`⚠️ Falta expirando em ${fmtBRFull(getFaltaExpiry(f))}: ${f.alunoNome} (${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'})`);
  });

  // Expired faltas
  const expiradas = state.faltas.filter(f => f.status === 'pendente' && getFaltaExpiry(f) < today);
  expiradas.forEach(f => {
    const t = state.turmas.find(x => x.id === f.turmaId);
    obs.push(`🔴 Falta expirada: ${f.alunoNome} (${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}) — ${fmtDatesText(f.datas)}`);
  });

  // Aulas extra sem falta
  const extrasOrfas = state.reposicoes.filter(r => r.tipo === 'aula_extra' && !r.realizada);
  extrasOrfas.forEach(r => {
    obs.push(`ℹ️ Aula extra sem falta vinculada: ${r.alunoNome} — ${fmtBRFull(r.dataReposicao)}`);
  });

  // Ausencias expirando
  state.ausencias.filter(a => !a.creditoUsado).forEach(a => {
    const exp = getAusenciaExpiry(a);
    if (exp >= today && exp <= in7Days) {
      obs.push(`⚠️ Férias de ${a.alunoNome} expirando em ${fmtBRFull(exp)}`);
    }
    if (exp < today) {
      obs.push(`🔴 Crédito de férias expirado: ${a.alunoNome} (${getMesNome(a.mesAno)})`);
    }
  });

  // Turmas acima da capacidade
  sorted.forEach(t => {
    if (t.alunos.length > t.capacidade) obs.push(`⚠️ Turma acima da capacidade: ${ABREV[t.diaSemana]} ${t.horario} (${t.alunos.length}/${t.capacidade})`);
  });

  let obsText = '*OBSERVAÇÕES*\n\n';
  obsText += obs.length ? obs.join('\n') + '\n' : '_Nenhuma observação_\n';

  return [faltasText.trim(), reposText.trim(), vagasText.trim(), turmasText.trim(), obsText.trim()].join('\n\n---\n\n');
}

function SectionPainel({ state, dispatch }) {

  // Alertas

  const in7 = (() => { const d = new Date(); d.setDate(d.getDate()+7); return dateToStr(d); })();
  const obs = [];
  state.faltas.filter(f => f.status==='pendente').forEach(f => {
    const exp = getFaltaExpiry(f);
    const t = state.turmas.find(x => x.id===f.turmaId);
    const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
    if (exp < td) obs.push({ level:'red', text:`Falta expirada: ${f.alunoNome} (${lbl}) — ${fmtDatesText(f.datas)}` });
    else if (exp <= in7) obs.push({ level:'amber', text:`Falta expirando em ${fmtBRFull(exp)}: ${f.alunoNome} (${lbl})` });
  });
  state.ausencias.filter(a => !a.creditoUsado).forEach(a => {
    const exp = getAusenciaExpiry(a);
    if (exp < td) obs.push({ level:'red', text:`Crédito de férias expirado: ${a.alunoNome} (${getMesNome(a.mesAno)})` });
    else if (exp <= in7) obs.push({ level:'amber', text:`Férias de ${a.alunoNome} expirando em ${fmtBRFull(exp)}` });
  });
  state.reposicoes.filter(r => !r.realizada && r.tipo==='aula_extra').forEach(r => {
    obs.push({ level:'blue', text:`Aula extra sem falta vinculada: ${r.alunoNome} — ${fmtBRFull(r.dataReposicao)}` });
  });
  state.reposicoes.filter(r => !r.realizada && r.semFaltaVinculada).forEach(r => {
    obs.push({ level:'blue', text:`Reposição sem falta vinculada: ${r.alunoNome} — ${fmtBRFull(r.dataReposicao)}` });
  });
  sorted.forEach(t => {
    if (t.alunos.length > t.capacidade)
      obs.push({ level:'red', text:`Turma acima da capacidade: ${ABREV[t.diaSemana]} ${t.horario} (${t.alunos.length}/${t.capacidade})` });
  });

  const obsColors = { red:'bg-red-50 text-red-700 border-red-200', amber:'bg-amber-50 text-amber-700 border-amber-200', blue:'bg-blue-50 text-blue-700 border-blue-200' };
  const obsIcons  = { red:'🔴', amber:'⚠️', blue:'ℹ️' };

  const BlockHeader = ({ children, sub }) => (
    <div className={`px-4 py-2.5 font-bold text-sm tracking-widest ${sub ? 'bg-gray-100 text-gray-500 border-t border-gray-200 text-xs' : 'bg-gray-800 text-white rounded-t-xl'}`}>
      {children}
    </div>
  );

  return (
    <div className="space-y-4">

      {/* FALTAS */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader>FALTAS</BlockHeader>
        {combined.length === 0 && marcadas.length === 0 && (
          <div className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma falta registrada.</div>
        )}
        <div className="divide-y divide-gray-100">
          {combined.map(({ tipo, obj }, i) => {
            const t = state.turmas.find(x => x.id === (tipo==='falta' ? obj.turmaId : obj.turmaId));
            const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
            const exp = tipo==='falta' ? getFaltaExpiry(obj) : getAusenciaExpiry(obj);
            const expiring = tipo==='falta' && exp <= in7 && exp >= td;
            const expired  = tipo==='falta' && exp < td;
            return (
              <div key={i} className={`px-4 py-3 ${expired ? 'bg-red-50' : expiring ? 'bg-amber-50' : 'bg-white'}`}>
                <div className="flex justify-between items-start">
                  <span className="font-semibold text-gray-800">{obj.alunoNome}</span>
                  <span className="text-xs text-gray-400 ml-2">{lbl}</span>
                </div>
                {tipo === 'falta' ? (
                  <div className="text-sm text-gray-600 mt-0.5">
                    Falta: <span className="font-bold text-gray-900">{fmtDatesText(obj.datas)}</span>
                    {expiring && <span className="ml-2 text-xs text-amber-600 font-medium">· expira {fmtBRFull(exp)}</span>}
                    {expired  && <span className="ml-2 text-xs text-red-600 font-medium">· expirada em {fmtBRFull(exp)}</span>}
                  </div>
                ) : (
                  <div className="text-sm text-gray-600 mt-0.5">Férias: <span className="font-medium">{getMesNome(obj.mesAno).toLowerCase()}</span></div>
                )}
              </div>
            );
          })}
        </div>

        {marcadas.length > 0 && (
          <>
            <BlockHeader sub>JÁ MARCADAS</BlockHeader>
            <div className="divide-y divide-gray-100">
              {marcadas.map((f, i) => {
                const t = state.turmas.find(x => x.id === f.turmaId);
                const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
                return (
                  <div key={i} className="px-4 py-3 bg-white">
                    <div className="flex justify-between items-start">
                      <span className="font-medium text-gray-500">{f.alunoNome}</span>
                      <span className="text-xs text-gray-400 ml-2">{lbl}</span>
                    </div>
                    <div className="text-sm text-gray-400 mt-0.5">Falta: {fmtDatesText(f.datas)}</div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* REPOSIÇÕES */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader>REPOSIÇÕES</BlockHeader>
        {reposAtivas.length === 0 && (
          <div className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma reposição agendada.</div>
        )}
        <div className="divide-y divide-gray-100">
          {reposAtivas.map((r, i) => {
            const tOrigem = state.turmas.find(t => t.id === r.turmaOrigemId);
            const tRepo   = state.turmas.find(t => t.id === r.turmaReposicaoId);
            const dia     = getDiaSemanaFromDateStr(r.dataReposicao);
            const origemLbl = tOrigem ? `${ABREV[tOrigem.diaSemana]} ${tOrigem.horario}` : '?';
            const isExtra   = r.tipo === 'aula_extra';
            const semFalta  = r.semFaltaVinculada;
            return (
              <div key={i} className="px-4 py-3 bg-white">
                <div className="flex justify-between items-start">
                  <span className="font-semibold text-gray-800">{r.alunoNome}</span>
                  <span className="text-xs text-gray-400 ml-2">{origemLbl}</span>
                </div>
                <div className="text-sm text-gray-600 mt-0.5">
                  <span className="text-gray-400">{isExtra ? 'Aula extra:' : 'Repõe:'}</span>{' '}
                  <span className="font-bold text-gray-900">{EXTENSO[dia]}, {fmtBR(r.dataReposicao)}, {tRepo?.horario || '?'}</span>
                </div>
                {(isExtra || semFalta) && (
                  <div className="mt-1">
                    <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${isExtra ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}`}>
                      {isExtra ? 'Aula extra' : 'Sem falta vinculada'}
                    </span>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* VAGAS */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader>VAGAS</BlockHeader>
        {vagasGrupos.length === 0 && (
          <div className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma vaga aberta.</div>
        )}
        <div className="divide-y divide-gray-100">
          {vagasGrupos.map((v, i) => {
            const t   = state.turmas.find(x => x.id === v.turmaId);
            const dia = getDiaSemanaFromDateStr(v.data);
            return (
              <div key={i} className="px-4 py-3 bg-white flex justify-between items-center">
                <div>
                  <span className="font-bold text-gray-900">{EXTENSO[dia]}, {fmtBR(v.data)}</span>
                  <span className="text-gray-500 ml-2 text-sm">{t?.horario || '?'}</span>
                </div>
                {v.count > 1 && (
                  <span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full">{v.count} vagas</span>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* TURMAS */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader>TURMAS</BlockHeader>
        <div className="divide-y divide-gray-100">
          {sorted.map((t, i) => {
            const over = t.alunos.length > t.capacidade;
            const full = t.alunos.length === t.capacidade;
            return (
              <div key={i} className="px-4 py-2.5 bg-white flex justify-between items-center">
                <div className="flex items-center gap-2">
                  <span className="font-medium text-gray-700">{ABREV[t.diaSemana]} {t.horario}</span>
                  {t.observacao && <span className="text-xs text-gray-400">({t.observacao})</span>}
                </div>
                <span className={`text-sm font-medium ${over ? 'text-red-600' : full ? 'text-amber-600' : 'text-gray-500'}`}>
                  {t.alunos.length}/{t.capacidade}
                </span>
              </div>
            );
          })}
        </div>
      </div>

      {/* OBSERVAÇÕES */}
      {obs.length > 0 && (
        <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
          <BlockHeader>OBSERVAÇÕES</BlockHeader>
          <div className="divide-y divide-gray-100">
            {obs.map((o, i) => (
              <div key={i} className={`px-4 py-3 text-sm border-l-4 ${obsColors[o.level]} border-l-current`}>
                {obsIcons[o.level]} {o.text}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PainelLista({ state, dispatch }) {
  const [copied, setCopied]     = useState(false);
  const [snapLabel, setSnapLabel] = useState('');
  const [snapSaved, setSnapSaved] = useState(false);
  const [showRaw, setShowRaw]   = useState(false);

  const text = useMemo(() => generatePainelText(state), [state]);

  const handleCopy = () => {
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    });
  };

  const handleSnap = () => {
    dispatch({ type: 'SAVE_SNAPSHOT', label: snapLabel || fmtBRFull(todayStr()), conteudo: text });
    setSnapSaved(true);
    setSnapLabel('');
    setTimeout(() => setSnapSaved(false), 3000);
  };

  return (
    <div className="space-y-4">
      {/* Ações */}
      <div className="flex flex-wrap gap-2 items-center">
        <button onClick={handleCopy}
          className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${copied ? 'bg-green-600 text-white' : 'bg-gray-800 text-white hover:bg-gray-900'}`}>
          {copied ? '✓ Copiado!' : '📋 Copiar lista'}
        </button>
        <button onClick={() => setShowRaw(v => !v)}
          className="px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 text-gray-600 hover:bg-gray-50">
          {showRaw ? 'Ver visual' : 'Ver texto bruto'}
        </button>
        <div className="flex gap-2 flex-1 min-w-0">
          <input value={snapLabel} onChange={e => setSnapLabel(e.target.value)}
            placeholder="Rótulo do snapshot (opcional)"
            className="flex-1 min-w-0 border border-gray-300 rounded-lg px-3 py-2 text-sm" />
          <button onClick={handleSnap}
            className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium text-sm hover:bg-blue-700 whitespace-nowrap">
            💾 Salvar
          </button>
        </div>
      </div>
      {snapSaved && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-2 text-sm">Snapshot salvo!</div>}

      {/* Conteúdo */}
      {showRaw
        ? <pre className="bg-gray-50 border border-gray-200 rounded-lg p-4 text-xs text-gray-700 font-mono leading-relaxed overflow-x-auto">{text}</pre>
        : <PainelVisual state={state} />
      }
    </div>
  );
}

function PainelImportacao({ state, dispatch }) {
  const [text, setText] = useState('');
  const [preview, setPreview] = useState(null);
  const [imported, setImported] = useState(false);

  function parseImport(txt) {
    // Build turma lookup: "Seg 09h" -> turmaId
    const turmaByLabel = {};
    state.turmas.forEach(t => {
      turmaByLabel[`${ABREV[t.diaSemana]} ${t.horario}`] = t.id;
    });

    // Parse date like "30/03" or "30/03/26" -> "2026-03-30"
    const parseImportDate = (s, year = new Date().getFullYear()) => {
      const m = s.trim().match(/^(\d{1,2})\/(\d{2})(?:\/(\d{2,4}))?$/);
      if (!m) return null;
      const d = m[1].padStart(2,'0'), mo = m[2].padStart(2,'0');
      const y = m[3] ? (m[3].length === 2 ? '20'+m[3] : m[3]) : String(year);
      return `${y}-${mo}-${d}`;
    };

    const newFaltas = [];
    const newVagas = [];
    const lines = txt.split('\n');
    let section = null;
    let i = 0;

    while (i < lines.length) {
      const line = lines[i].trim().replace(/\*/g, '');
      if (line === 'FALTAS' || line === 'JÁ MARCADAS') { section = 'faltas'; i++; continue; }
      if (line === 'REPOSIÇÕES') { section = 'repos'; i++; continue; }
      if (line === 'VAGAS') { section = 'vagas'; i++; continue; }
      if (line === 'TURMAS' || line === 'OBSERVAÇÕES') { section = null; i++; continue; }

      if (section === 'faltas' && line && !line.startsWith('Falta:') && !line.startsWith('Férias:')) {
        // Name line: "Nome (Seg 09h)"
        const nameMatch = line.match(/^(.+?)\s+\((.+?)\)$/);
        if (nameMatch && i+1 < lines.length) {
          const nome = nameMatch[1].trim();
          const turmaLabel = nameMatch[2].trim();
          const turmaId = turmaByLabel[turmaLabel];
          const nextLine = lines[i+1].trim().replace(/\*/g,'');
          if (nextLine.startsWith('Falta:') && turmaId) {
            const datesPart = nextLine.replace('Falta:','').trim();
            const dateStrs = datesPart.split(/\s+e\s+|\s*,\s*/).map(s => parseImportDate(s)).filter(Boolean);
            if (dateStrs.length) {
              // Check if already exists
              const exists = state.faltas.some(f => f.alunoNome === nome && f.turmaId === turmaId && JSON.stringify([...f.datas].sort()) === JSON.stringify([...dateStrs].sort()));
              if (!exists) {
                const fId = genId('f');
                newFaltas.push({ id: fId, alunoNome: nome, turmaId, datas: dateStrs, status: 'pendente' });
                dateStrs.forEach(d => newVagas.push({ id: genId('v'), turmaId, data: d, faltaId: fId }));
              }
            }
          }
        }
      }

      if (section === 'vagas' && line && !line.startsWith('*')) {
        // "Quarta-feira, 29/04, 10h"
        const m = line.match(/^(.+?),\s*(\d+\/\d+(?:\/\d+)?),\s*(\d+h)(?:\s+\((\d+)\))?$/);
        if (m) {
          const dateStr = parseImportDate(m[2]);
          // find turma by horario and day
          const diaNome = Object.keys(EXTENSO).find(k => EXTENSO[k] === m[1].trim());
          if (dateStr && diaNome) {
            const turma = state.turmas.find(t => t.diaSemana === diaNome && t.horario === m[3]);
            if (turma && !state.vagas.some(v => v.turmaId === turma.id && v.data === dateStr)) {
              newVagas.push({ id: genId('v'), turmaId: turma.id, data: dateStr, faltaId: null });
            }
          }
        }
      }
      i++;
    }

    return { faltas: newFaltas, vagas: newVagas };
  }

  const handleParse = () => {
    const result = parseImport(text);
    setPreview(result);
  };

  const handleConfirm = () => {
    dispatch({ type: 'IMPORT_MERGE', data: preview });
    setImported(true);
    setPreview(null);
    setText('');
    setTimeout(() => setImported(false), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Importar lista do WhatsApp</h3>
      <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-700">
        Cole a lista no formato WhatsApp abaixo. O sistema vai identificar faltas e vagas novas e fazer merge com o estado atual (sem sobrescrever o que já existe).
      </div>

      <textarea
        value={text}
        onChange={e => { setText(e.target.value); setPreview(null); }}
        className="w-full h-64 border border-gray-300 rounded-lg p-3 text-sm font-mono"
        placeholder="Cole a lista aqui..."
      />

      <button onClick={handleParse} disabled={!text.trim()} className="w-full py-2 bg-gray-700 text-white rounded-lg font-medium hover:bg-gray-800 disabled:opacity-40">
        Analisar texto
      </button>

      {preview && (
        <div className="bg-gray-50 border border-gray-200 rounded-lg p-4 space-y-3">
          <div className="font-semibold text-gray-700">Resumo da importação:</div>
          <div className="text-sm space-y-1">
            <div><span className="font-medium">Novas faltas:</span> {preview.faltas.length}</div>
            {preview.faltas.map((f,i) => (
              <div key={i} className="ml-4 text-gray-600">• {f.alunoNome} ({getTurmaLabel(state.turmas, f.turmaId)}) — {fmtDatesText(f.datas)}</div>
            ))}
            <div className="mt-2"><span className="font-medium">Novas vagas:</span> {preview.vagas.filter(v => !v.faltaId).length} (independentes)</div>
          </div>
          {preview.faltas.length === 0 && preview.vagas.length === 0 && (
            <div className="text-gray-400 text-sm">Nenhum dado novo encontrado.</div>
          )}
          {(preview.faltas.length > 0 || preview.vagas.length > 0) && (
            <div className="flex gap-2">
              <button onClick={() => setPreview(null)} className="flex-1 py-2 border border-gray-300 rounded-lg text-sm">Cancelar</button>
              <button onClick={handleConfirm} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-medium text-sm hover:bg-blue-700">Confirmar importação</button>
            </div>
          )}
        </div>
      )}

      {imported && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">Dados importados com sucesso!</div>}
    </div>
  );
}

// ==================== APP ====================
function App() {
  const [state, dispatch] = useReducer(reducer, null, loadState);
  const [section, setSection]     = useState(2);
  const [seedDismissed, setSeedDismissed] = useState(false);
  const [syncStatus, setSyncStatus] = useState('conectando');
  const lastOwnSave = useRef(0);
  const saveTimer   = useRef(null);
  const initialised = useRef(false);

  // 1. Cleanup local + carrega do Firebase + abre listener SSE
  useEffect(() => {
    dispatch({ type: 'CLEANUP' });

    // Busca dados do Firebase em segundo plano (app já abriu com cache local)
    fetchFromFirebase()
      .then(data => {
        if (data && typeof data === 'object' && Object.keys(data).length > 0) {
          dispatch({ type: 'SYNC_FROM_FIREBASE', data });
        } else if (!initialised.current) {
          // Banco vazio: sobe o seed
          saveToFirebase({ ...SEED, _updatedAt: Date.now() }).catch(() => {});
        }
        initialised.current = true;
        setSyncStatus('ok');
      })
      .catch(() => setSyncStatus('erro'));

    // SSE — atualizações em tempo real
    const es = new EventSource(`${DB_URL}/state.json`);
    es.addEventListener('put', e => {
      try {
        const { data } = JSON.parse(e.data);
        if (!data || typeof data !== 'object') return;
        if (data._updatedAt && data._updatedAt <= lastOwnSave.current + 3000) return;
        dispatch({ type: 'SYNC_FROM_FIREBASE', data });
      } catch(_) {}
    });
    es.onerror = () => setSyncStatus('erro');
    es.onopen  = () => setSyncStatus('ok');

    return () => es.close();
  }, []);

  // 2. Salva no Firebase a cada mudança (debounce 600ms, ignora 1º render)
  useEffect(() => {
    if (!initialised.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const ts = Date.now();
      lastOwnSave.current = ts;
      const payload = { ...state, _updatedAt: ts };
      saveToFirebase(payload)
        .then(() => setSyncStatus('ok'))
        .catch(() => setSyncStatus('erro'));
    }, 600);
  }, [state]);

  const nav = [
    { label: 'Turmas', icon: '👥' },
    { label: 'Faltas & Reposições', icon: '📋' },
    { label: 'Painel', icon: '📊' }
  ];

  const showSeedWarning = state._seedWarning && !seedDismissed;
  const syncLabel = { conectando: '🔄 conectando', ok: '🟢 sincronizado', erro: '🔴 sem conexão' };

  return (
    <div className="min-h-screen bg-gray-100">
      {/* Header */}
      <div className="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold text-gray-900">🎨 Ateliê Passarinho</h1>
            <p className="text-xs text-gray-400">Gestão de Faltas e Reposições</p>
          </div>
          <div className="text-right">
            <div className="text-xs text-gray-400">{new Date().toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'})}</div>
            <div className={`text-xs mt-0.5 ${syncStatus === 'ok' ? 'text-green-600' : syncStatus === 'erro' ? 'text-red-500' : 'text-gray-400'}`}>{syncLabel[syncStatus]}</div>
          </div>
        </div>
        <div className="border-t border-gray-100">
          <div className="max-w-4xl mx-auto flex">
            {nav.map((n,i) => (
              <button key={i} onClick={() => setSection(i)}
                className={`flex-1 px-2 py-2.5 text-sm font-medium flex flex-col items-center gap-0.5 transition-colors ${section===i ? 'border-b-2 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'}`}>
                <span>{n.icon}</span>
                <span className="text-xs">{n.label}</span>
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Seed warning */}
      {showSeedWarning && (
        <div className="max-w-4xl mx-auto px-4 pt-4">
          <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 flex justify-between items-start gap-3 fade-in">
            <div>
              <div className="font-semibold text-amber-800">⚠️ Cadastro de alunos incompleto</div>
              <div className="text-sm text-amber-700 mt-0.5">Complete as turmas na seção <strong>Turmas</strong>. Os alunos identificados pelo histórico foram carregados; os demais precisam ser adicionados manualmente.</div>
            </div>
            <button onClick={() => { setSeedDismissed(true); dispatch({type:'DISMISS_SEED_WARNING'}); }} className="text-amber-500 hover:text-amber-700 text-xl leading-none flex-shrink-0">×</button>
          </div>
        </div>
      )}

      {/* Content */}
      <div className="pb-8">
        {section === 0 && <SectionTurmas state={state} dispatch={dispatch} />}
        {section === 1 && <SectionFaltasReposicoes state={state} dispatch={dispatch} />}
        {section === 2 && <SectionPainel state={state} dispatch={dispatch} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
