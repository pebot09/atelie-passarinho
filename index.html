// ==================== HELPERS ====================
function parseDate(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dateToStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function fmtBR(dateStr) {
  if (!dateStr) return '';
  const [,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}

function fmtBRFull(dateStr) {
  if (!dateStr) return '';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function fmtDatesText(datas) {
  const sorted = [...datas].sort();
  const br = sorted.map(fmtBR);
  if (br.length === 1) return br[0];
  if (br.length === 2) return `${br[0]} e ${br[1]}`;
  return br.slice(0,-1).join(', ') + ' e ' + br[br.length-1];
}

function getNextOccurrences(diaSemana, n = 8) {
  const target = DIA_JS[diaSemana];
  const dates = [];
  const d = new Date();
  d.setHours(0,0,0,0);
  while (dates.length < n) {
    if (d.getDay() === target) dates.push(dateToStr(d)); // feriados included so UI can show them disabled
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

function getClassDatesInRange(turma, fromStr, toStr) {
  const target = DIA_JS[turma.diaSemana];
  if (target === undefined) return [];
  const dates = [];
  const d = new Date(fromStr + 'T00:00:00');
  const end = new Date(toStr + 'T00:00:00');
  while (d <= end) {
    if (d.getDay() === target) dates.push(dateToStr(d));
    d.setDate(d.getDate() + 1);
  }
  return dates;
}

function getClassDatetime(turmaId, date, turmas) {
  const turma = turmas.find(t => t.id === turmaId);
  if (!turma) return null;
  const hora = parseInt((turma.horario || '09h').replace('h',''), 10);
  const dt = parseDate(date);
  dt.setHours(hora, 0, 0, 0);
  return dt;
}

// Returns { canCancel, reason } for whether a student can cancel their own falta
function getCancelFaltaStatus(falta, state) {
  const faltaData = falta.datas[0];
  // Rule 2: falta is already linked to a student's own reposição
  if (falta.status === 'marcada') {
    return { canCancel: false, reason: 'Você já tem uma reposição marcada para esta falta. Cancele a reposição primeiro.' };
  }
  // Rule 4: class time has already passed
  const classTime = getClassDatetime(falta.turmaId, faltaData, state.turmas);
  if (classTime && Date.now() >= classTime.getTime()) {
    return { canCancel: false, reason: 'O horário desta aula já passou.' };
  }
  // Rule 3: check if there's a vaga available (own or any other for same turma/date)
  const vagaFalta = state.vagas.find(v => v.faltaId === falta.id);
  if (!vagaFalta) {
    // Own vaga was consumed by another student's reposição — check if any other vaga exists
    const outraVaga = state.vagas.find(v => v.turmaId === falta.turmaId && v.data === faltaData);
    if (!outraVaga) {
      return { canCancel: false, reason: 'Sua vaga já foi ocupada por outro aluno e não há outra disponível para substituir.' };
    }
  }
  return { canCancel: true, reason: null };
}

function computeVagasExtras(turmas, faltas, reposicoes, vagasBase, td, ausencias) {
  ausencias = ausencias || [];
  const now = new Date();
  const endDateStr = (() => { const e = new Date(); e.setDate(e.getDate()+60); return dateToStr(e); })();
  let vagas = [...vagasBase];
  turmas.forEach(turma => {
    if (turma.id === TURMA_EXTRA_ID) return;
    if (turma.alunos.length === 0) return;
    const classDates = getClassDatesInRange(turma, td, endDateStr);
    classDates.forEach(date => {
      if (FERIADOS_SET.has(date) || isRecesso(date)) return; // No vagas on holidays or recesso
      const dayBefore = new Date(date + 'T10:00:00');
      dayBefore.setDate(dayBefore.getDate() - 1);
      if (now < dayBefore) return;
      // Subtract students on vacation this month from expected attendance
      const mesAno = date.slice(0, 7);
      const vacCount = ausencias.filter(a =>
        a.turmaId === turma.id && a.mesAno === mesAno && turma.alunos.includes(a.alunoNome)
      ).length;
      const alunosEfetivos = turma.alunos.length - vacCount;
      if (alunosEfetivos <= 0) return;
      const faltasCount = faltas.filter(f =>
        f.turmaId === turma.id && f.datas.includes(date) &&
        (f.status === 'pendente' || f.status === 'marcada')
      ).length;
      if (faltasCount >= alunosEfetivos) {
        // All students absent — remove any extra vagas already created for this date
        vagas = vagas.filter(v => !(v.vagaExtra && v.turmaId === turma.id && v.data === date));
        return;
      }
      const totalRepos = reposicoes.filter(r =>
        r.turmaReposicaoId === turma.id && r.dataReposicao === date && !r.realizada
      ).length;
      // Count existing falta/férias vagas — they already fill open seats, so subtract from target
      const existingFaltaVagas = vagas.filter(v =>
        v.turmaId === turma.id && v.data === date && (v.faltaId || v.ausenciaId) && !v.vagaExtra
      ).length;
      const target = Math.max(0, 8 - alunosEfetivos + faltasCount - totalRepos - existingFaltaVagas);
      const existingExtras = vagas.filter(v => v.vagaExtra && v.turmaId === turma.id && v.data === date);
      const diff = target - existingExtras.length;
      if (diff > 0) {
        for (let i = 0; i < diff; i++) {
          vagas.push({ id: genId('ve'), turmaId: turma.id, data: date, vagaExtra: true, faltaId: null });
        }
      } else if (diff < 0) {
        let toRemove = -diff;
        vagas = vagas.filter(v => {
          if (v.vagaExtra && v.turmaId === turma.id && v.data === date && toRemove > 0) {
            toRemove--;
            return false;
          }
          return true;
        });
      }
    });
  });
  return vagas;
}

function getDiaSemanaFromDateStr(dateStr) {
  const d = parseDate(dateStr);
  const names = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  return names[d.getDay()];
}

function getFaltaEarliest(falta) {
  return [...falta.datas].sort()[0];
}

function getFaltaExpiry(falta) {
  const d = parseDate(getFaltaEarliest(falta));
  d.setDate(d.getDate() + 30);
  return dateToStr(d);
}

function getAusenciaExpiry(aus) {
  const [y,m] = aus.mesAno.split('-').map(Number);
  const last = new Date(y, m, 0);
  last.setDate(last.getDate() + 30);
  return dateToStr(last);
}

function getLastDayOfMonth(mesAno) {
  const [y,m] = mesAno.split('-').map(Number);
  return dateToStr(new Date(y, m, 0));
}

function getMesNome(mesAno) {
  const [,m] = mesAno.split('-').map(Number);
  return MESES_PT[m-1];
}

function genId(prefix='id') {
  return `${prefix}-${Date.now()}-${Math.random().toString(36).substr(2,6)}`;
}

function getTurmaLabel(turmas, id) {
  const t = turmas.find(x => x.id === id);
  if (!t) return '?';
  if (t.id === TURMA_EXTRA_ID) return 'Extra';
  return `${ABREV[t.diaSemana]} ${t.horario}`;
}

function pruneLog(log) {
  const cutoff = new Date(Date.now() - LOG_RETENTION_DAYS * 24 * 60 * 60 * 1000).toISOString();
  return arr(log).filter(e => e.ts && e.ts >= cutoff).slice(0, MAX_LOG);
}

function addLog(currentLog, professor, descricao) {
  const entry = { id: genId('log'), ts: new Date().toISOString(), professor: professor || '?', descricao };
  return pruneLog([entry, ...arr(currentLog)]);
}

function sortTurmas(turmas) {
  return [...turmas].sort((a,b) => {
    if (a.id === TURMA_EXTRA_ID) return 1;
    if (b.id === TURMA_EXTRA_ID) return -1;
    const da = DIAS_ORDER.indexOf(a.diaSemana), db = DIAS_ORDER.indexOf(b.diaSemana);
    if (da !== db) return da - db;
    return a.horario.localeCompare(b.horario);
  });
}

function calcOccupancy(turmaId, date, state) {
  const turma = state.turmas.find(t => t.id === turmaId);
  if (!turma) return 0;
  const mesAno = date.slice(0, 7);
  const vacCount = arr(state.ausencias).filter(a =>
    a.turmaId === turmaId && a.mesAno === mesAno && turma.alunos.includes(a.alunoNome)
  ).length;
  const alunosEfetivos = turma.alunos.length - vacCount;
  const faltasOnDate = state.faltas.filter(f =>
    f.turmaId === turmaId && f.datas.includes(date) &&
    (f.status === 'pendente' || f.status === 'marcada')
  ).length;
  const repos = state.reposicoes.filter(r =>
    r.turmaReposicaoId === turmaId && r.dataReposicao === date && !r.realizada
  ).length;
  return alunosEfetivos - faltasOnDate + repos;
}

// ==================== REDUCER ====================
function reducer(state, action) {
  let next;
  switch (action.type) {

    case 'ADD_CREDITO': {
      const cred = {
        id: genId('cred'),
        alunoNome: action.alunoNome,
        turmaId: action.turmaId,
        dataExpiracao: action.dataExpiracao,
        usado: false,
        criadoPor: action.professor || null,
        criadoEm: new Date().toISOString()
      };
      next = { ...state, creditos: [...arr(state.creditos), cred] };
      const tLbl = getTurmaLabel(state.turmas, action.turmaId);
      next.log = addLog(state.log, action.professor, `Deu crédito extra de reposição para ${action.alunoNome} (${tLbl}) — expira ${fmtBRFull(action.dataExpiracao)}`);
      break;
    }

    case 'DELETE_CREDITO': {
      next = { ...state, creditos: arr(state.creditos).filter(c => c.id !== action.id) };
      break;
    }

    case 'DISMISS_SEED_WARNING':
      next = {...state, _seedWarning: false};
      break;

    case 'DELETE_LOG_ENTRY':
      next = { ...state, log: arr(state.log).filter(e => e.id !== action.id) };
      break;

    case 'SET_ALUNO_WATCHLIST': {
      next = { ...state, acessos: state.acessos.map(a =>
        a.alunoNome === action.alunoNome && a.turmaId === action.turmaId
          ? { ...a, watchlist: action.watchlist }
          : a
      )};
      break;
    }

    case 'CANCEL_VAGAS_SLOT':
      next = { ...state, vagas: state.vagas.map(v =>
        v.turmaId === action.turmaId && v.data === action.data
          ? { ...v, cancelada: action.cancelada }
          : v
      )};
      break;

    case 'ADD_TURMA': {
      const { diaSemana, horario, observacao } = action;
      const id = `${diaSemana.slice(0,3).replace('ç','c').replace('á','a')}-${horario}`;
      if (state.turmas.find(t => t.id === id)) return state;
      next = { ...state, turmas: [...state.turmas, { id, diaSemana, horario, capacidade: 7, observacao: observacao||'', alunos: [] }] };
      break;
    }

    case 'DELETE_TURMA': {
      next = {
        ...state,
        turmas: state.turmas.filter(t => t.id !== action.id),
        faltas: state.faltas.filter(f => f.turmaId !== action.id),
        vagas: state.vagas.filter(v => v.turmaId !== action.id),
        ausencias: state.ausencias.filter(a => a.turmaId !== action.id)
      };
      break;
    }

    case 'UPDATE_TURMA_OBS': {
      next = { ...state, turmas: state.turmas.map(t => t.id === action.id ? {...t, observacao: action.observacao} : t) };
      break;
    }

    case 'ADD_ALUNO': {
      const newTurmasAdd = state.turmas.map(t => {
        if (t.id !== action.turmaId) return t;
        if (t.alunos.includes(action.nome)) return t;
        return {...t, alunos: [...t.alunos, action.nome]};
      });
      const td_add = todayStr();
      next = { ...state, turmas: newTurmasAdd, vagas: computeVagasExtras(newTurmasAdd, state.faltas, state.reposicoes, state.vagas, td_add, state.ausencias) };
      if (!state.turmas.find(t => t.id === action.turmaId)?.alunos.includes(action.nome)) {
        const tLbl = getTurmaLabel(state.turmas, action.turmaId);
        next.log = addLog(state.log, action.professor, `Adicionou ${action.nome} à turma ${tLbl}`);
      }
      break;
    }

    case 'REMOVE_ALUNO': {
      const newTurmasRem = state.turmas.map(t => {
        if (t.id !== action.turmaId) return t;
        return {...t, alunos: t.alunos.filter(a => a !== action.nome)};
      });
      const td_rem = todayStr();
      next = { ...state, turmas: newTurmasRem, vagas: computeVagasExtras(newTurmasRem, state.faltas, state.reposicoes, state.vagas, td_rem, state.ausencias) };
      {
        const tLbl = getTurmaLabel(state.turmas, action.turmaId);
        next.log = addLog(state.log, action.professor, `Removeu ${action.nome} da turma ${tLbl}`);
      }
      break;
    }

    case 'RENAME_ALUNO': {
      const { turmaId: renTurmaId, oldNome, newNome: renNome } = action;
      if (!renNome || renNome === oldNome) { next = state; break; }
      const newTurmasRen = state.turmas.map(t => {
        if (t.id !== renTurmaId) return t;
        return { ...t, alunos: t.alunos.map(a => a === oldNome ? renNome : a) };
      });
      const newFaltasRen = state.faltas.map(f =>
        f.turmaId === renTurmaId && f.alunoNome === oldNome ? { ...f, alunoNome: renNome } : f
      );
      const newReposRen = state.reposicoes.map(r =>
        r.turmaOrigemId === renTurmaId && r.alunoNome === oldNome ? { ...r, alunoNome: renNome } : r
      );
      const newAusenciasRen = state.ausencias.map(a =>
        a.turmaId === renTurmaId && a.alunoNome === oldNome ? { ...a, alunoNome: renNome } : a
      );
      const newAcessosRen = (state.acessos || []).map(a =>
        a.turmaId === renTurmaId && a.alunoNome === oldNome ? { ...a, alunoNome: renNome } : a
      );
      const tLblRen = getTurmaLabel(state.turmas, renTurmaId);
      next = {
        ...state,
        turmas: newTurmasRen,
        faltas: newFaltasRen,
        reposicoes: newReposRen,
        ausencias: newAusenciasRen,
        acessos: newAcessosRen,
        log: addLog(state.log, action.professor, `Renomeou ${oldNome} → ${renNome} (${tLblRen})`),
      };
      break;
    }

    case 'ADD_FALTA': {
      const { alunoNome, turmaId } = action;
      const datasComTipoRaw = action.datasComTipo || (action.datas || []).map(d => ({ data: d, semAntecedencia: false }));
      const datasComTipo = datasComTipoRaw.filter(({ data }) => !FERIADOS_SET.has(data) && !isRecesso(data));
      const newFaltas = [];
      const newVagas = [];
      let reposicoes = state.reposicoes;
      datasComTipo.forEach(({ data, semAntecedencia }) => {
        const exists = state.faltas.some(f =>
          f.alunoNome === alunoNome && f.turmaId === turmaId &&
          f.datas.includes(data) && (f.status === 'pendente' || f.status === 'marcada')
        );
        if (exists) return;
        const faltaId = genId('f');
        newFaltas.push({ id: faltaId, alunoNome, turmaId, datas: [data], status: 'pendente', semAntecedencia: !!semAntecedencia, criadoPor: action.professor || null, criadoEm: new Date().toISOString() });
        const repoOrfao = reposicoes.find(r =>
          r.turmaReposicaoId === turmaId && r.dataReposicao === data &&
          !r.realizada && !r.vagaConsumedFaltaId
        );
        if (repoOrfao) {
          reposicoes = reposicoes.map(r =>
            r.id === repoOrfao.id ? { ...r, vagaConsumedFaltaId: faltaId, vagaExtra: false, semVagaOficial: false } : r
          );
        } else {
          newVagas.push({ id: genId('v'), turmaId, data, faltaId });
        }
      });
      next = { ...state, faltas: [...state.faltas, ...newFaltas], vagas: [...state.vagas, ...newVagas], reposicoes };
      if (newFaltas.length) {
        const tLbl = getTurmaLabel(state.turmas, turmaId);
        const datasLbl = fmtDatesText(newFaltas.map(f => f.datas[0]));
        const hasSemAnt = newFaltas.some(f => f.semAntecedencia);
        next.log = addLog(state.log, action.professor, `Registrou falta${hasSemAnt ? ' sem antecedência' : ''} de ${alunoNome} (${tLbl}) — ${datasLbl}`);
      }
      break;
    }

    case 'ADD_REPOSICAO': {
      const { alunoNome, dataReposicao, turmaReposicaoId, tipo } = action;
      const repoId = genId('r');
      const semVagaOficial = action.semVagaOficial || false;
      const vagaConsumedRaw = action.vagaSelId ? state.vagas.find(v => v.id === action.vagaSelId) : null;
      // If the selected vaga is a vagaExtra but a falta/ausencia vaga is available for the same slot,
      // prefer consuming the falta vaga so the extra slot stays free
      const vagaConsumed = (vagaConsumedRaw?.vagaExtra)
        ? (state.vagas.find(v => v.turmaId === turmaReposicaoId && v.data === dataReposicao && (v.faltaId || v.ausenciaId) && !v.vagaExtra) || vagaConsumedRaw)
        : vagaConsumedRaw;
      const vagaConsumedFaltaId = vagaConsumed?.faltaId || null;
      const vagaConsumedAusenciaId = vagaConsumed?.ausenciaId || null;
      const isVagaExtra = !!(vagaConsumed?.vagaExtra);
      const removeVagaSel = vs => vagaConsumed ? vs.filter(v => v.id !== vagaConsumed.id) : vs;

      // Handle booking with vacation credit
      if (action.ausenciaId) {
        next = {
          ...state,
          ausencias: state.ausencias.map(a => a.id === action.ausenciaId ? {...a, creditoUsado: true} : a),
          reposicoes: [...state.reposicoes, {
            id: repoId, alunoNome,
            turmaOrigemId: action.turmaOrigemId,
            faltaId: null, ausenciaId: action.ausenciaId,
            vagaConsumedAusenciaId,
            dataReposicao, turmaReposicaoId,
            tipo: 'reposicao_ferias', realizada: false, semVagaOficial,
            vagaConsumedFaltaId, vagaExtra: isVagaExtra,
            criadoPor: action.professor || null, criadoEm: new Date().toISOString()
          }],
          vagas: removeVagaSel(state.vagas)
        };
        const tOLbl = getTurmaLabel(state.turmas, action.turmaOrigemId);
        const tRLbl = getTurmaLabel(state.turmas, turmaReposicaoId);
        next.log = addLog(state.log, action.professor, `Agendou reposição (férias) de ${alunoNome} (${tOLbl}) → ${tRLbl}, ${fmtBRFull(dataReposicao)}`);
      } else if (action.creditoId) {
        next = {
          ...state,
          creditos: arr(state.creditos).map(c => c.id === action.creditoId ? {...c, usado: true} : c),
          reposicoes: [...state.reposicoes, {
            id: repoId, alunoNome,
            turmaOrigemId: action.turmaOrigemId,
            faltaId: null, creditoId: action.creditoId,
            vagaConsumedFaltaId, vagaExtra: isVagaExtra,
            dataReposicao, turmaReposicaoId,
            tipo: 'reposicao_credito', realizada: false, semVagaOficial,
            criadoPor: action.professor || null, criadoEm: new Date().toISOString()
          }],
          vagas: removeVagaSel(state.vagas)
        };
        const tOLbl = getTurmaLabel(state.turmas, action.turmaOrigemId);
        const tRLbl = getTurmaLabel(state.turmas, turmaReposicaoId);
        next.log = addLog(state.log, action.professor, `Agendou reposição (crédito extra) de ${alunoNome} (${tOLbl}) → ${tRLbl}, ${fmtBRFull(dataReposicao)}`);
      } else if (tipo === 'aula_extra') {
        const turmaOrigem = state.turmas.find(t => t.alunos.includes(alunoNome));
        next = { ...state,
          reposicoes: [...state.reposicoes, {
            id: repoId, alunoNome,
            turmaOrigemId: turmaOrigem?.id || null,
            faltaId: null, dataReposicao, turmaReposicaoId,
            tipo: 'aula_extra', realizada: false, semVagaOficial, pago: false,
            vagaConsumedFaltaId, vagaExtra: isVagaExtra,
            criadoPor: action.professor || null, criadoEm: new Date().toISOString()
          }],
          vagas: removeVagaSel(state.vagas)
        };
        const tOLbl = getTurmaLabel(state.turmas, turmaOrigem?.id);
        const tRLbl = getTurmaLabel(state.turmas, turmaReposicaoId);
        next.log = addLog(state.log, action.professor, `Agendou aula extra de ${alunoNome} (${tOLbl}) → ${tRLbl}, ${fmtBRFull(dataReposicao)}`);
      } else {
        const pending = action.faltaId
          ? state.faltas.filter(f => f.id === action.faltaId && f.status === 'pendente')
          : state.faltas
              .filter(f => f.alunoNome === alunoNome && f.turmaId === action.turmaOrigemId && f.status === 'pendente' && !f.semAntecedencia)
              .sort((a,b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));
        if (pending.length) {
          const oldest = pending[0];
          next = {
            ...state,
            faltas: state.faltas.map(f => f.id === oldest.id ? {...f, status:'marcada', reposicaoId: repoId} : f),
            reposicoes: [...state.reposicoes, {
              id: repoId, alunoNome,
              turmaOrigemId: oldest.turmaId, faltaId: oldest.id,
              dataReposicao, turmaReposicaoId, tipo: 'reposicao', realizada: false, semVagaOficial,
              vagaConsumedFaltaId, vagaExtra: isVagaExtra,
              criadoPor: action.professor || null, criadoEm: new Date().toISOString()
            }],
            vagas: removeVagaSel(state.vagas)
          };
          const tOLbl = getTurmaLabel(state.turmas, oldest.turmaId);
          const tRLbl = getTurmaLabel(state.turmas, turmaReposicaoId);
          next.log = addLog(state.log, action.professor, `Agendou reposição de ${alunoNome} (${tOLbl}) → ${tRLbl}, ${fmtBRFull(dataReposicao)}`);
        } else {
          // Reposição sem falta vinculada
          const turmaOrigem = state.turmas.find(t => t.alunos.includes(alunoNome));
          next = { ...state,
            reposicoes: [...state.reposicoes, {
              id: repoId, alunoNome,
              turmaOrigemId: turmaOrigem?.id || null,
              faltaId: null, dataReposicao, turmaReposicaoId,
              tipo: 'reposicao', realizada: false, semVagaOficial,
              vagaConsumedFaltaId, vagaExtra: isVagaExtra,
              semFaltaVinculada: true,
              observacao: 'Reposição sem falta vinculada — verificar',
              criadoPor: action.professor || null, criadoEm: new Date().toISOString()
            }],
            vagas: removeVagaSel(state.vagas)
          };
          const tOLbl = getTurmaLabel(state.turmas, turmaOrigem?.id);
          const tRLbl = getTurmaLabel(state.turmas, turmaReposicaoId);
          next.log = addLog(state.log, action.professor, `Agendou reposição de ${alunoNome} (${tOLbl}) → ${tRLbl}, ${fmtBRFull(dataReposicao)}`);
        }
      }
      // Recompute vagasExtras so a booking (especially semVagaOficial) immediately recalculates open slots
      if (next) {
        const td_ar = todayStr();
        next = { ...next, vagas: computeVagasExtras(next.turmas, next.faltas, next.reposicoes, next.vagas, td_ar, next.ausencias) };
      }
      break;
    }

    case 'MARK_PAGO': {
      const repoMp = state.reposicoes.find(r => r.id === action.id);
      next = { ...state, reposicoes: state.reposicoes.map(r =>
        r.id === action.id ? { ...r, pago: !r.pago } : r
      )};
      if (repoMp) {
        const tLbl = getTurmaLabel(state.turmas, repoMp.turmaOrigemId);
        const novoEstado = !repoMp.pago ? 'paga' : 'não paga';
        next.log = addLog(state.log, action.professor, `Marcou aula extra de ${repoMp.alunoNome} (${tLbl}) como ${novoEstado}`);
      }
      break;
    }

    case 'CANCEL_REPOSICAO': {
      const repo = state.reposicoes.find(r => r.id === action.id);
      if (!repo) return state;

      // Special case: vacation-credit reposicao
      if (repo.tipo === 'reposicao_ferias') {
        const remainingRepos = state.reposicoes.filter(r => r.id !== repo.id);
        let newVagas = state.vagas;
        let newAusenciasCR = state.ausencias;
        // Restore vacation credit
        if (repo.ausenciaId) {
          newAusenciasCR = newAusenciasCR.map(a => a.id === repo.ausenciaId ? {...a, creditoUsado: false} : a);
        }
        // Recreate the consumed vacation vaga so others can still book it
        if (repo.vagaConsumedAusenciaId) {
          const jaExiste = newVagas.some(v => v.ausenciaId === repo.vagaConsumedAusenciaId && v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao);
          if (!jaExiste) {
            newVagas = [...newVagas, { id: genId('vf'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, tipo: 'ferias', ausenciaId: repo.vagaConsumedAusenciaId }];
          }
        } else if (repo.vagaConsumedFaltaId) {
          // consumed a regular falta vaga
          const jaExiste = newVagas.some(v => v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao && v.faltaId === repo.vagaConsumedFaltaId);
          if (!jaExiste) {
            newVagas = [...newVagas, { id: genId('v'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, faltaId: repo.vagaConsumedFaltaId }];
          }
        }
        next = { ...state, vagas: newVagas, reposicoes: remainingRepos, ausencias: newAusenciasCR };
        const tLblCR = getTurmaLabel(state.turmas, repo.turmaOrigemId);
        const tRepoCR = getTurmaLabel(state.turmas, repo.turmaReposicaoId);
        next.log = addLog(state.log, action.professor, `Cancelou reposição (férias) de ${repo.alunoNome} (${tLblCR}) → ${tRepoCR} ${fmtBRFull(repo.dataReposicao)}`);
        next.estatisticas = { ...next.estatisticas, reposCanceladas: [...arr((next.estatisticas||{}).reposCanceladas), { alunoNome: repo.alunoNome, turmaId: repo.turmaOrigemId, turmaReposicaoId: repo.turmaReposicaoId, dataReposicao: repo.dataReposicao, semCredito: false, ts: new Date().toISOString() }] };
        break;
      }

      if (repo.tipo === 'reposicao_credito') {
        const remainingRepos = state.reposicoes.filter(r => r.id !== repo.id);
        let newVagas = state.vagas;
        let newCreditos = state.creditos;
        // Restore credit
        if (repo.creditoId) {
          newCreditos = arr(newCreditos).map(c => c.id === repo.creditoId ? {...c, usado: false} : c);
        }
        if (repo.vagaConsumedFaltaId) {
          const jaExiste = newVagas.some(v => v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao && v.faltaId === repo.vagaConsumedFaltaId);
          if (!jaExiste) newVagas = [...newVagas, { id: genId('v'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, faltaId: repo.vagaConsumedFaltaId }];
        }
        next = { ...state, vagas: newVagas, reposicoes: remainingRepos, creditos: newCreditos };
        const tLblCred = getTurmaLabel(state.turmas, repo.turmaOrigemId);
        const tRepoCred = getTurmaLabel(state.turmas, repo.turmaReposicaoId);
        next.log = addLog(state.log, action.professor, `Cancelou reposição (crédito extra) de ${repo.alunoNome} (${tLblCred}) → ${tRepoCred} ${fmtBRFull(repo.dataReposicao)}`);
        next.estatisticas = { ...next.estatisticas, reposCanceladas: [...arr((next.estatisticas||{}).reposCanceladas), { alunoNome: repo.alunoNome, turmaId: repo.turmaOrigemId, turmaReposicaoId: repo.turmaReposicaoId, dataReposicao: repo.dataReposicao, semCredito: false, ts: new Date().toISOString() }] };
        break;
      }

      // Remaining reposições after removing the canceled one
      const remainingRepos = state.reposicoes.filter(r => r.id !== repo.id);

      // Active reposições for this student+turmaOrigem (excluding aula_extra)
      const activeRepos = remainingRepos
        .filter(r => r.alunoNome === repo.alunoNome && r.turmaOrigemId === repo.turmaOrigemId && !r.realizada && r.faltaId)
        .sort((a, b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));

      // All marcada faltas for this student+turmaOrigem, oldest first
      const marcadas = state.faltas
        .filter(f => f.alunoNome === repo.alunoNome && f.turmaId === repo.turmaOrigemId && f.status === 'marcada')
        .sort((a, b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));

      let newFaltas = state.faltas;
      let newVagas = state.vagas;
      let newReposicoes = remainingRepos;

      marcadas.forEach((falta, i) => {
        if (i < activeRepos.length) {
          // Relink oldest faltas to remaining reposições
          newFaltas = newFaltas.map(f => f.id === falta.id ? { ...f, reposicaoId: activeRepos[i].id } : f);
          newReposicoes = newReposicoes.map(r => r.id === activeRepos[i].id ? { ...r, faltaId: falta.id } : r);
        } else {
          // Newest falta — free it back to pendente and reopen its vaga
          newFaltas = newFaltas.map(f => f.id === falta.id ? { ...f, status: 'pendente', reposicaoId: undefined } : f);
          const extra = falta.datas
            .filter(d => !newVagas.some(v => v.turmaId === falta.turmaId && v.data === d && v.faltaId === falta.id))
            .map(d => ({ id: genId('v'), turmaId: falta.turmaId, data: d, faltaId: falta.id }));
          newVagas = [...newVagas, ...extra];
        }
      });

      // Recreate the slot vaga that this reposição had consumed (another student's falta vaga)
      if (repo.vagaConsumedFaltaId) {
        const jaExiste = newVagas.some(v => v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao && v.faltaId === repo.vagaConsumedFaltaId);
        if (!jaExiste) {
          newVagas = [...newVagas, { id: genId('v'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, faltaId: repo.vagaConsumedFaltaId }];
        }
      }
      if (repo.vagaConsumedAusenciaId) {
        const jaExiste = newVagas.some(v => v.ausenciaId === repo.vagaConsumedAusenciaId && v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao);
        if (!jaExiste) {
          newVagas = [...newVagas, { id: genId('vf'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, tipo: 'ferias', ausenciaId: repo.vagaConsumedAusenciaId }];
        }
      }
      next = { ...state, faltas: newFaltas, vagas: newVagas, reposicoes: newReposicoes };
      {
        const tLbl = getTurmaLabel(state.turmas, repo.turmaOrigemId);
        const tRepo = getTurmaLabel(state.turmas, repo.turmaReposicaoId);
        next.log = addLog(state.log, action.professor, `Cancelou reposição de ${repo.alunoNome} (${tLbl}) → ${tRepo} ${fmtBRFull(repo.dataReposicao)}`);
        next.estatisticas = { ...(next.estatisticas||{}), reposCanceladas: [...arr((next.estatisticas||{}).reposCanceladas), { alunoNome: repo.alunoNome, turmaId: repo.turmaOrigemId, turmaReposicaoId: repo.turmaReposicaoId, dataReposicao: repo.dataReposicao, semCredito: false, ts: new Date().toISOString() }] };
      }
      break;
    }

    case 'CANCEL_REPOSICAO_SEM_CREDITO': {
      // Remove a reposição sem reverter a falta (menos de 24h).
      const repo = state.reposicoes.find(r => r.id === action.id);
      if (!repo) return state;
      const remainingRepos = state.reposicoes.filter(r => r.id !== repo.id);
      let newVagas = state.vagas;
      // Se havia uma vaga "consumida" por essa reposição, recria a vaga para outros usarem
      if (repo.vagaConsumedFaltaId) {
        const jaExiste = newVagas.some(v => v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao && v.faltaId === repo.vagaConsumedFaltaId);
        if (!jaExiste) {
          newVagas = [...newVagas, { id: genId('v'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, faltaId: repo.vagaConsumedFaltaId }];
        }
      }
      // Se havia uma vaga de férias consumida, recria para outros poderem usar
      if (repo.vagaConsumedAusenciaId) {
        const jaExiste = newVagas.some(v => v.ausenciaId === repo.vagaConsumedAusenciaId && v.turmaId === repo.turmaReposicaoId && v.data === repo.dataReposicao);
        if (!jaExiste) {
          newVagas = [...newVagas, { id: genId('vf'), turmaId: repo.turmaReposicaoId, data: repo.dataReposicao, tipo: 'ferias', ausenciaId: repo.vagaConsumedAusenciaId }];
        }
      }
      next = { ...state, reposicoes: remainingRepos, vagas: newVagas };
      const tLbl = getTurmaLabel(state.turmas, repo.turmaOrigemId);
      const tRepoSC = getTurmaLabel(state.turmas, repo.turmaReposicaoId);
      next.log = addLog(state.log, action.professor, `Cancelou reposição sem crédito — ${repo.alunoNome} (${tLbl}) → ${tRepoSC} ${fmtBRFull(repo.dataReposicao)}`);
      next.estatisticas = { ...(next.estatisticas||{}), reposCanceladas: [...arr((next.estatisticas||{}).reposCanceladas), { alunoNome: repo.alunoNome, turmaId: repo.turmaOrigemId, turmaReposicaoId: repo.turmaReposicaoId, dataReposicao: repo.dataReposicao, semCredito: true, ts: new Date().toISOString() }] };
      break;
    }

    case 'GERAR_ACESSO': {
      const { alunoNome, turmaId } = action;
      const existing = state.acessos.find(a => a.alunoNome === alunoNome && a.turmaId === turmaId);
      if (existing) { next = state; break; }
      const codigo = String(Math.floor(100000 + Math.random() * 900000));
      next = { ...state, acessos: [...state.acessos, { id: genId('ac'), codigo, alunoNome, turmaId }] };
      break;
    }

    case 'CANCEL_FALTA': {
      const falta = state.faltas.find(f => f.id === action.id);
      if (!falta) return state;
      // Remove the vaga linked to this falta
      let newVagas = state.vagas.filter(v => v.faltaId !== falta.id);
      let newRepos = state.reposicoes;
      // If another student's reposição had consumed this falta's vaga, reassign it to another available vaga
      const repoVinc = state.reposicoes.find(r => r.vagaConsumedFaltaId === falta.id);
      if (repoVinc) {
        const outraVaga = newVagas.find(v =>
          v.turmaId === repoVinc.turmaReposicaoId && v.data === repoVinc.dataReposicao
        );
        if (outraVaga) {
          newRepos = newRepos.map(r => r.id === repoVinc.id ? {
            ...r,
            vagaConsumedFaltaId: outraVaga.faltaId || null,
            vagaConsumedAusenciaId: outraVaga.ausenciaId || null,
            vagaExtra: !!(outraVaga.vagaExtra)
          } : r);
          newVagas = newVagas.filter(v => v.id !== outraVaga.id);
        } else {
          newRepos = newRepos.map(r => r.id === repoVinc.id ? { ...r, vagaConsumedFaltaId: null } : r);
        }
      }
      const newFaltasCF = state.faltas.filter(f => f.id !== falta.id);
      const td_cf = todayStr();
      const vagasComExtrasCF = computeVagasExtras(state.turmas, newFaltasCF, newRepos, newVagas, td_cf, state.ausencias);
      next = { ...state, faltas: newFaltasCF, vagas: vagasComExtrasCF, reposicoes: newRepos };
      const tLbl = getTurmaLabel(state.turmas, falta.turmaId);
      next.log = addLog(state.log, action.professor, `Cancelou falta de ${falta.alunoNome} (${tLbl}) — ${fmtBRFull(falta.datas[0])}`);
      break;
    }

    case 'ADD_AUSENCIA': {
      const { alunoNome, turmaId, tipo, mesAno } = action;
      // Prevent duplicate ausencia for same student+turma+month
      if (state.ausencias.some(a => a.alunoNome === alunoNome && a.turmaId === turmaId && a.mesAno === mesAno)) {
        next = state; break;
      }
      // Rule: once per calendar year (unless professor override)
      const anoFerias = mesAno.slice(0, 4);
      if (!action.professorOverride && state.ausencias.some(a => a.alunoNome === alunoNome && a.turmaId === turmaId && a.mesAno.slice(0, 4) === anoFerias)) {
        next = state; break;
      }
      // Rule: December (12), January (1) and July (7) are recesso — no reposição credit
      const mesNum = parseInt(mesAno.split('-')[1]);
      const isMesEscolar = mesNum === 12 || mesNum === 1 || mesNum === 7;
      const ausId = genId('aus');
      const newAusencia = { id: ausId, alunoNome, turmaId, tipo, mesAno, creditoReposicao: isMesEscolar ? 0 : 1, creditoUsado: isMesEscolar };
      const newAusencias = [...state.ausencias, newAusencia];
      // Create one vaga per class date in the vacation month (so others can book the freed slot)
      const turmaAus = state.turmas.find(t => t.id === turmaId);
      let newVagasFerias = [];
      if (turmaAus) {
        const [y, m] = mesAno.split('-').map(Number);
        const firstDay = mesAno + '-01';
        const lastDay = dateToStr(new Date(y, m, 0));
        getClassDatesInRange(turmaAus, firstDay, lastDay).forEach(date => {
          if (FERIADOS_SET.has(date)) return; // No vacation vagas on holidays
          newVagasFerias.push({ id: genId('vf'), turmaId, data: date, tipo: 'ferias', ausenciaId: ausId });
        });
      }
      const td_aus = todayStr();
      const vagasComExtras = computeVagasExtras(state.turmas, state.faltas, state.reposicoes, [...state.vagas, ...newVagasFerias], td_aus, newAusencias);
      next = { ...state, ausencias: newAusencias, vagas: vagasComExtras };
      {
        const tLbl = getTurmaLabel(state.turmas, turmaId);
        next.log = addLog(state.log, action.professor, `Registrou férias de ${alunoNome} (${tLbl}) — ${getMesNome(mesAno).toLowerCase()}`);
      }
      break;
    }

    case 'USE_AUSENCIA_CREDITO': {
      next = { ...state, ausencias: state.ausencias.map(a => a.id === action.id ? {...a, creditoUsado:true} : a) };
      break;
    }

    case 'DELETE_AUSENCIA': {
      const ausDel = state.ausencias.find(a => a.id === action.id);
      const newAusenciasDel = state.ausencias.filter(a => a.id !== action.id);
      // Remove vacation vagas tied to this ausencia (future ones only)
      const vagasSemAus = state.vagas.filter(v => v.ausenciaId !== action.id);
      const td_del = todayStr();
      const vagasComExtrasDel = computeVagasExtras(state.turmas, state.faltas, state.reposicoes, vagasSemAus, td_del, newAusenciasDel);
      next = { ...state, ausencias: newAusenciasDel, vagas: vagasComExtrasDel };
      if (ausDel) {
        const tLbl = getTurmaLabel(state.turmas, ausDel.turmaId);
        next.log = addLog(state.log, action.professor, `Removeu férias de ${ausDel.alunoNome} (${tLbl}) — ${getMesNome(ausDel.mesAno).toLowerCase()}`);
      }
      break;
    }

    case 'SAVE_SNAPSHOT': {
      const snap = {
        id: genId('snap'),
        timestamp: new Date().toISOString(),
        label: action.label || fmtBRFull(todayStr()),
        conteudo: action.conteudo
      };
      const snaps = [snap, ...state.snapshots].slice(0, MAX_SNAPSHOTS);
      next = { ...state, snapshots: snaps };
      break;
    }

    case 'DELETE_SNAPSHOT': {
      next = { ...state, snapshots: state.snapshots.filter(s => s.id !== action.id) };
      break;
    }

    case 'IMPORT_MERGE': {
      const { faltas: newF = [], vagas: newV = [] } = action.data;
      const mergedFaltas = [...state.faltas];
      const mergedVagas = [...state.vagas];
      newF.forEach(f => {
        if (!mergedFaltas.find(x => x.alunoNome === f.alunoNome && x.turmaId === f.turmaId && JSON.stringify([...f.datas].sort()) === JSON.stringify([...x.datas].sort()))) {
          mergedFaltas.push(f);
        }
      });
      newV.forEach(v => {
        if (!mergedVagas.find(x => x.turmaId === v.turmaId && x.data === v.data)) {
          mergedVagas.push(v);
        }
      });
      next = { ...state, faltas: mergedFaltas, vagas: mergedVagas };
      break;
    }

    case 'CLEANUP': {
      const td = todayStr();
      const vagas = state.vagas.filter(v => v.data >= td);
      const reposicoes = state.reposicoes.map(r => r.dataReposicao < td ? {...r, realizada: true} : r);
      // IDs de reposições já realizadas
      const realizadasIds = new Set(reposicoes.filter(r => r.realizada).map(r => r.id));
      // Move expired pendente faltas to statistics
      const expiredFaltas = state.faltas.filter(f => f.status === 'pendente' && getFaltaExpiry(f) < td);
      let activeFaltas = state.faltas.filter(f => !(f.status === 'pendente' && getFaltaExpiry(f) < td));
      // Remove faltas marcadas cuja reposição já foi realizada E cujas datas de falta já passaram
      activeFaltas = activeFaltas.filter(f =>
        !(f.status === 'marcada' && f.reposicaoId && realizadasIds.has(f.reposicaoId) && f.datas.every(d => d < td))
      );
      const newExpStats = expiredFaltas.map(f => ({
        alunoNome: f.alunoNome, turmaId: f.turmaId,
        data: f.datas[0], expiradaEm: getFaltaExpiry(f)
      }));
      const estatisticas = {
        ...(state.estatisticas || {}),
        faltasExpiradas: [...arr((state.estatisticas || {}).faltasExpiradas), ...newExpStats]
      };
      const vagasComExtras = computeVagasExtras(state.turmas, state.faltas, reposicoes, vagas, td, state.ausencias);
      next = { ...state, vagas: vagasComExtras, reposicoes, faltas: activeFaltas, estatisticas };
      break;
    }

    case 'SYNC_FROM_FIREBASE': {
      const td = todayStr();
      const inc = normalizeState(action.data);
      // Rejeita estado corrompido: se não tem turmas, provavelmente é dado inválido
      if (inc.turmas.length === 0 && state.turmas.length > 0) {
        console.warn('SYNC_FROM_FIREBASE ignorado: estado recebido sem turmas, mantendo estado local');
        return state;
      }
      const expiredFaltas = inc.faltas.filter(f => f.status === 'pendente' && getFaltaExpiry(f) < td);
      const activeFaltas  = inc.faltas.filter(f => !(f.status === 'pendente' && getFaltaExpiry(f) < td));
      const newExpStats = expiredFaltas.map(f => ({
        alunoNome: f.alunoNome, turmaId: f.turmaId,
        data: f.datas[0], expiradaEm: getFaltaExpiry(f)
      }));
      const estatisticas = {
        ...(inc.estatisticas || {}),
        faltasExpiradas: [...arr((inc.estatisticas || {}).faltasExpiradas), ...newExpStats]
      };
      const reposSynced = inc.reposicoes.map(r => r.dataReposicao < td ? {...r, realizada: true} : r);
      const realizadasIdsSynced = new Set(reposSynced.filter(r => r.realizada).map(r => r.id));
      const cleanFaltas = activeFaltas.filter(f =>
        !(f.status === 'marcada' && f.reposicaoId && realizadasIdsSynced.has(f.reposicaoId) && f.datas.every(d => d < td))
      );
      const vagasFiltradas = inc.vagas.filter(v => v.data >= td);
      const vagasComExtras = computeVagasExtras(inc.turmas, cleanFaltas, reposSynced, vagasFiltradas, td, inc.ausencias);
      next = {
        ...inc,
        faltas:     cleanFaltas,
        vagas:      vagasComExtras,
        reposicoes: reposSynced,
        estatisticas,
      };
      break;
    }

    default:
      return state;
  }

  // Persist locally as cache
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch(e) { console.error('[atelie] falha ao salvar localStorage:', e); }
  return next;
}

function arr(v) { return Array.isArray(v) ? v : []; }

// Split any multi-date falta records into individual single-date records
function migrateFaltas(state) {
  var needsMig = state.faltas.some(function(f) { return f.datas && f.datas.length > 1; });
  if (!needsMig) return state;
  var newFaltas = [];
  var idMap = {}; // oldId -> [newId per date]
  state.faltas.forEach(function(f) {
    if (!f.datas || f.datas.length <= 1) { idMap[f.id] = [f.id]; newFaltas.push(f); return; }
    var sorted = [...f.datas].sort();
    var newIds = sorted.map(function(_, i) { return i === 0 ? f.id : genId('f'); });
    idMap[f.id] = newIds;
    sorted.forEach(function(data, i) {
      newFaltas.push({
        ...f, id: newIds[i], datas: [data],
        status: i === 0 ? f.status : 'pendente',
        reposicaoId: i === 0 ? f.reposicaoId : undefined,
      });
    });
  });
  // Fix vaga links: find the new faltaId that matches each vaga's date
  var newVagas = state.vagas.map(function(v) {
    if (!v.faltaId || !idMap[v.faltaId] || idMap[v.faltaId].length <= 1) return v;
    var match = newFaltas.find(function(f) { return idMap[v.faltaId].includes(f.id) && f.datas[0] === v.data; });
    return match ? {...v, faltaId: match.id} : v;
  });
  return {...state, faltas: newFaltas, vagas: newVagas};
}

function normalizeState(s) {
  if (!s || typeof s !== 'object') return {...SEED};
  var base = {
    ...s,
    turmas:     arr(s.turmas).map(function(t) {
                  return {...t, alunos: arr(t.alunos), capacidade: t.capacidade === 8 ? 7 : (t.capacidade || 7)};
                }),
    faltas:     arr(s.faltas),
    ausencias:  arr(s.ausencias),
    snapshots:  arr(s.snapshots),
    vagas:      arr(s.vagas),
    reposicoes: arr(s.reposicoes),
    log:        arr(s.log),
    acessos:    arr(s.acessos),
    creditos:   arr(s.creditos),
    estatisticas: { faltasExpiradas: arr((s.estatisticas || {}).faltasExpiradas), reposCanceladas: arr((s.estatisticas || {}).reposCanceladas) },
  };
  var afterFaltaMig = migrateFaltas(base);
  // Migration: create vacation vagas for existing ausencias that don't have them yet
  var hasAusenciaVagas = afterFaltaMig.vagas.some(function(v) { return !!v.ausenciaId; });
  if (!hasAusenciaVagas && afterFaltaMig.ausencias.length > 0) {
    var today = todayStr();
    var newVagasMig = [];
    afterFaltaMig.ausencias.forEach(function(a) {
      var turma = afterFaltaMig.turmas.find(function(t) { return t.id === a.turmaId; });
      if (!turma) return;
      var ya = parseInt(a.mesAno.split('-')[0]);
      var ma = parseInt(a.mesAno.split('-')[1]);
      var firstDay = a.mesAno + '-01';
      var lastDay = dateToStr(new Date(ya, ma, 0));
      getClassDatesInRange(turma, firstDay, lastDay).forEach(function(date) {
        if (date < today) return; // skip past dates
        if (FERIADOS_SET.has(date)) return; // skip holidays
        var jaExiste = afterFaltaMig.vagas.some(function(v) { return v.ausenciaId === a.id && v.data === date; });
        if (!jaExiste) {
          newVagasMig.push({ id: genId('vf'), turmaId: a.turmaId, data: date, tipo: 'ferias', ausenciaId: a.id });
        }
      });
    });
    if (newVagasMig.length > 0) {
      afterFaltaMig = { ...afterFaltaMig, vagas: [...afterFaltaMig.vagas, ...newVagasMig] };
    }
  }
  // Migration: clear vagaExtra/semVagaOficial on reposições that were later backed by a real falta vaga
  afterFaltaMig = {
    ...afterFaltaMig,
    reposicoes: afterFaltaMig.reposicoes.map(function(r) {
      if ((r.vagaConsumedFaltaId || r.vagaConsumedAusenciaId) && (r.vagaExtra || r.semVagaOficial)) {
        return { ...r, vagaExtra: false, semVagaOficial: false };
      }
      return r;
    })
  };
  // Migration: recreate vagas for pendente faltas that lost their vaga due to CANCEL_REPOSICAO bug
  // (safe: only recreates if no vaga exists AND no reposição is consuming it)
  var consumedFaltaIds = new Set(afterFaltaMig.reposicoes.map(function(r) { return r.vagaConsumedFaltaId; }).filter(Boolean));
  var vagaFaltaIds = new Set(afterFaltaMig.vagas.map(function(v) { return v.faltaId; }).filter(Boolean));
  var vagasRecriadas = [];
  afterFaltaMig.faltas.forEach(function(f) {
    if (f.status !== 'pendente') return;
    if (vagaFaltaIds.has(f.id)) return; // vaga already exists
    if (consumedFaltaIds.has(f.id)) return; // vaga is consumed by a reposição
    // Falta pendente with no vaga and not consumed — recreate it
    f.datas.forEach(function(d) {
      vagasRecriadas.push({ id: genId('v'), turmaId: f.turmaId, data: d, faltaId: f.id });
    });
  });
  if (vagasRecriadas.length > 0) {
    afterFaltaMig = { ...afterFaltaMig, vagas: [...afterFaltaMig.vagas, ...vagasRecriadas] };
  }
  // Migration: retroactively link semVagaOficial reposições to available falta/ausencia vagas
  // (happens when professor booked a reposição manually without a vaga slot being selected,
  //  but there were or now are falta vagas available for that turma/date)
  var vagasDisponiveis = [...afterFaltaMig.vagas];
  var reposComLink = afterFaltaMig.reposicoes.map(function(r) {
    if (r.tipo === 'aula_extra') return r;
    // Only process reposições not yet linked to a falta/ausencia vaga,
    // either booked without any slot (semVagaOficial) or consuming a vagaExtra instead
    if (!r.semVagaOficial && !r.vagaExtra) return r;
    if (r.vagaConsumedFaltaId || r.vagaConsumedAusenciaId) return r;
    var idx = vagasDisponiveis.findIndex(function(v) {
      return v.turmaId === r.turmaReposicaoId && v.data === r.dataReposicao && (v.faltaId || v.ausenciaId) && !v.vagaExtra;
    });
    if (idx < 0) return r;
    var vaga = vagasDisponiveis[idx];
    vagasDisponiveis.splice(idx, 1);
    return { ...r, vagaConsumedFaltaId: vaga.faltaId || null, vagaConsumedAusenciaId: vaga.ausenciaId || null, semVagaOficial: false, vagaExtra: false };
  });
  afterFaltaMig = { ...afterFaltaMig, reposicoes: reposComLink, vagas: vagasDisponiveis };

  // Migration: fix duplicate vagaConsumedFaltaId (race condition where two bookings consumed same slot)
  // First reposição keeps its claim; duplicates get reassigned to another available falta vaga.
  var seenClaimedFaltaIds = new Set();
  var vagasParaDedup = [...afterFaltaMig.vagas];
  var reposDedup = afterFaltaMig.reposicoes.map(function(r) {
    if (!r.vagaConsumedFaltaId) return r;
    if (!seenClaimedFaltaIds.has(r.vagaConsumedFaltaId)) {
      seenClaimedFaltaIds.add(r.vagaConsumedFaltaId);
      return r;
    }
    // Duplicate: find another falta vaga for the same slot
    var idx = vagasParaDedup.findIndex(function(v) {
      return v.turmaId === r.turmaReposicaoId && v.data === r.dataReposicao && v.faltaId && !v.vagaExtra && !seenClaimedFaltaIds.has(v.faltaId);
    });
    if (idx >= 0) {
      var vaga = vagasParaDedup[idx];
      vagasParaDedup.splice(idx, 1);
      seenClaimedFaltaIds.add(vaga.faltaId);
      return { ...r, vagaConsumedFaltaId: vaga.faltaId, vagaExtra: false, semVagaOficial: false };
    }
    return { ...r, vagaConsumedFaltaId: null, vagaExtra: true };
  });
  afterFaltaMig = { ...afterFaltaMig, reposicoes: reposDedup, vagas: vagasParaDedup };

  // Migration: retroactively link regular reposições that consumed an ausencia vaga
  // without vagaConsumedAusenciaId being set (old bookings before this field existed).
  // Strategy: for each unlinked regular reposição, find ausencias for the same turma+month,
  // then check which ausencia is missing its vaga for that date in the array.
  var reposComAusLink = afterFaltaMig.reposicoes.map(function(r) {
    if (r.vagaConsumedFaltaId || r.vagaConsumedAusenciaId) return r;
    if (r.vagaExtra || r.semVagaOficial) return r;
    if (r.tipo !== 'reposicao') return r;
    var mesRepo = r.dataReposicao ? r.dataReposicao.substring(0, 7) : null;
    if (!mesRepo) return r;
    var candidatos = afterFaltaMig.ausencias.filter(function(a) {
      return a.turmaId === r.turmaReposicaoId && a.mesAno === mesRepo;
    });
    if (candidatos.length === 0) return r;
    // Find ausencias whose vaga for this date is gone from the array,
    // and not already claimed by another reposição with vagaConsumedAusenciaId set
    var matched = candidatos.filter(function(a) {
      var vagaMissing = !afterFaltaMig.vagas.find(function(v) {
        return v.ausenciaId === a.id && v.data === r.dataReposicao;
      });
      if (!vagaMissing) return false;
      var alreadyClaimed = afterFaltaMig.reposicoes.some(function(other) {
        return other.id !== r.id && other.vagaConsumedAusenciaId === a.id && other.dataReposicao === r.dataReposicao;
      });
      return !alreadyClaimed;
    });
    if (matched.length !== 1) return r; // still ambiguous — skip
    return { ...r, vagaConsumedAusenciaId: matched[0].id };
  });
  afterFaltaMig = { ...afterFaltaMig, reposicoes: reposComAusLink };

  // Migration: recreate faltas for orphaned falta vagas (faltaId not found in faltas array)
  // Happens when a falta was cleaned prematurely before the fix that keeps it until its date passes.
  // We reconstruct it from the reposição that references that faltaId.
  var faltaIdsExistentes = new Set(afterFaltaMig.faltas.map(function(f) { return f.id; }));
  var tdRecreate = todayStr();
  var faltasRecreadas = [];
  afterFaltaMig.vagas.forEach(function(v) {
    if (!v.faltaId) return;
    if (faltaIdsExistentes.has(v.faltaId)) return;
    if (v.data < tdRecreate) return; // date already passed — no point recreating
    var repo = afterFaltaMig.reposicoes.find(function(r) { return r.faltaId === v.faltaId; });
    if (!repo) return;
    faltaIdsExistentes.add(v.faltaId); // prevent duplicates if multiple vagas share same faltaId
    faltasRecreadas.push({
      id: v.faltaId,
      alunoNome: repo.alunoNome,
      turmaId: repo.turmaOrigemId,
      datas: [v.data],
      status: 'marcada',
      reposicaoId: repo.id
    });
  });
  if (faltasRecreadas.length > 0) {
    afterFaltaMig = { ...afterFaltaMig, faltas: [...afterFaltaMig.faltas, ...faltasRecreadas] };
  }

  // Migration: ensure ausencias in recesso months (7, 12, 1) have no credit
  afterFaltaMig = { ...afterFaltaMig, ausencias: afterFaltaMig.ausencias.map(function(a) {
    var mo = parseInt(a.mesAno.split('-')[1]);
    if (mo === 12 || mo === 1 || mo === 7) {
      return { ...a, creditoReposicao: 0, creditoUsado: false };
    }
    return a;
  }) };
  // Migration: remove vagas that fall on recesso dates (e.g. João 18/07)
  afterFaltaMig = { ...afterFaltaMig, vagas: afterFaltaMig.vagas.filter(function(v) {
    return !isRecesso(v.data);
  }) };
  // Migration: ensure turma-extra exists
  if (!afterFaltaMig.turmas.find(function(t) { return t.id === TURMA_EXTRA_ID; })) {
    afterFaltaMig = { ...afterFaltaMig, turmas: [...afterFaltaMig.turmas, {id:TURMA_EXTRA_ID,diaSemana:null,horario:null,capacidade:99,observacao:'Alunos extras e ex-alunos',alunos:[]}] };
  }
  // Prune log to last 90 days
  afterFaltaMig = { ...afterFaltaMig, log: pruneLog(afterFaltaMig.log) };
  // Always recompute vagasExtras at the end so counts are correct after any migration
  var tdNorm = todayStr();
  var vagasNormFiltradas = afterFaltaMig.vagas.filter(function(v) { return v.data >= tdNorm; });
  afterFaltaMig = { ...afterFaltaMig, vagas: computeVagasExtras(afterFaltaMig.turmas, afterFaltaMig.faltas, afterFaltaMig.reposicoes, vagasNormFiltradas, tdNorm, afterFaltaMig.ausencias) };
  return afterFaltaMig;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeState(JSON.parse(raw));
  } catch(e) { console.error('[atelie] falha ao ler localStorage:', e); }
  return SEED;
}

function fetchFromFirebase() {
  var controller = new AbortController();
  var timeout = setTimeout(function() { controller.abort(); }, 30000);
  return fetch(DB_URL + '/state.json', { signal: controller.signal })
    .then(function(r) { clearTimeout(timeout); return r.json(); })
    .then(function(d) {
      if (d && typeof d === 'object') { var { _auth: _a, ...clean } = d; return clean; }
      return d;
    })
    .catch(function(err) {
      clearTimeout(timeout);
      throw err;
    });
}

const DB_WRITE_SECRET = '109';

function saveToFirebase(payload) {
  return fetch(DB_URL + '/state.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...payload, _auth: DB_WRITE_SECRET })
  });
}

// Salva snapshot horário em /snapshots/YYYY-MM-DDTHH.json (últimas 168h = 7 dias)
// Chamado após cada save bem-sucedido, throttled a 1 por hora.
var _lastSnapshotHour = '';
function maybeSaveSnapshot(state) {
  var now = new Date();
  var hour = now.toISOString().slice(0, 13); // "2026-06-16T15"
  if (hour === _lastSnapshotHour) return;
  _lastSnapshotHour = hour;
  var key = hour.replace('T', '-') + 'h'; // "2026-06-16-15h"
  var payload = { ...state, _auth: DB_WRITE_SECRET, _snapshotKey: key, _snapshotTs: now.toISOString() };
  fetch(DB_URL + '/snapshots/' + key + '.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).catch(function() {}); // silencioso — snapshot é melhor-esforço
  // Remove snapshot de 8 dias atrás (7 dias de retenção)
  var old = new Date(now - 8 * 24 * 60 * 60 * 1000);
  var oldKey = old.toISOString().slice(0, 13).replace('T', '-') + 'h';
  fetch(DB_URL + '/snapshots/' + oldKey + '.json', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' }
  }).catch(function() {});
}

// ==================== HELPER: PRÓXIMAS DATAS DE TURMA ====================
function getProximasDatas(turmaId, turmas, n, horasMin) {
  if (horasMin === undefined) horasMin = 24;
  const turma = turmas.find(t => t.id === turmaId);
  if (!turma) return [];
  const DIAS = { segunda:1, terça:2, quarta:3, quinta:4, sexta:5, sábado:6, domingo:0 };
  const targetDay = DIAS[turma.diaSemana];
  const horaAula = parseInt((turma.horario || '09h').replace('h',''), 10);
  const cutoff = new Date(Date.now() + horasMin * 3600 * 1000);
  const datas = [];
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  for (let i = 0; datas.length < n && i < 400; i++) {
    d.setDate(d.getDate() + 1);
    if (d.getDay() === targetDay) {
      const ds = dateToStr(d);
      const aula = new Date(d);
      aula.setHours(horaAula, 0, 0, 0);
      if (aula >= cutoff) datas.push(ds); // feriados included so UI can show them disabled
    }
  }
  return datas;
}

// ==================== MODAL: GERAR LINK DO ALUNO ====================
function GerarLinkModal({ state, dispatch, onClose }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [copied, setCopied] = useState(false);
  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turma = state.turmas.find(t => t.id === turmaId);
  const alunos = turma ? [...turma.alunos].sort((a,b) => a.localeCompare(b,'pt')) : [];
  const acesso = state.acessos.find(a => a.alunoNome === alunoNome && a.turmaId === turmaId);
  const link = acesso ? `${window.location.origin}${window.location.pathname}?c=${acesso.codigo}` : '';

  const handleGerar = () => {
    if (!turmaId || !alunoNome) return;
    dispatch({ type: 'GERAR_ACESSO', alunoNome, turmaId });
  };

  const handleCopy = () => {
    navigator.clipboard.writeText(link).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
  };

  return (
    <Modal title="Gerar link do aluno" onClose={onClose}>
      <div className="space-y-3 text-sm">
        <div>
          <label className="block text-xs font-medium text-gray-600 mb-1">Turma</label>
          <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione —</option>
            {sorted.map(t => <option key={t.id} value={t.id}>{getTurmaLabel(state.turmas, t.id)}</option>)}
          </select>
        </div>
        {turmaId && (
          <div>
            <label className="block text-xs font-medium text-gray-600 mb-1">Aluno</label>
            <select value={alunoNome} onChange={e => setAlunoNome(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2">
              <option value="">— Selecione —</option>
              {alunos.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        )}
        {alunoNome && !acesso && (
          <button onClick={handleGerar}
            className="w-full py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700">
            Gerar link
          </button>
        )}
        {acesso && (
          <div className="space-y-2">
            <div className="bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-xs text-gray-600 break-all">{link}</div>
            <button onClick={handleCopy}
              className={`w-full py-2 rounded-lg font-medium text-sm transition-colors ${copied ? 'bg-green-600 text-white' : 'bg-gray-800 text-white hover:bg-gray-900'}`}>
              {copied ? '✓ Copiado!' : 'Copiar link'}
            </button>
            <p className="text-xs text-gray-400 text-center">Este link é permanente para {alunoNome}.</p>
          </div>
        )}
      </div>
    </Modal>
  );
}

// ==================== HISTÓRICO DO ALUNO (inline na seção Turmas) ====================
function nomeExatoMatch(texto, nome) {
  const escaped = nome.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return new RegExp('(^|[\\s(,/—])' + escaped + '($|[\\s),/—])', 'i').test(texto);
}

function HistoricoAlunoContent({ alunoNome, turmaId, state }) {
  const td = todayStr();
  const turmaLabel = turmaId ? getTurmaLabel(state.turmas, turmaId) : null;

  const logEntries = arr(state.log)
    .filter(e => {
      const atuouComoAluno = !PROFESSORES.includes(alunoNome) && e.professor === alunoNome;
      if (!atuouComoAluno && !nomeExatoMatch(e.descricao, alunoNome)) return false;
      if (turmaLabel) return e.descricao.includes(turmaLabel);
      return true;
    })
    .map(e => ({ ts: e.ts, texto: e.descricao, tipo: 'log', autor: e.professor }));

  const faltaEvents = state.faltas
    .filter(f => f.alunoNome === alunoNome && (!turmaId || f.turmaId === turmaId))
    .flatMap(f => f.datas.filter(d => d < td).map(d => ({
      ts: d + 'T23:59:00',
      texto: `Faltou — ${getTurmaLabel(state.turmas, f.turmaId)} em ${fmtBRFull(d)}`,
      tipo: 'falta',
      autor: f.criadoPor || null
    })));

  const repoEvents = state.reposicoes
    .filter(r => r.alunoNome === alunoNome && r.realizada && (!turmaId || r.turmaOrigemId === turmaId))
    .map(r => ({
      ts: r.dataReposicao + 'T23:58:00',
      texto: `Repôs — ${getTurmaLabel(state.turmas, r.turmaReposicaoId)} em ${fmtBRFull(r.dataReposicao)}`,
      tipo: 'repo',
      autor: r.criadoPor || null
    }));

  const all = [...logEntries, ...faltaEvents, ...repoEvents]
    .sort((a, b) => b.ts.localeCompare(a.ts));

  if (all.length === 0) return <p className="text-xs text-gray-400 py-2 italic">Sem histórico registrado.</p>;

  return (
    <div className="space-y-1">
      {all.map((e, i) => {
        const dt = new Date(e.ts);
        const dataHora = dt.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) +
          (e.tipo === 'log' ? ' ' + dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : '');
        const autorColors = e.autor ? (PROFESSOR_COLORS[e.autor] || { bg:'bg-gray-100', text:'text-gray-600', dot:'bg-gray-400' }) : null;
        return (
          <div key={i} className="flex items-start gap-2 text-xs py-1 border-b border-gray-50 last:border-0">
            <span className={`shrink-0 mt-0.5 ${e.tipo === 'falta' ? 'text-red-400' : e.tipo === 'repo' ? 'text-blue-400' : 'text-gray-400'}`}>
              {e.tipo === 'falta' ? '✗' : e.tipo === 'repo' ? '↩' : '•'}
            </span>
            <span className="text-gray-700 flex-1">{e.texto}</span>
            {e.autor && (
              <span className={`inline-flex items-center gap-1 font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap shrink-0 ${autorColors.bg} ${autorColors.text}`}>
                <span className={`w-1.5 h-1.5 rounded-full ${autorColors.dot}`}></span>
                {e.autor}
              </span>
            )}
            <span className="text-gray-300 shrink-0">{dataHora}</span>
          </div>
        );
      })}
    </div>
  );
}

function HistoricoAlunoModal({ alunoNome, turmaId, state, onClose }) {
  const td = todayStr();
  const label = turmaId ? getTurmaLabel(state.turmas, turmaId) : null;
  const f = state.faltas.filter(f => f.alunoNome === alunoNome && (!turmaId || f.turmaId === turmaId) && f.status === 'pendente').length;
  const r = state.reposicoes.filter(r => r.alunoNome === alunoNome && (!turmaId || r.turmaOrigemId === turmaId) && !r.realizada && r.dataReposicao >= td).length;
  const title = (
    <span className="flex items-center gap-2">
      <span>Histórico — {alunoNome}{label ? ` (${label})` : ''}</span>
      {f > 0 && <span className="inline-flex items-center justify-center w-5 h-5 rounded text-xs font-bold bg-amber-100 text-amber-700">F{f}</span>}
      {r > 0 && <span className="inline-flex items-center justify-center w-5 h-5 rounded text-xs font-bold bg-blue-100 text-blue-700">R{r}</span>}
    </span>
  );
  return (
    <Modal title={title} onClose={onClose}>
      <HistoricoAlunoContent alunoNome={alunoNome} turmaId={turmaId} state={state} />
    </Modal>
  );
}

// ==================== SECTION 1: TURMAS ====================
function SectionTurmas({ state, dispatch }) {

           state.reposicoes.some(r => r.turmaOrigemId === turmaId && r.alunoNome === alunoNome && !r.realizada);

                      const n = (newNome[turma.id]||'').trim();

                    }} className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">OK</button>

                    const isRenaming = renamingAluno?.turmaId === TURMA_EXTRA_ID && renamingAluno?.nome === nome;

                          if (n) { dispatch({type:'ADD_ALUNO', turmaId: TURMA_EXTRA_ID, nome: n}); setNewNome(prev => ({...prev, [TURMA_EXTRA_ID]: ''})); setAddingAluno(null); }

            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Observação (opcional)</label>
              <input value={newTurma.observacao} onChange={e => setNewTurma(p => ({...p, observacao: e.target.value}))} className="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="ex: com Bia" />

                if (!state.turmas.some(t => t.diaSemana === newTurma.diaSemana && t.horario === newTurma.horario)) {
