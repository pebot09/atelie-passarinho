function AlunoView({ state, dispatch, acesso }) {
  const { alunoNome, turmaId } = acesso;
  const td = todayStr();
  const turma = state.turmas.find(t => t.id === turmaId);

  // Wrap dispatch to log as aluno
  const alunoDispatch = (action) => dispatch({ ...action, professor: alunoNome });

  // Accordion state
  const [open, setOpen] = useState({ falta: false, reposicao: false, minhas: false, ferias: false });
  const toggle = (key) => setOpen(o => ({ ...o, [key]: !o[key] }));

  // Regras modal
  const [showRegras, setShowRegras] = useState(false);

  // Férias
  const ausenciasAtivas = useMemo(() =>
    state.ausencias.filter(a => a.turmaId === turmaId && a.alunoNome === alunoNome),
    [state.ausencias, alunoNome, turmaId]);
  const ausenciaCredito = ausenciasAtivas.find(a => !a.creditoUsado && a.creditoReposicao > 0) || null;
  const [mesFerias, setMesFerias] = useState('');
  const [successFerias, setSuccessFerias] = useState('');
  const [confirmFeriasRepo, setConfirmFeriasRepo] = useState(null); // vaga para usar crédito férias

  // Available months for férias: current + next 5, max 1 per calendar year
  const mesesDisponiveisFerias = useMemo(() => {
    const meses = [];
    const now = new Date();
    for (let i = 0; i <= 5; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      const mesAno = dateToStr(d).slice(0, 7);
      const ano = mesAno.slice(0, 4);
      const jaTemEsteAno = ausenciasAtivas.some(a => a.mesAno.slice(0, 4) === ano);
      const jaTemEsteMes = ausenciasAtivas.some(a => a.mesAno === mesAno);
      if (!jaTemEsteAno && !jaTemEsteMes) meses.push(mesAno);
    }
    return meses;
  }, [ausenciasAtivas]);

  const handleRegistrarFerias = () => {
    if (!mesFerias) return;
    alunoDispatch({ type: 'ADD_AUSENCIA', alunoNome, turmaId, tipo: 'ferias', mesAno: mesFerias });
    setMesFerias('');
    setSuccessFerias('Férias registradas! Uma vaga será liberada por aula faltada.');
    setOpen(o => ({ ...o, ferias: false }));
    setTimeout(() => setSuccessFerias(''), 5000);
  };

  // Registrar falta — inclui hoje (data some só no dia seguinte)
  const proximasDatas = useMemo(() => {
    const turma = state.turmas.find(t => t.id === turmaId);
    if (!turma) return [];
    const DIAS = { segunda:1, terça:2, quarta:3, quinta:4, sexta:5, sábado:6, domingo:0 };
    const targetDay = DIAS[turma.diaSemana];
    const horaAula = parseInt((turma.horario || '09h').replace('h',''), 10);
    const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
    const datas = [];
    const d = new Date(); d.setHours(0, 0, 0, 0);
    for (let i = 0; datas.length < 8 && i < 400; i++, d.setDate(d.getDate() + 1)) {
      if (d.getDay() === targetDay) {
        const aula = new Date(d); aula.setHours(horaAula, 0, 0, 0);
        if (aula >= midnight) datas.push(dateToStr(new Date(d)));
      }
    }
    return datas;
  }, [turmaId, state.turmas]);
  // Helper: estado de cada data para registro de falta
  const getFaltaDateStatus = (d) => {
    const dt = getClassDatetime(turmaId, d, state.turmas);
    if (!dt) return 'normal';
    const horas = (dt - Date.now()) / 3600000;
    if (horas > 22) return 'normal';       // falta regular disponível
    if (horas > 2)  return 'semAnt';       // só sem antecedência
    return 'encerrado';                    // desabilitado (< 2h ou já passou)
  };
  const [selectedDates, setSelectedDates] = useState([]);
  const [successFalta, setSuccessFalta] = useState('');
  const toggleDate = (d) => {
    const status = getFaltaDateStatus(d);
    if (status === 'encerrado') return;
    setSelectedDates(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);
  };
  const handleRegistrarFalta = () => {
    if (!selectedDates.length) return;
    const datasComTipo = selectedDates.map(d => ({
      data: d,
      semAntecedencia: getFaltaDateStatus(d) === 'semAnt',
    }));
    alunoDispatch({ type: 'ADD_FALTA', alunoNome, turmaId, datasComTipo });
    setSelectedDates([]);
    setSuccessFalta('Falta registrada com sucesso!');
    setOpen(o => ({ ...o, falta: false }));
    setTimeout(() => setSuccessFalta(''), 4000);
  };

  // Marcar reposição
  const vagasFuturas = useMemo(() => {
    const seen = new Set();
    return state.vagas
      .filter(v => v.data >= td)
      .sort((a,b) => {
        const dc = a.data.localeCompare(b.data);
        if (dc !== 0) return dc;
        const horaA = parseInt((state.turmas.find(t => t.id === a.turmaId)?.horario || '0h').replace('h',''), 10);
        const horaB = parseInt((state.turmas.find(t => t.id === b.turmaId)?.horario || '0h').replace('h',''), 10);
        return horaA - horaB;
      })
      .filter(v => {
        const key = v.data + '|' + v.turmaId;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }, [state.vagas, td]);
  const [vagaSel, setVagaSel] = useState('');
  const [successRepo, setSuccessRepo] = useState('');
  const vagaObj = vagasFuturas.find(v => v.id === vagaSel);
  const dataRepo = vagaObj?.data || '';
  const turmaRepoId = vagaObj?.turmaId || '';
  const jaTemReposicao = !!(vagaSel && state.reposicoes.some(r =>
    r.alunoNome === alunoNome && r.dataReposicao === dataRepo &&
    r.turmaReposicaoId === turmaRepoId && !r.realizada));
  const pendingNormal = useMemo(() =>
    state.faltas.filter(f => f.alunoNome === alunoNome && f.turmaId === turmaId && f.status === 'pendente' && !f.semAntecedencia)
      .sort((a,b) => a.datas[0].localeCompare(b.datas[0])),
    [state.faltas, alunoNome, turmaId]);
  const pendingSemAnt = useMemo(() =>
    state.faltas.filter(f => f.alunoNome === alunoNome && f.turmaId === turmaId && f.status === 'pendente' && f.semAntecedencia)
      .sort((a,b) => a.datas[0].localeCompare(b.datas[0])),
    [state.faltas, alunoNome, turmaId]);
  const hasPending = pendingNormal.length > 0;
  const handleMarcarRepo = () => {
    if (!vagaSel || jaTemReposicao) return;
    alunoDispatch({ type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId: turmaId, dataReposicao: dataRepo, turmaReposicaoId: turmaRepoId, tipo: hasPending ? 'reposicao' : 'aula_extra', semVagaOficial: false, vagaSelId: vagaObj?.id || null });
    setVagaSel('');
    setSuccessRepo('Reposição marcada com sucesso!');
    setOpen(o => ({ ...o, reposicao: false }));
    setTimeout(() => setSuccessRepo(''), 4000);
  };

  // Cancelar reposição
  const [confirmCancel, setConfirmCancel] = useState(null);
  // Cancelar falta (aluno)
  const [confirmCancelFalta, setConfirmCancelFalta] = useState(null); // falta object
  const [cancelFaltaMsg, setCancelFaltaMsg] = useState(null); // { faltaId, message }
  // Confirmar aula extra
  const [confirmAulaExtra, setConfirmAulaExtra] = useState(null); // vaga selecionada
  const [confirmEscolhaFalta, setConfirmEscolhaFalta] = useState(null); // {vaga, opcoes:[falta]}
  const minhasRepos = useMemo(() =>
    state.reposicoes.filter(r => r.alunoNome === alunoNome && r.turmaOrigemId === turmaId && !r.realizada)
      .sort((a,b) => a.dataReposicao.localeCompare(b.dataReposicao)),
    [state.reposicoes, alunoNome]);

  const isLessThan24h = (repo) => {
    const tRepo = state.turmas.find(t => t.id === repo.turmaReposicaoId);
    const horaAula = parseInt((tRepo?.horario || '09h').replace('h',''), 10);
    const aula = new Date(repo.dataReposicao + 'T00:00:00');
    aula.setHours(horaAula, 0, 0, 0);
    return (aula - Date.now()) < 24 * 3600 * 1000;
  };

  const handleCancelarRepo = (repo) => {
    if (isLessThan24h(repo)) {
      setConfirmCancel({ repo, semCredito: true });
    } else {
      setConfirmCancel({ repo, semCredito: false });
    }
  };

  const confirmarCancelamento = () => {
    if (!confirmCancel) return;
    if (confirmCancel.semCredito) {
      // Remove reposição mas não reverte falta
      alunoDispatch({ type: 'CANCEL_REPOSICAO_SEM_CREDITO', id: confirmCancel.repo.id });
    } else {
      alunoDispatch({ type: 'CANCEL_REPOSICAO', id: confirmCancel.repo.id });
    }
    setConfirmCancel(null);
  };

  // Alertas — só faltas expirando em ≤7 dias e reposições próximas
  const in7 = (() => { const d = new Date(); d.setDate(d.getDate()+7); return dateToStr(d); })();
  const alertas = [];
  state.faltas.filter(f => f.alunoNome === alunoNome && f.turmaId === turmaId && f.status === 'pendente').forEach(f => {
    const exp = getFaltaExpiry(f);
    if (exp >= td && exp <= in7) alertas.push({ level:'red', text:`Falta de ${fmtBR(f.datas[0])} expira em ${fmtBRFull(exp)} — marque uma reposição!` });
  });
  minhasRepos.filter(r => { const d = new Date(r.dataReposicao + 'T00:00:00'); return (d - Date.now()) <= 7*24*3600*1000; }).forEach(r => {
    const tRepo = state.turmas.find(t => t.id === r.turmaReposicaoId);
    alertas.push({ level:'blue', text:`Reposição em ${fmtBRFull(r.dataReposicao)} às ${tRepo?.horario || '?'}` });
  });

  const alertColors = { red:'bg-red-50 border-red-200 text-red-700', blue:'bg-blue-50 border-blue-200 text-blue-700' };
  const alertIcons  = { red:'⚠️', blue:'📅' };

  // Minhas faltas — todas as pendentes e marcadas, ordenadas por data
  const minhasFaltas = state.faltas
    .filter(f => f.alunoNome === alunoNome && f.turmaId === turmaId && (f.status === 'pendente' || f.status === 'marcada'))
    .sort((a, b) => a.datas[0].localeCompare(b.datas[0]));

  // Vagas da semana
  const in6 = (() => { const d = new Date(); d.setDate(d.getDate()+6); return dateToStr(d); })();
  const vagasSemana = vagasFuturas.filter(v => v.data <= in6);

  return (
    <div className="min-h-screen bg-amber-50">
      {/* Header */}
      <div className="bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-40">
        <div>
          <div className="text-xs text-gray-400">Escola Passarinho</div>
          <div className="font-bold text-gray-900 text-lg leading-tight">Olá, {alunoNome} 👋</div>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={() => setShowRegras(true)} className="text-xs text-amber-700 border border-amber-300 bg-amber-50 px-2.5 py-1 rounded-lg font-medium hover:bg-amber-100 transition-colors">Regras</button>
          <div className="text-right">
            <div className="text-xs text-gray-400">Sua turma</div>
            <div className="text-sm font-semibold text-gray-700">{turma ? `${EXTENSO[turma.diaSemana]} ${turma.horario}` : '?'}</div>
          </div>
        </div>
      </div>

      {/* Modal Regras */}
      {showRegras && (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center" onClick={() => setShowRegras(false)}>
          <div className="bg-white rounded-t-2xl w-full max-w-md p-6 pb-8 shadow-xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-base font-bold text-gray-900">Como funciona</h2>
              <button onClick={() => setShowRegras(false)} className="text-gray-400 hover:text-gray-600 text-xl leading-none">✕</button>
            </div>
            <div className="space-y-4 overflow-y-auto max-h-[70vh] pr-1">
              {[
                {
                  titulo: 'Avisar falta',
                  itens: [
                    { icon: '✅', text: 'Com mais de 22h de antecedência: falta comum — você pode repor em qualquer turma com vaga.' },
                    { icon: '⏱️', text: 'Entre 2h e 22h antes da aula: falta sem antecedência — você tem direito a reposição, mas só pode marcá-la quando a aula de reposição estiver a menos de 2h de começar.' },
                    { icon: '⛔', text: 'Com menos de 2h (ou após a aula): não é possível registrar falta. A data aparece bloqueada na tela.' },
                    { icon: '🎌', text: 'Feriados não geram falta nem vaga de reposição.' },
                  ]
                },
                {
                  titulo: 'Cancelar falta',
                  itens: [
                    { icon: '✕', text: 'Você pode cancelar uma falta enquanto o horário da aula não chegou — desde que não haja reposição marcada para ela.' },
                    { icon: '🔒', text: 'Não é possível cancelar se a vaga já foi ocupada por outra pessoa e não há substituta disponível.' },
                  ]
                },
                {
                  titulo: 'Marcar reposição',
                  itens: [
                    { icon: '📅', text: 'Você tem 30 dias para repor a partir da data da falta. Após isso, o crédito expira.' },
                    { icon: '🔄', text: 'A reposição pode ser em qualquer turma — escolha entre as vagas disponíveis.' },
                    { icon: '🪑', text: 'Vagas extras abrem às 10h do dia anterior quando uma turma tem espaço sobrando.' },
                  ]
                },
                {
                  titulo: 'Cancelar reposição',
                  itens: [
                    { icon: '↩️', text: 'Cancelou com mais de 24h de antecedência: a falta volta ao crédito e você pode remarcar.' },
                    { icon: '⚠️', text: 'Cancelou com menos de 24h: o crédito não volta — a falta é consumida mesmo assim.' },
                  ]
                },
                {
                  titulo: 'Férias',
                  itens: [
                    { icon: '🌴', text: 'Férias precisam ser registradas pela professora com antecedência.' },
                    { icon: '🎫', text: 'Cada aula dentro do período de férias gera um crédito de reposição, válido por 30 dias após o último dia do mês de férias.' },
                    { icon: '🔄', text: 'Use o crédito de férias para marcar uma reposição em qualquer turma com vaga disponível.' },
                  ]
                },
              ].map((sec, si) => (
                <div key={si}>
                  <div className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1.5">{sec.titulo}</div>
                  <ul className="space-y-2">
                    {sec.itens.map((r, i) => (
                      <li key={i} className="flex items-start gap-2.5">
                        <span className="text-sm mt-0.5 shrink-0">{r.icon}</span>
                        <span className="text-sm text-gray-700 leading-snug">{r.text}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      <div className="max-w-md mx-auto p-4 space-y-4">

        {/* Alertas */}
        {alertas.length > 0 && (
          <div className="space-y-2">
            {alertas.map((a, i) => (
              <div key={i} className={`border rounded-xl px-4 py-3 flex items-start gap-3 ${alertColors[a.level]}`}>
                <div className="text-lg mt-0.5">{alertIcons[a.level]}</div>
                <div className="text-sm font-medium">{a.text}</div>
              </div>
            ))}
          </div>
        )}

        {/* Minhas faltas */}
        {minhasFaltas.length > 0 && (
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
              <div className="font-semibold text-gray-800 text-sm">Minhas faltas</div>
              <div className="text-xs text-gray-400">{minhasFaltas.length} falta{minhasFaltas.length > 1 ? 's' : ''}</div>
            </div>
            <div className="divide-y divide-gray-50">
              {minhasFaltas.map(f => {
                const exp = getFaltaExpiry(f);
                const expirando = exp >= td && exp <= in7;
                const repoVinc = f.status === 'marcada' && f.reposicaoId
                  ? state.reposicoes.find(r => r.id === f.reposicaoId)
                  : null;
                const tRepo = repoVinc ? state.turmas.find(t => t.id === repoVinc.turmaReposicaoId) : null;
                const cancelInfo = getCancelFaltaStatus(f, state);
                const showMsg = cancelFaltaMsg?.faltaId === f.id;
                return (
                  <div key={f.id} className="px-4 py-3">
                    <div className="flex items-center justify-between gap-2">
                      <div className="font-medium text-gray-800 text-sm">{fmtBRFull(f.datas[0])}</div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        {f.status === 'marcada'
                          ? <span className="text-xs font-medium text-blue-600 bg-blue-50 border border-blue-200 rounded-full px-2 py-0.5">Marcada</span>
                          : <span className="text-xs font-medium text-amber-600 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5">Pendente</span>
                        }
                        <button
                          onClick={() => {
                            if (cancelInfo.canCancel) {
                              setCancelFaltaMsg(null);
                              setConfirmCancelFalta(f);
                            } else {
                              setCancelFaltaMsg(showMsg ? null : { faltaId: f.id, message: cancelInfo.reason });
                            }
                          }}
                          className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold transition-colors ${
                            cancelInfo.canCancel
                              ? 'text-red-400 hover:text-white hover:bg-red-500 border border-red-200 hover:border-red-500'
                              : 'text-gray-300 border border-gray-200 cursor-default'
                          }`}
                          title={cancelInfo.canCancel ? 'Cancelar falta' : cancelInfo.reason}
                        >✕</button>
                      </div>
                    </div>
                    {f.status === 'marcada' && repoVinc
                      ? <div className="text-xs text-gray-500 mt-0.5">Reposição: {fmtBRFull(repoVinc.dataReposicao)}{tRepo ? ` (${ABREV[tRepo.diaSemana]} ${tRepo.horario})` : ''}</div>
                      : <div className={`text-xs mt-0.5 ${expirando ? 'text-red-500 font-medium' : 'text-gray-400'}`}>
                          {expirando ? '⚠️ ' : ''}Expira em {fmtBRFull(exp)}
                        </div>
                    }
                    {showMsg && (
                      <div className="mt-1.5 text-xs text-red-500 bg-red-50 border border-red-100 rounded-lg px-2.5 py-1.5 leading-snug">
                        {cancelInfo.reason}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Vagas da semana */}
        {vagasSemana.length > 0 && (
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:bg-gray-50 transition-colors"
            onClick={() => {
              setOpen(o => ({ ...o, reposicao: true }));
              setTimeout(() => document.getElementById('card-reposicao')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
            }}>
            <div className="px-3 py-2.5 border-b border-gray-100 flex items-center justify-between">
              <div className="font-semibold text-gray-700 text-xs uppercase tracking-wide">Vagas esta semana</div>
              <div className="text-xs text-gray-400">{vagasSemana.length} vaga{vagasSemana.length > 1 ? 's' : ''} →</div>
            </div>
            <div className="px-3 py-2 flex flex-wrap gap-2">
              {vagasSemana.map(v => {
                const tV = state.turmas.find(t => t.id === v.turmaId);
                return (
                  <span key={v.id} className="text-xs font-medium text-gray-600 bg-gray-100 rounded-lg px-2.5 py-1">
                    {tV ? `${ABREV[tV.diaSemana]} ${tV.horario}` : '?'}
                  </span>
                );
              })}
            </div>
          </div>
        )}

        {/* Crédito de férias disponível */}
        {ausenciaCredito && (
          <div className="bg-teal-50 border border-teal-200 rounded-xl px-4 py-3 flex items-start gap-3">
            <div className="text-xl shrink-0">🏖️</div>
            <div className="min-w-0">
              <div className="font-semibold text-teal-800 text-sm">Você tem 1 crédito de reposição de férias</div>
              <div className="text-xs text-teal-700 mt-0.5">
                Férias de {getMesNome(ausenciaCredito.mesAno)} — expira em {fmtBRFull(getAusenciaExpiry(ausenciaCredito))}
              </div>
              <div className="text-xs text-teal-600 mt-1">Abra "Marcar reposição" abaixo para usá-lo.</div>
            </div>
          </div>
        )}

        {/* Registrar falta */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <button onClick={() => toggle('falta')} className="w-full px-4 py-3 flex items-center justify-between text-left">
            <div className="flex items-center gap-3">
              <div className="text-xl">🙋</div>
              <div>
                <div className="font-semibold text-gray-800 text-sm">Registrar falta</div>
                <div className="text-xs text-gray-500">Avise com pelo menos 22h de antecedência</div>
              </div>
            </div>
            <div className="text-gray-400 text-sm">{open.falta ? '‹' : '›'}</div>
          </button>
          {open.falta && (
            <div className="border-t border-gray-100 px-4 py-3 space-y-3">
              {proximasDatas.length === 0 ? (
                <p className="text-sm text-gray-400 italic">Nenhuma aula disponível para registrar falta.</p>
              ) : (
                <>
                  <label className="block text-xs font-medium text-gray-600">Quais aulas você vai faltar?</label>
                  <div className="grid grid-cols-2 gap-1.5">
                    {proximasDatas.map(d => {
                      const feriadoNome = getFeriadoNome(d);
                      const jaFalta = !feriadoNome && state.faltas.some(f => f.alunoNome === alunoNome && f.turmaId === turmaId && f.datas.includes(d));
                      if (jaFalta) return null;
                      const dateStatus = feriadoNome ? 'feriado' : getFaltaDateStatus(d);
                      const sel = selectedDates.includes(d);
                      if (dateStatus === 'feriado') return (
                        <label key={d} className="flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-100 bg-gray-50 cursor-not-allowed opacity-60">
                          <input type="checkbox" checked={false} disabled className="accent-amber-500 w-4 h-4 shrink-0" />
                          <span className="text-sm text-gray-500">{fmtBR(d).slice(0,5)} <span className="text-xs text-purple-500">🎌 {feriadoNome}</span></span>
                        </label>
                      );
                      if (dateStatus === 'encerrado') return (
                        <label key={d} className="flex items-center gap-2 px-3 py-2 rounded-lg border border-gray-100 bg-gray-50 cursor-not-allowed opacity-50">
                          <input type="checkbox" checked={false} disabled className="w-4 h-4 shrink-0" />
                          <span className="text-sm text-gray-400">{fmtBR(d).slice(0,5)} <span className="text-xs">⛔</span></span>
                        </label>
                      );
                      if (dateStatus === 'semAnt') return (
                        <label key={d} className={`flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer transition-colors ${sel ? 'border-orange-400 bg-orange-50' : 'border-orange-200 bg-orange-50/40 hover:bg-orange-50'}`}>
                          <input type="checkbox" checked={sel} onChange={() => toggleDate(d)} className="accent-orange-500 w-4 h-4 shrink-0" />
                          <span className="text-sm text-gray-800">{fmtBR(d).slice(0,5)} <span className="text-xs text-orange-500">⏱️</span></span>
                        </label>
                      );
                      return (
                        <label key={d} className={`flex items-center gap-2 px-3 py-2 rounded-lg border cursor-pointer transition-colors ${sel ? 'border-amber-400 bg-amber-50' : 'border-gray-200 hover:bg-gray-50'}`}>
                          <input type="checkbox" checked={sel} onChange={() => toggleDate(d)} className="accent-amber-500 w-4 h-4 shrink-0" />
                          <span className="text-sm text-gray-800">{fmtBR(d).slice(0,5)}</span>
                        </label>
                      );
                    })}
                  </div>
                  <div className="text-xs text-gray-400">⏱️ laranja = só sem antecedência &nbsp;·&nbsp; ⛔ = prazo encerrado</div>
                  <button onClick={handleRegistrarFalta} disabled={!selectedDates.length}
                    className="w-full py-2 bg-amber-500 text-white rounded-lg text-sm font-semibold disabled:opacity-40">

                  </button>
                </>
              )}
            </div>
          )}
          {successFalta && <div className="px-4 pb-3"><div className="bg-green-50 text-green-700 rounded-lg px-3 py-2 text-sm font-medium">{successFalta}</div></div>}
        </div>

        {/* Marcar reposição / aula extra */}
        {(() => {
          const someWithin2h = vagasFuturas.some(v => {
            const dt = getClassDatetime(v.turmaId, v.data, state.turmas);
            if (!dt) return false;
            const h = (dt - Date.now()) / 3600000;
            return h >= 0 && h <= 2;
          });
          const cardTitle = (hasPending || (pendingSemAnt.length > 0 && someWithin2h) || !!ausenciaCredito)
            ? 'Marcar reposição' : 'Marcar aula extra';
          const cardIcon = cardTitle === 'Marcar reposição' ? '✅' : '➕';
          return (
            <div id="card-reposicao" className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
              <button onClick={() => toggle('reposicao')} className="w-full px-4 py-3 flex items-center justify-between text-left">
                <div className="flex items-center gap-3">
                  <div className="text-xl">{cardIcon}</div>
                  <div>
                    <div className="font-semibold text-gray-800 text-sm">{cardTitle}</div>
                    <div className="text-xs text-gray-500">
                      {ausenciaCredito && !hasPending ? 'Usando crédito de férias' : 'Escolha uma vaga disponível'}
                    </div>
                  </div>
                </div>
                <div className="text-gray-400 text-sm">{open.reposicao ? '‹' : '›'}</div>
              </button>
              {open.reposicao && (
                <div className="border-t border-gray-100">
                  {ausenciaCredito && !hasPending && (
                    <div className="px-4 py-2 bg-teal-50 border-b border-teal-100 text-xs text-teal-700 font-medium">
                      🎫 Crédito de férias disponível — escolha qualquer vaga abaixo para sua reposição
                    </div>
                  )}
                  {vagasFuturas.length === 0 ? (
                    <p className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma vaga disponível no momento.</p>
                  ) : (
                    <div className="divide-y divide-gray-50">
                      {vagasFuturas.map(v => {
                        const tV = state.turmas.find(t => t.id === v.turmaId);
                        const jaOcupada = state.reposicoes.some(r =>
                          r.alunoNome === alunoNome && r.dataReposicao === v.data &&
                          r.turmaReposicaoId === v.turmaId && !r.realizada);
                        const dt = getClassDatetime(v.turmaId, v.data, state.turmas);
                        const horasAte = dt ? (dt - Date.now()) / 3600000 : null;
                        const within2h = horasAte !== null && horasAte >= 0 && horasAte <= 2;
                        const allPending = [...pendingNormal, ...pendingSemAnt].sort((a,b) => a.datas[0].localeCompare(b.datas[0]));
                        const eligibleFaltas = within2h ? allPending : pendingNormal;
                        const canRepor = eligibleFaltas.length > 0;
                        const canUseFerias = !canRepor && !!ausenciaCredito;
                        const needsChoice = within2h && pendingNormal.length > 0 && pendingSemAnt.length > 0
                          && pendingNormal[0].datas[0] < pendingSemAnt[0].datas[0];
                        const isMyFeriasVaga = v.ausenciaId && ausenciasAtivas.some(a => a.id === v.ausenciaId);
                        const handleClick = () => {
                          if (jaOcupada) return;
                          if (canRepor) {
                            if (needsChoice) {
                              setConfirmEscolhaFalta({ vaga: v, opcoes: [pendingNormal[0], pendingSemAnt[0]] });
                              return;
                            }
                            const faltaId = eligibleFaltas[0].id;
                            alunoDispatch({ type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId: turmaId, dataReposicao: v.data, turmaReposicaoId: v.turmaId, tipo: 'reposicao', semVagaOficial: false, vagaSelId: v.id, faltaId });
                            setSuccessRepo('Reposição marcada com sucesso!');
                            setOpen(o => ({ ...o, reposicao: false }));
                            setTimeout(() => setSuccessRepo(''), 4000);
                          } else if (canUseFerias) {
                            setConfirmFeriasRepo(v);
                          } else {
                            setConfirmAulaExtra(v);
                          }
                        };
                        return (
                          <div key={v.id} className={`px-4 py-3 flex items-center justify-between gap-3 ${isMyFeriasVaga && canUseFerias ? 'bg-teal-50/50' : ''}`}>
                            <div>
                              <div className="font-medium text-gray-800 text-sm">{fmtBR(v.data).slice(0,5)}</div>
                              <div className="text-xs text-gray-500">
                                {tV ? `${ABREV[tV.diaSemana]} ${tV.horario}` : '?'}
                                {isMyFeriasVaga && <span className="ml-1 text-teal-600">· vaga das suas férias</span>}
                              </div>
                              {jaOcupada && <div className="text-xs text-red-500 mt-0.5">Você já tem reposição nesse horário</div>}
                              {!jaOcupada && !canRepor && !canUseFerias && pendingSemAnt.length > 0 && !within2h && (
                                <div className="text-xs text-orange-500 mt-0.5">Disponível para reposição em menos de 2h</div>
                              )}
                            </div>
                            <button onClick={handleClick} disabled={jaOcupada}
                              className={`text-xs font-semibold px-3 py-1.5 rounded-lg disabled:opacity-40 shrink-0 border ${
                                canRepor ? 'text-blue-600 border-blue-300 bg-blue-50'
                                : canUseFerias ? 'text-teal-700 border-teal-300 bg-teal-50'
                                : 'text-green-700 border-green-300 bg-green-50'
                              }`}>
                              {canRepor ? 'Repor' : canUseFerias ? 'Repor (férias)' : 'Aula extra'}
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              )}
              {successRepo && <div className="px-4 pb-3"><div className="bg-green-50 text-green-700 rounded-lg px-3 py-2 text-sm font-medium">{successRepo}</div></div>}
            </div>
          );
        })()}

        {/* Confirm usar crédito de férias */}
        {confirmFeriasRepo && (() => {
          const tV = state.turmas.find(t => t.id === confirmFeriasRepo.turmaId);
          return (
            <ConfirmModal
              title="Usar crédito de férias?"
              message={`Usar seu crédito de reposição de férias (${getMesNome(ausenciaCredito?.mesAno || '')}) para repor em ${fmtBRFull(confirmFeriasRepo.data)}${tV ? ` (${ABREV[tV.diaSemana]} ${tV.horario})` : ''}?`}
              confirmLabel="Confirmar reposição"
              onConfirm={() => {
                alunoDispatch({ type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId: turmaId, dataReposicao: confirmFeriasRepo.data, turmaReposicaoId: confirmFeriasRepo.turmaId, semVagaOficial: false, vagaSelId: confirmFeriasRepo.id, ausenciaId: ausenciaCredito?.id });
                setSuccessRepo('Reposição marcada com crédito de férias!');
                setOpen(o => ({ ...o, reposicao: false }));
                setConfirmFeriasRepo(null);
                setTimeout(() => setSuccessRepo(''), 4000);
              }}
              onCancel={() => setConfirmFeriasRepo(null)}
            />
          );
        })()}

        {/* Confirm aula extra modal */}
        {confirmAulaExtra && (() => {
          const tV = state.turmas.find(t => t.id === confirmAulaExtra.turmaId);
          return (
            <ConfirmModal
              title="Confirmar aula extra?"
              message={`Você não tem faltas pendentes, então essa será uma aula extra em ${fmtBRFull(confirmAulaExtra.data)}${tV ? ` (${ABREV[tV.diaSemana]} ${tV.horario})` : ''}. Aulas extras podem ter custo adicional — confirme com o ateliê.`}
              confirmLabel="Confirmar aula extra"
              onConfirm={() => {
                alunoDispatch({ type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId: turmaId, dataReposicao: confirmAulaExtra.data, turmaReposicaoId: confirmAulaExtra.turmaId, tipo: 'aula_extra', semVagaOficial: false, vagaSelId: confirmAulaExtra.id });
                setSuccessRepo('Aula extra marcada com sucesso!');
                setOpen(o => ({ ...o, reposicao: false }));
                setConfirmAulaExtra(null);
                setTimeout(() => setSuccessRepo(''), 4000);
              }}
              onCancel={() => setConfirmAulaExtra(null)}
            />
          );
        })()}

        {/* Confirm escolha de falta (normal vs semAntecedencia) */}
        {confirmEscolhaFalta && (() => {
          const { vaga, opcoes } = confirmEscolhaFalta;
          return (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full space-y-4">
                <div className="font-bold text-gray-900">Qual falta deseja repor?</div>
                <div className="text-sm text-gray-500">Você tem uma falta comum e uma sem antecedência. Escolha qual usar para esta reposição.</div>
                {opcoes.map(f => (
                  <button key={f.id} onClick={() => {
                    alunoDispatch({ type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId: turmaId, dataReposicao: vaga.data, turmaReposicaoId: vaga.turmaId, tipo: 'reposicao', semVagaOficial: false, vagaSelId: vaga.id, faltaId: f.id });
                    setSuccessRepo('Reposição marcada com sucesso!');
                    setOpen(o => ({ ...o, reposicao: false }));
                    setConfirmEscolhaFalta(null);
                    setTimeout(() => setSuccessRepo(''), 4000);
                  }} className="w-full text-left px-4 py-3 rounded-xl border border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-colors">
                    <div className="font-semibold text-gray-800 text-sm">Falta de {fmtBRFull(f.datas[0])}</div>
                    <div className="text-xs text-gray-500 mt-0.5">{f.semAntecedencia ? '⏱️ Sem antecedência' : '✓ Falta comum'}</div>
                  </button>
                ))}
                <button onClick={() => setConfirmEscolhaFalta(null)} className="w-full py-2 text-sm text-gray-500 hover:text-gray-700">Cancelar</button>
              </div>
            </div>
          );
        })()}

        {/* Minhas reposições */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <button onClick={() => toggle('minhas')} className="w-full px-4 py-3 flex items-center justify-between text-left">
            <div className="flex items-center gap-3">
              <div className="text-xl">🗓️</div>
              <div>
                <div className="font-semibold text-gray-800 text-sm">Minhas reposições</div>
                <div className="text-xs text-gray-500">{minhasRepos.length} agendada{minhasRepos.length !== 1 ? 's' : ''}</div>
              </div>
            </div>
            <div className="text-gray-400 text-sm">{open.minhas ? '‹' : '›'}</div>
          </button>
          {open.minhas && (
            <div className="border-t border-gray-100">
              {minhasRepos.length === 0 ? (
                <p className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma reposição agendada.</p>
              ) : (
                <div className="divide-y divide-gray-50">
                  {minhasRepos.map(r => {
                    const tRepo = state.turmas.find(t => t.id === r.turmaReposicaoId);
                    const faltaVinc = r.faltaId ? state.faltas.find(f => f.id === r.faltaId) : null;
                    const ausVinc = r.ausenciaId ? state.ausencias.find(a => a.id === r.ausenciaId) : null;
                    const menos24h = isLessThan24h(r);
                    const isFerias = r.tipo === 'reposicao_ferias';
                    return (
                      <div key={r.id} className="px-4 py-3 flex items-center justify-between gap-3">
                        <div>
                          <div className="font-medium text-gray-800 text-sm">{EXTENSO[getDiaSemanaFromDateStr(r.dataReposicao)]}, {fmtBRFull(r.dataReposicao)}</div>
                          <div className="text-xs text-gray-500">
                            {tRepo ? `${ABREV[tRepo.diaSemana]} ${tRepo.horario}` : '?'}
                            {faltaVinc ? ` · Repõe falta de ${fmtBR(faltaVinc.datas[0])}` : ''}
                            {isFerias && ausVinc ? ` · 🏖️ Férias de ${getMesNome(ausVinc.mesAno)}` : ''}
                          </div>
                          {menos24h && <div className="text-xs text-orange-500 mt-0.5">⚠️ Menos de 24h — {isFerias ? 'crédito de férias não volta' : 'falta não volta ao crédito'} se cancelar</div>}
                        </div>
                        <button onClick={() => handleCancelarRepo(r)}
                          className="text-xs text-red-500 border border-red-200 px-2.5 py-1 rounded-lg font-medium shrink-0">
                          Cancelar
                        </button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Confirm cancel falta modal */}
        {confirmCancelFalta && (
          <ConfirmModal
            title="Cancelar falta?" danger
            message={`Cancelar a falta de ${fmtBRFull(confirmCancelFalta.datas[0])}? A vaga voltará a ficar disponível.`}
            onConfirm={() => {
              alunoDispatch({ type: 'CANCEL_FALTA', id: confirmCancelFalta.id });
              setConfirmCancelFalta(null);
            }}
            onCancel={() => setConfirmCancelFalta(null)}
            confirmLabel="Cancelar falta"
          />
        )}

        {/* Confirm cancel modal */}
        {confirmCancel && (
          <ConfirmModal
            title="Cancelar reposição?" danger
            message={confirmCancel.semCredito
              ? `A reposição está a menos de 24h. Você pode cancelar, mas o crédito não será devolvido. Deseja cancelar mesmo assim?`
              : confirmCancel.repo.tipo === 'reposicao_ferias'
                ? `Cancelar a reposição de ${fmtBRFull(confirmCancel.repo.dataReposicao)}? Seu crédito de férias voltará a ficar disponível.`
                : `Cancelar a reposição de ${fmtBRFull(confirmCancel.repo.dataReposicao)}? A falta voltará para pendente.`}
            onConfirm={confirmarCancelamento}
            onCancel={() => setConfirmCancel(null)}
            confirmLabel="Cancelar reposição"
          />
        )}

        {/* Registrar / ver férias */}
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
          <button onClick={() => toggle('ferias')} className="w-full px-4 py-3 flex items-center justify-between text-left">
            <div className="flex items-center gap-3">
              <div className="text-xl">🏖️</div>
              <div>
                <div className="font-semibold text-gray-800 text-sm">Férias</div>
                <div className="text-xs text-gray-500">
                  {ausenciasAtivas.length > 0
                    ? `${ausenciasAtivas.length} período registrado${ausenciasAtivas.length > 1 ? 's' : ''}`
                    : 'Registre ausência programada'}
                </div>
              </div>
            </div>
            <div className="text-gray-400 text-sm">{open.ferias ? '‹' : '›'}</div>
          </button>
          {open.ferias && (
            <div className="border-t border-gray-100 px-4 py-3 space-y-3">
              {/* Existing ausencias */}
              {ausenciasAtivas.length > 0 && (
                <div className="space-y-2">
                  {ausenciasAtivas.map(a => {
                    const exp = getAusenciaExpiry(a);
                    const expired = exp < td;
                    const expiring = !expired && exp <= in7;
                    const semCredito = a.creditoReposicao === 0;
                    const mesNum = parseInt(a.mesAno.split('-')[1]);
                    const isMesEscolar = mesNum === 12 || mesNum === 1;
                    return (
                      <div key={a.id} className={`rounded-lg px-3 py-2 text-sm ${semCredito ? 'bg-gray-50 border border-gray-200' : expired ? 'bg-red-50 border border-red-200' : expiring ? 'bg-amber-50 border border-amber-200' : 'bg-teal-50 border border-teal-200'}`}>
                        <div className="font-semibold text-gray-800">Férias de {getMesNome(a.mesAno)}</div>
                        <div className="flex items-center justify-between mt-0.5">
                          <span className={`text-xs font-medium ${semCredito ? 'text-gray-400' : a.creditoUsado ? 'text-gray-400' : expired ? 'text-red-600' : 'text-teal-700'}`}>
                            {semCredito
                              ? '— Sem crédito (mês de recesso do ateliê)'
                              : a.creditoUsado ? '✓ Crédito de reposição usado'
                              : expired ? '⚠️ Crédito expirado'
                              : `🎫 1 reposição disponível — expira ${fmtBR(exp)}`}
                          </span>
                        </div>
                        {(() => {
                          const turmaAus = state.turmas.find(t => t.id === a.turmaId);
                          const [ayy, amo] = a.mesAno.split('-').map(Number);
                          const firstDay = a.mesAno + '-01';
                          const lastDay = dateToStr(new Date(ayy, amo, 0));
                          const expectedDates = turmaAus ? getClassDatesInRange(turmaAus, firstDay, lastDay) : [];
                          const todasDatas = expectedDates.map(date => {
                            const vagaAberta = state.vagas.find(v => v.ausenciaId === a.id && v.data === date);
                            if (vagaAberta) return { data: date, consumida: false, por: null };
                            const repoConsumiu = state.reposicoes.find(r => r.vagaConsumedAusenciaId === a.id && r.dataReposicao === date);
                            return { data: date, consumida: true, por: repoConsumiu?.alunoNome || null };
                          });
                          if (todasDatas.length === 0) return null;
                          return (
                            <div className="text-xs text-teal-600 mt-1">
                              Vagas liberadas:{' '}
                              {todasDatas.map((v, i) => (
                                <span key={i}>
                                  {i > 0 && ', '}
                                  {v.consumida
                                    ? <span className="text-gray-400 line-through" title={`Ocupada por ${v.por}`}>{fmtBR(v.data)}</span>
                                    : <span>{fmtBR(v.data)}</span>
                                  }
                                </span>
                              ))}
                            </div>
                          );
                        })()}
                      </div>
                    );
                  })}
                </div>
              )}
              {/* Register new férias */}
              {mesesDisponiveisFerias.length > 0 ? (
                <>
                  <label className="block text-xs font-medium text-gray-600 mt-2">Registrar período de férias</label>
                  <select value={mesFerias} onChange={e => setMesFerias(e.target.value)}
                    className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
                    <option value="">Escolha o mês de férias…</option>
                    {mesesDisponiveisFerias.map(m => {
                      const mo = parseInt(m.split('-')[1]);
                      const isMesEscolar = mo === 12 || mo === 1;
                      const [y, moN] = m.split('-').map(Number);
                      return <option key={m} value={m}>{MESES_PT[moN-1]} {y}{isMesEscolar ? ' (sem crédito)' : ''}</option>;
                    })}
                  </select>
                  {mesFerias && (() => {
                    const [y, mo] = mesFerias.split('-').map(Number);
                    const isMesEscolar = mo === 12 || mo === 1;
                    const firstDay = mesFerias + '-01';
                    const lastDay = dateToStr(new Date(y, mo, 0));
                    const classDates = turma ? getClassDatesInRange(turma, firstDay, lastDay) : [];
                    return classDates.length > 0 ? (
                      <div className="text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2">
                        Aulas afetadas ({classDates.length}): {classDates.map(d => fmtBR(d)).join(', ')}
                        <br /><span className={`font-medium ${isMesEscolar ? 'text-gray-400' : 'text-teal-600'}`}>
                          {isMesEscolar
                            ? 'Vagas serão liberadas, mas dezembro e janeiro não geram crédito de reposição.'
                            : 'Vagas serão liberadas para outros alunos. Você recebe 1 crédito de reposição.'}
                        </span>
                      </div>
                    ) : null;
                  })()}
                  <button onClick={handleRegistrarFerias} disabled={!mesFerias}
                    className="w-full py-2 bg-teal-500 text-white rounded-lg text-sm font-semibold disabled:opacity-40">
                    Confirmar férias
                  </button>
                </>
              ) : ausenciasAtivas.length > 0 ? (
                <p className="text-xs text-gray-400 italic">Você já registrou férias para este ano.</p>
              ) : null}
              {/* Discrete rules note */}
              <div className="pt-2 border-t border-gray-100 text-xs text-gray-400 space-y-0.5">
                <div>• Férias podem ser registradas uma vez por ano</div>
                <div>• Dezembro e janeiro são recesso do ateliê — não geram crédito de reposição</div>
              </div>
            </div>
          )}
          {successFerias && <div className="px-4 pb-3"><div className="bg-green-50 text-green-700 rounded-lg px-3 py-2 text-sm font-medium">{successFerias}</div></div>}
        </div>

        {/* Rodapé */}
        <div className="text-center text-xs text-gray-400 py-4">
          Qualquer coisa contate o ateliê 🎨
        </div>

      </div>
    </div>
  );
}

// ==================== PAINEL: REGISTRO ====================
function PainelRegistro({ state }) {
  const log = arr(state.log);

  if (log.length === 0) {
    return <p className="text-gray-400 text-sm text-center py-8">Nenhuma ação registrada ainda.</p>;
  }

  return (
    <div className="space-y-2">
      {log.map(entry => {
        const c = PROFESSOR_COLORS[entry.professor] || { bg:'bg-gray-100', text:'text-gray-600', dot:'bg-gray-400' };
        const dt = new Date(entry.ts);
        const dataHora = dt.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) +
                         ' ' + dt.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
        return (
          <div key={entry.id} className="flex items-start gap-3 py-2.5 border-b border-gray-100 last:border-0">
            <span className={`inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full whitespace-nowrap mt-0.5 ${c.bg} ${c.text}`}>
              <span className={`w-1.5 h-1.5 rounded-full ${c.dot}`}></span>
              {entry.professor}
            </span>
            <div className="flex-1 min-w-0">
              <p className="text-sm text-gray-800">{entry.descricao}</p>
              <p className="text-xs text-gray-400 mt-0.5">{dataHora}</p>
            </div>
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
