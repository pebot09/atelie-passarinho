function TabRegistrarReposicao({ state, dispatch }) {
  const [turmaOrigemId, setTurmaOrigemId] = useState('');
  const [alunoNome, setAlunoNome]         = useState('');
  const [vagaSel, setVagaSel]             = useState(''); // vagaId | 'livre'
  const [extraData, setExtraData]         = useState('');
  const [extraTurma, setExtraTurma]       = useState('');
  const [tipoManual, setTipoManual]       = useState('reposicao'); // quando !hasPending + isManual
  const [success, setSuccess]             = useState('');

  const td     = todayStr();
  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turmaOrigem = state.turmas.find(t => t.id === turmaOrigemId);

  // Vagas futuras ordenadas e sem duplicatas
  const vagasFuturas = useMemo(() => {
    const seen = new Set();
    return [...state.vagas]
      .filter(v => v.data >= td)
      .sort((a, b) => {
        if (a.data !== b.data) return a.data.localeCompare(b.data);
        const ha = state.turmas.find(t => t.id === a.turmaId)?.horario || '';
        const hb = state.turmas.find(t => t.id === b.turmaId)?.horario || '';
        return ha.localeCompare(hb);
      })
      .filter(v => {
        const key = `${v.data}|${v.turmaId}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }, [state.vagas, state.turmas, td]);

  const hasPending  = alunoNome ? state.faltas.some(f => f.alunoNome === alunoNome && f.status === 'pendente') : false;
  const isManual    = vagaSel === 'livre';
  const vagaObj     = !isManual && vagaSel ? state.vagas.find(v => v.id === vagaSel) : null;
  const dataRepo    = isManual ? extraData   : (vagaObj?.data || '');
  const turmaRepoId = isManual ? extraTurma  : (vagaObj?.turmaId || '');
  const turmaRepo   = state.turmas.find(t => t.id === turmaRepoId);

  // Tipo: com falta pendente → sempre reposicao
  //       sem falta + vaga oficial → reposicao sem falta vinculada
  //       sem falta + manual → tipoManual (escolha explícita)
  const tipo = hasPending ? 'reposicao' : (isManual ? tipoManual : 'reposicao');

  const faltaInfo = useMemo(() => {
    if (!alunoNome) return null;
    const pending = state.faltas
      .filter(f => f.alunoNome === alunoNome && f.status === 'pendente')
      .sort((a, b) => getFaltaEarliest(a).localeCompare(getFaltaEarliest(b)));
    if (!pending.length) return null;
    const oldest = pending[0];
    return { turmaId: oldest.turmaId, datas: oldest.datas, expiry: getFaltaExpiry(oldest) };
  }, [alunoNome, state.faltas]);

  const occupancy = useMemo(() => {
    if (!turmaRepoId || !dataRepo) return null;
    return calcOccupancy(turmaRepoId, dataRepo, state);
  }, [turmaRepoId, dataRepo, state]);

  const jaTemReposicao = !!(alunoNome && dataRepo && turmaRepoId &&
    state.reposicoes.some(r =>
      r.alunoNome === alunoNome && r.dataReposicao === dataRepo &&
      r.turmaReposicaoId === turmaRepoId && !r.realizada
    ));

  const canSubmit = turmaOrigemId && alunoNome && vagaSel && dataRepo && turmaRepoId && !jaTemReposicao;

  const handleSubmit = () => {
    if (!canSubmit) return;
    dispatch({ type: 'ADD_REPOSICAO', alunoNome, turmaOrigemId, dataReposicao: dataRepo, turmaReposicaoId: turmaRepoId, tipo, semVagaOficial: isManual, vagaSelId: vagaObj?.id || null });
    setSuccess(`${tipo === 'aula_extra' ? 'Aula extra' : 'Reposição'} de ${alunoNome} agendada para ${fmtBRFull(dataRepo)}.`);
    setAlunoNome(''); setVagaSel(''); setExtraData(''); setExtraTurma(''); setTipoManual('reposicao');
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Registrar Reposição</h3>

      {/* 1. Turma de origem */}
      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaOrigemId} onChange={e => { setTurmaOrigemId(e.target.value); setAlunoNome(''); setVagaSel(''); }}
          className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => (
            <option key={t.id} value={t.id}>{EXTENSO[t.diaSemana]} {t.horario}</option>
          ))}
        </select>
      </div>

      {/* 2. Aluno */}
      {turmaOrigem && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => { setAlunoNome(e.target.value); setVagaSel(''); setTipoManual('reposicao'); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {[...turmaOrigem.alunos].sort((a,b) => a.localeCompare(b,'pt')).map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          {turmaOrigem.alunos.length === 0 && (
            <p className="text-amber-600 text-sm mt-1">Esta turma não tem alunos cadastrados.</p>
          )}
        </div>
      )}

      {/* Info: falta mais antiga */}
      {alunoNome && faltaInfo && (
        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm">
          <div className="font-medium text-blue-800">Falta mais antiga a consumir:</div>
          <div className="text-blue-700 mt-0.5">
            {getTurmaLabel(state.turmas, faltaInfo.turmaId)} — <strong>{fmtDatesText(faltaInfo.datas)}</strong>
          </div>
          <div className="text-blue-600 mt-0.5">Expira em: {fmtBRFull(faltaInfo.expiry)}</div>
        </div>
      )}

      {/* 3. Vaga */}
      {alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Vaga</label>
          <select value={vagaSel} onChange={e => { setVagaSel(e.target.value); setExtraData(''); setExtraTurma(''); setTipoManual('reposicao'); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione a vaga —</option>
            {vagasFuturas.map(v => {
              const t = state.turmas.find(x => x.id === v.turmaId);
              const dia = getDiaSemanaFromDateStr(v.data);
              return (
                <option key={v.id} value={v.id}>
                  {fmtBRFull(v.data)} ({ABREV[dia]}) — {t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}{v.vagaExtra ? ' ✦ vaga extra' : ''}
                </option>
              );
            })}
            <option value="livre">✦ Escolher data / turma</option>
          </select>
          {vagasFuturas.length === 0 && !isManual && (
            <p className="text-gray-400 text-sm mt-1">Nenhuma vaga aberta no momento.</p>
          )}
        </div>
      )}

      {/* Campos para data/turma livre */}
      {isManual && (
        <div className="space-y-3 pl-3 border-l-2 border-blue-300">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Data</label>
            <input type="date" value={extraData} min={td} onChange={e => setExtraData(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2" />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
            <select value={extraTurma} onChange={e => setExtraTurma(e.target.value)}
              className="w-full border border-gray-300 rounded-lg px-3 py-2">
              <option value="">— Selecione a turma —</option>
              {sorted.map(t => (
                <option key={t.id} value={t.id}>{EXTENSO[t.diaSemana]} {t.horario}</option>
              ))}
            </select>
          </div>
          {/* Quando não tem falta pendente, pergunta o tipo */}
          {!hasPending && (
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Tipo</label>
              <div className="flex gap-3">
                <label className={`flex-1 flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${tipoManual === 'reposicao' ? 'border-blue-500 bg-blue-50' : 'border-gray-200'}`}>
                  <input type="radio" name="tipoManual" value="reposicao" checked={tipoManual === 'reposicao'} onChange={() => setTipoManual('reposicao')} />
                  <span className="text-sm font-medium">Reposição sem falta vinculada</span>
                </label>
                <label className={`flex-1 flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition-colors ${tipoManual === 'aula_extra' ? 'border-purple-500 bg-purple-50' : 'border-gray-200'}`}>
                  <input type="radio" name="tipoManual" value="aula_extra" checked={tipoManual === 'aula_extra'} onChange={() => setTipoManual('aula_extra')} />
                  <span className="text-sm font-medium">Aula extra</span>
                </label>
              </div>
            </div>
          )}
        </div>
      )}

      {/* Ocupação prevista */}
      {occupancy !== null && turmaRepo && (
        <div className={`rounded-lg px-3 py-2 text-sm font-medium border ${
          occupancy + 1 > turmaRepo.capacidade
            ? 'bg-red-50 text-red-700 border-red-200'
            : occupancy + 1 === turmaRepo.capacidade
              ? 'bg-amber-50 text-amber-700 border-amber-200'
              : 'bg-green-50 text-green-700 border-green-200'
        }`}>
          {getTurmaLabel(state.turmas, turmaRepoId)} em {fmtBRFull(dataRepo)}:{' '}
          {occupancy + 1}/{turmaRepo.capacidade} alunos esperados
          {occupancy + 1 > turmaRepo.capacidade && ' ⚠️ Acima da capacidade!'}
        </div>
      )}

      {jaTemReposicao && (
        <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700 font-medium">
          {alunoNome} já tem reposição marcada nesse horário ({getTurmaLabel(state.turmas, turmaRepoId)}, {fmtBRFull(dataRepo)}).
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!canSubmit}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Confirmar Reposição
      </button>
    </div>
  );
}

// ==================== TAB: CANCELAR REPOSIÇÃO ====================
function TabCancelarReposicao({ state, dispatch }) {
  const [selectedId, setSelectedId] = useState('');
  const [confirm, setConfirm] = useState(false);
  const [success, setSuccess] = useState('');
  const td = todayStr();

  const futuras = useMemo(() => state.reposicoes
    .filter(r => !r.realizada && r.dataReposicao >= td)
    .sort((a,b) => {
      if (a.dataReposicao !== b.dataReposicao) return a.dataReposicao.localeCompare(b.dataReposicao);
      const ta = state.turmas.find(t => t.id === a.turmaReposicaoId);
      const tb = state.turmas.find(t => t.id === b.turmaReposicaoId);
      return (ta?.horario || '').localeCompare(tb?.horario || '');
    }), [state.reposicoes, state.turmas, td]);
  const repo = futuras.find(r => r.id === selectedId);

  const handleCancel = () => {
    dispatch({ type: 'CANCEL_REPOSICAO', id: selectedId });
    setSuccess(`Reposição de ${repo.alunoNome} em ${fmtBRFull(repo.dataReposicao)} cancelada.`);
    setSelectedId(''); setConfirm(false);
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Cancelar Reposição</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Reposição agendada</label>
        <select value={selectedId} onChange={e => setSelectedId(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione —</option>
          {futuras.map(r => (
            <option key={r.id} value={r.id}>
              {r.alunoNome} — {fmtBRFull(r.dataReposicao)} ({getTurmaLabel(state.turmas, r.turmaReposicaoId)}) {r.tipo==='aula_extra' ? '· Aula extra' : ''}
            </option>
          ))}
        </select>
        {futuras.length === 0 && <p className="text-gray-400 text-sm mt-1">Nenhuma reposição futura agendada.</p>}
      </div>

      {repo && (
        <div className="bg-gray-50 rounded-lg p-3 text-sm space-y-1">
          <div><span className="font-medium">Aluno:</span> {repo.alunoNome}</div>
          <div><span className="font-medium">Data:</span> {fmtBRFull(repo.dataReposicao)}</div>
          <div><span className="font-medium">Turma:</span> {getTurmaLabel(state.turmas, repo.turmaReposicaoId)}</div>
          <div><span className="font-medium">Tipo:</span> {repo.tipo === 'reposicao' ? 'Reposição de falta' : 'Aula extra'}</div>
          {repo.tipo === 'reposicao' && <div className="text-blue-600">A falta vinculada voltará para pendente e a vaga será reaberta.</div>}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={() => setConfirm(true)}
        disabled={!selectedId}
        className="w-full py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Cancelar Reposição
      </button>

      {confirm && repo && (
        <ConfirmModal
          title="Cancelar reposição?" danger
          message={`Cancelar a reposição de ${repo.alunoNome} em ${fmtBRFull(repo.dataReposicao)}?`}
          onConfirm={handleCancel}
          onCancel={() => setConfirm(false)}
          confirmLabel="Cancelar reposição"
        />
      )}
    </div>
  );
}

// ==================== TAB: AUSÊNCIA PROGRAMADA ====================
function TabAusenciaProgramada({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [tipo, setTipo] = useState('ferias');
  const [mesAno, setMesAno] = useState('');
  const [success, setSuccess] = useState('');

  const sorted = useMemo(() => sortTurmas(state.turmas), [state.turmas]);
  const turma = state.turmas.find(t => t.id === turmaId);

  // Current month as default
  useEffect(() => {
    const d = new Date();
    setMesAno(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }, []);

  const handleSubmit = () => {
    if (!turmaId || !alunoNome || !mesAno) return;
    dispatch({ type: 'ADD_AUSENCIA', alunoNome, turmaId, tipo, mesAno });
    setSuccess(`Ausência de ${alunoNome} em ${getMesNome(mesAno)} registrada.`);
    setAlunoNome('');
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Ausência Programada (Férias)</h3>

      <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-700">
        Aluno em férias recebe <strong>1 crédito de reposição</strong> e libera vagas nas suas aulas do mês. O prazo expira 30 dias após o último dia do mês.
        <div className="mt-1 text-blue-600 text-xs">Dezembro e janeiro (recesso) não geram crédito, mas ainda liberam vagas.</div>
      </div>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); }} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione a turma —</option>
          {sorted.map(t => <option key={t.id} value={t.id}>{EXTENSO[t.diaSemana]} {t.horario}</option>)}
        </select>
      </div>

      {turma && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => setAlunoNome(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione o aluno —</option>
            {turma.alunos.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
        </div>
      )}

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de ausência</label>
        <select value={tipo} onChange={e => setTipo(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="ferias">Férias</option>
        </select>
      </div>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Mês de ausência</label>
        <input type="month" value={mesAno} onChange={e => setMesAno(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-2" />
      </div>

      {mesAno && (
        <div className="text-sm text-gray-500">
          Prazo para reposição: até {fmtBRFull((() => { const d = parseDate(getLastDayOfMonth(mesAno)); d.setDate(d.getDate()+30); return dateToStr(d); })())}
        </div>
      )}

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={handleSubmit}
        disabled={!turmaId || !alunoNome || !mesAno}
        className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        Registrar Ausência
      </button>

      {/* List current ausencias */}
      {state.ausencias.length > 0 && (
        <div className="mt-4 border-t border-gray-200 pt-4">
          <h4 className="text-sm font-semibold text-gray-600 mb-2">Ausências registradas</h4>
          <div className="space-y-2">
            {state.ausencias.map(a => {
              const turmaAus = state.turmas.find(t => t.id === a.turmaId);
              const [ayy, amo] = a.mesAno.split('-').map(Number);
              const firstDay = a.mesAno + '-01';
              const lastDay = dateToStr(new Date(ayy, amo, 0));
              const expectedDates = turmaAus ? getClassDatesInRange(turmaAus, firstDay, lastDay) : [];
              const todasDatas = expectedDates.map(date => {
                const vagaAberta = state.vagas.find(v => v.ausenciaId === a.id && v.data === date);
                if (vagaAberta) return { data: date, consumida: false, por: null };
                const repoConsumiu = state.reposicoes.find(r => r.vagaConsumedAusenciaId === a.id && r.dataReposicao === date);
                return { data: date, consumida: true, por: repoConsumiu?.alunoNome || null };
              });
              return (
              <div key={a.id} className="bg-gray-50 rounded-lg p-3 text-sm">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="font-medium">{a.alunoNome}</span>
                    <span className="text-gray-400 ml-2">({getTurmaLabel(state.turmas, a.turmaId)})</span>
                    <div className="text-gray-500 mt-0.5">Férias: {getMesNome(a.mesAno)} — Crédito: {a.creditoUsado ? <span className="text-green-600">usado</span> : <span className="text-amber-600">disponível</span>}</div>
                    {todasDatas.length > 0 && (
                      <div className="text-xs text-teal-600 mt-0.5">
                        Vagas liberadas:{' '}
                        {todasDatas.map((v, i) => (
                          <span key={i}>
                            {i > 0 && ', '}
                            {v.consumida
                              ? <span className="text-gray-400 line-through" title={`Ocupada por ${v.por}`}>{fmtBR(v.data)}</span>
                              : <span>{fmtBR(v.data)}</span>
                            }
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                  <button onClick={() => dispatch({type:'DELETE_AUSENCIA', id: a.id})} className="text-red-400 hover:text-red-600 text-xs ml-2 shrink-0">Remover</button>
                </div>
              </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function TabCancelarFalta({ state, dispatch }) {
  const [turmaId, setTurmaId] = useState('');
  const [alunoNome, setAlunoNome] = useState('');
  const [faltaId, setFaltaId] = useState('');
  const [confirm, setConfirm] = useState(false);
  const [success, setSuccess] = useState('');
  const td = todayStr();

  const faltasFuturas = useMemo(() =>
    state.faltas.filter(f => f.status === 'pendente' && f.datas[0] >= td),
    [state.faltas, td]);

  const turmas = useMemo(() => {
    const ids = new Set(faltasFuturas.map(f => f.turmaId));
    return sortTurmas(state.turmas.filter(t => ids.has(t.id)));
  }, [faltasFuturas, state.turmas]);

  const alunos = useMemo(() => {
    if (!turmaId) return [];
    const nomes = [...new Set(faltasFuturas.filter(f => f.turmaId === turmaId).map(f => f.alunoNome))].sort();
    return nomes;
  }, [turmaId, faltasFuturas]);

  const faltas = useMemo(() => {
    if (!turmaId || !alunoNome) return [];
    return faltasFuturas.filter(f => f.turmaId === turmaId && f.alunoNome === alunoNome)
      .sort((a,b) => a.datas[0].localeCompare(b.datas[0]));
  }, [turmaId, alunoNome, faltasFuturas]);

  const falta = faltas.find(f => f.id === faltaId);
  const repoVinc = falta ? state.reposicoes.find(r => r.vagaConsumedFaltaId === falta.id) : null;
  const outraVaga = repoVinc ? state.vagas.find(v =>
    v.turmaId === repoVinc.turmaReposicaoId && v.data === repoVinc.dataReposicao && v.faltaId !== falta.id
  ) : null;

  const handleCancel = () => {
    dispatch({ type: 'CANCEL_FALTA', id: faltaId });
    setSuccess(`Falta de ${alunoNome} em ${fmtBRFull(falta.datas[0])} cancelada.`);
    setTurmaId(''); setAlunoNome(''); setFaltaId(''); setConfirm(false);
    setTimeout(() => setSuccess(''), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Cancelar Falta</h3>

      <div>
        <label className="block text-sm font-medium text-gray-700 mb-1">Turma</label>
        <select value={turmaId} onChange={e => { setTurmaId(e.target.value); setAlunoNome(''); setFaltaId(''); }}
          className="w-full border border-gray-300 rounded-lg px-3 py-2">
          <option value="">— Selecione —</option>
          {turmas.map(t => <option key={t.id} value={t.id}>{getTurmaLabel(state.turmas, t.id)}</option>)}
        </select>
      </div>

      {turmaId && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Aluno</label>
          <select value={alunoNome} onChange={e => { setAlunoNome(e.target.value); setFaltaId(''); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione —</option>
            {alunos.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
      )}

      {alunoNome && (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Falta</label>
          <select value={faltaId} onChange={e => setFaltaId(e.target.value)}
            className="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="">— Selecione —</option>
            {faltas.map(f => <option key={f.id} value={f.id}>{fmtBRFull(f.datas[0])}</option>)}
          </select>
        </div>
      )}

      {falta && (
        <div className="bg-gray-50 rounded-lg p-3 text-sm space-y-1">
          <div><span className="font-medium">Aluno:</span> {falta.alunoNome}</div>
          <div><span className="font-medium">Data:</span> {fmtBRFull(falta.datas[0])}</div>

      {success && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">{success}</div>}

      <button
        onClick={() => setConfirm(true)}
        disabled={!faltaId}
        className="w-full py-2.5 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed"
      >

      {confirm && falta && (
        <ConfirmModal
          title="Cancelar falta?" danger
          message={`Cancelar a falta de ${falta.alunoNome} em ${fmtBRFull(falta.datas[0])}?`}
          onConfirm={handleCancel}
          onCancel={() => setConfirm(false)}
          confirmLabel="Cancelar falta"
        />
      )}

  );
}

// ==================== PAINEL: GENERATE TEXT ====================
function generatePainelText(state) {
  const td = todayStr();
  const sorted = sortTurmas(state.turmas);

  // ---- FALTAS ----
  const pendentes = state.faltas
    .filter(f => f.status === 'pendente')
    .sort((a,b) => {
      const ea = getFaltaEarliest(a), eb = getFaltaEarliest(b);
      if (ea !== eb) return ea.localeCompare(eb);
      const ta = state.turmas.find(t => t.id === a.turmaId);
      const tb = state.turmas.find(t => t.id === b.turmaId);
      return (ta?.horario||'').localeCompare(tb?.horario||'');
    });

  const ausencias = state.ausencias
    .filter(a => !a.creditoUsado)
    .sort((a,b) => getLastDayOfMonth(a.mesAno).localeCompare(getLastDayOfMonth(b.mesAno)));

  const marcadas = state.faltas
    .filter(f => f.status === 'marcada')
    .sort((a,b) => {
      const ea = getFaltaEarliest(a), eb = getFaltaEarliest(b);
      if (ea !== eb) return ea.localeCompare(eb);
      const ta = state.turmas.find(t => t.id === a.turmaId);
      const tb = state.turmas.find(t => t.id === b.turmaId);
      return (ta?.horario||'').localeCompare(tb?.horario||'');
    });

  let faltasText = '*FALTAS*\n';

  // Agrupar pendentes por aluno+turma
  const pendentesGrupos = (() => {
    const map = {};
    pendentes.forEach(f => {
      const key = `${f.alunoNome}|${f.turmaId}`;
      if (!map[key]) map[key] = { alunoNome: f.alunoNome, turmaId: f.turmaId, datas: [] };
      map[key].datas.push(f.datas[0]);
    });
    return Object.values(map).sort((a, b) => {
      const ea = [...a.datas].sort()[0];
      const eb = [...b.datas].sort()[0];
      return ea.localeCompare(eb);
    });
  })();

  // Merge grupos + ausencias sorted
  const combined = [
    ...pendentesGrupos.map(g => ({ tipo:'falta', obj:g, sortKey: [...g.datas].sort()[0] + (state.turmas.find(t=>t.id===g.turmaId)?.horario||'') })),
    ...ausencias.map(a => ({ tipo:'ausencia', obj:a, sortKey: getLastDayOfMonth(a.mesAno) }))
  ].sort((a,b) => a.sortKey.localeCompare(b.sortKey));

  if (combined.length) faltasText += '\n';
  combined.forEach(({ tipo, obj }) => {
    const t = state.turmas.find(x => x.id === obj.turmaId);
    const tLabel = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
    if (tipo === 'falta') {
      const datasOrdenadas = [...obj.datas].sort();
      faltasText += `${obj.alunoNome} (${tLabel})\nFalta: *${fmtDatesText(datasOrdenadas)}*\n\n`;
    } else {
      faltasText += `${obj.alunoNome} (${tLabel})\nFérias: ${getMesNome(obj.mesAno).toLowerCase()}\n\n`;
    }
  });

  if (marcadas.length) {
    faltasText += '*JÁ MARCADAS*\n\n';
    marcadas.forEach(f => {
      const t = state.turmas.find(x => x.id === f.turmaId);
      const tLabel = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      faltasText += `${f.alunoNome} (${tLabel})\nFalta: ${fmtDatesText(f.datas)}\n\n`;
    });
  }

  // ---- REPOSIÇÕES ----
  const reposAtivas = state.reposicoes
    .filter(r => !r.realizada)
    .sort((a,b) => {
      if (a.dataReposicao !== b.dataReposicao) return a.dataReposicao.localeCompare(b.dataReposicao);
      const ta = state.turmas.find(t => t.id === a.turmaReposicaoId);
      const tb = state.turmas.find(t => t.id === b.turmaReposicaoId);
      return (ta?.horario || '').localeCompare(tb?.horario || '');
    });

  let reposText = '*REPOSIÇÕES*\n';
  if (reposAtivas.length) {
    reposText += '\n';
    reposAtivas.forEach(r => {
      const tOrigem = state.turmas.find(t => t.id === r.turmaOrigemId);
      const tRepo = state.turmas.find(t => t.id === r.turmaReposicaoId);
      const origemLabel = tOrigem ? `${ABREV[tOrigem.diaSemana]} ${tOrigem.horario}` : '?';
      const dia = getDiaSemanaFromDateStr(r.dataReposicao);
      const prefix = r.tipo === 'reposicao' ? 'Repõe' : 'Aula extra';
      reposText += `${r.alunoNome} (${origemLabel})\n${prefix}: ${EXTENSO[dia]}, ${fmtBR(r.dataReposicao)}, ${tRepo?.horario||'?'}\n\n`;
    });
  } else {
    reposText += '\n_Nenhuma reposição agendada_\n\n';
  }

  // ---- VAGAS ----
  const vagasFuturas = state.vagas.filter(v => v.data >= td).sort((a,b) => {
    if (a.data !== b.data) return a.data.localeCompare(b.data);
    const ta = state.turmas.find(t => t.id === a.turmaId);
    const tb = state.turmas.find(t => t.id === b.turmaId);
    return (ta?.horario||'').localeCompare(tb?.horario||'');
  });

  // Group by turmaId + data
  const vagasGrouped = {};
  vagasFuturas.forEach(v => {
    const key = `${v.data}|${v.turmaId}`;
    if (!vagasGrouped[key]) vagasGrouped[key] = { data: v.data, turmaId: v.turmaId, count: 0 };
    vagasGrouped[key].count++;
  });
  const vagasList = Object.values(vagasGrouped).sort((a,b) => {
    if (a.data !== b.data) return a.data.localeCompare(b.data);
    const ta = state.turmas.find(t => t.id === a.turmaId);
    const tb = state.turmas.find(t => t.id === b.turmaId);
    return (ta?.horario||'').localeCompare(tb?.horario||'');
  });

  let vagasText = '*VAGAS*\n';
  if (vagasList.length) {
    vagasText += '\n';
    vagasList.forEach(v => {
      const t = state.turmas.find(x => x.id === v.turmaId);
      const dia = getDiaSemanaFromDateStr(v.data);
      vagasText += `${EXTENSO[dia]}, ${fmtBR(v.data)}, ${t?.horario||'?'}${v.count > 1 ? ` (${v.count})` : ''}\n\n`;
    });
  } else {
    vagasText += '\n_Nenhuma vaga aberta_\n\n';
  }

  // ---- TURMAS ----
  let turmasText = '*TURMAS*\n\n';
  sorted.forEach(t => {
    const obs = t.observacao ? ` (${t.observacao})` : '';
    turmasText += `${ABREV[t.diaSemana]} ${t.horario} - ${t.alunos.length} aluno${t.alunos.length !== 1 ? 's' : ''}${obs}\n`;
  });

  // ---- OBSERVAÇÕES ----
  const obs = [];
  const today = td;
  const in7Days = (() => { const d = new Date(); d.setDate(d.getDate()+7); return dateToStr(d); })();
  const twoDaysAgo = (() => { const d = new Date(); d.setDate(d.getDate()-2); return dateToStr(d); })();

  // Expiring soon (active faltas within 7 days)
  state.faltas.filter(f => {
    if (f.status !== 'pendente') return false;
    const exp = getFaltaExpiry(f);
    return exp >= today && exp <= in7Days;
  }).forEach(f => {
    const t = state.turmas.find(x => x.id === f.turmaId);
    obs.push(`⚠️ Falta expirando em ${fmtBRFull(getFaltaExpiry(f))}: ${f.alunoNome} (${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'})`);
  });

  // Recently expired faltas (last 2 days) from statistics
  arr((state.estatisticas || {}).faltasExpiradas)
    .filter(e => e.expiradaEm >= twoDaysAgo && e.expiradaEm < today)
    .forEach(e => {
      const t = state.turmas.find(x => x.id === e.turmaId);
      obs.push(`🔴 Falta expirada: ${e.alunoNome} (${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}) — ${fmtBR(e.data)}`);
    });

  // Aulas extra sem falta
  const extrasOrfas = state.reposicoes.filter(r => r.tipo === 'aula_extra' && !r.realizada);
  extrasOrfas.forEach(r => {
    obs.push(`ℹ️ Aula extra sem falta vinculada: ${r.alunoNome} — ${fmtBRFull(r.dataReposicao)}`);
  });

  // Ausencias expirando
  state.ausencias.filter(a => !a.creditoUsado).forEach(a => {
    const exp = getAusenciaExpiry(a);
    if (exp >= today && exp <= in7Days) {
      obs.push(`⚠️ Férias de ${a.alunoNome} expirando em ${fmtBRFull(exp)}`);
    }
    if (exp < today) {
      obs.push(`🔴 Crédito de férias expirado: ${a.alunoNome} (${getMesNome(a.mesAno)})`);
    }
  });


  let obsText = '*OBSERVAÇÕES*\n\n';
  obsText += obs.length ? obs.join('\n') + '\n' : '_Nenhuma observação_\n';

  return [faltasText.trim(), reposText.trim(), vagasText.trim(), turmasText.trim(), obsText.trim()].join('\n\n---\n\n');
}

// ==================== SECTION 3: PAINEL ====================
function SectionPainel({ state, dispatch }) {
  const [tab, setTab] = useState(0);
  const tabs = ['Lista atual', 'Histórico', 'Importação', 'Registro'];
  const td = todayStr();

  // Alertas
  const in7 = (() => { const d = new Date(); d.setDate(d.getDate()+7); return dateToStr(d); })();
  const alertas = useMemo(() => {
    const list = [];
    state.faltas.filter(f => f.status === 'pendente').forEach(f => {
      const exp = getFaltaExpiry(f);
      if (exp >= td && exp <= in7) {
        const t = state.turmas.find(x => x.id === f.turmaId);
        list.push({ type:'expirando', label: `${f.alunoNome} (${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}) — expira ${fmtBRFull(exp)}` });
      }
    });
    state.ausencias.filter(a => !a.creditoUsado).forEach(a => {
      const exp = getAusenciaExpiry(a);
      if (exp >= td && exp <= in7) {
        list.push({ type:'expirando', label: `Férias de ${a.alunoNome} — expira ${fmtBRFull(exp)}` });
      }
    });
    return list;
  }, [state, td, in7]);

  return (
    <div className="max-w-4xl mx-auto p-4">
      <h2 className="text-xl font-bold text-gray-800 mb-4">Painel</h2>

      {alertas.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-4 fade-in">
          <div className="flex items-center gap-2 font-semibold text-amber-800 mb-2">⚠️ Alertas</div>
          <ul className="space-y-1">
            {alertas.map((a,i) => (
              <li key={i} className={`text-sm ${a.type==='capacidade' ? 'text-red-700' : 'text-amber-700'}`}>{a.label}</li>
            ))}
          </ul>
        </div>
      )}

      <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div className="flex border-b border-gray-200">
          {tabs.map((t,i) => (
            <button key={i} onClick={() => setTab(i)} className={`flex-1 px-4 py-3 text-sm font-medium transition-colors ${tab===i ? 'border-b-2 border-blue-600 text-blue-600 bg-blue-50' : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'}`}>{t}</button>
          ))}
        </div>
        <div className="p-4">
          {tab === 0 && <PainelLista state={state} dispatch={dispatch} />}
          {tab === 1 && <PainelHistorico state={state} dispatch={dispatch} />}
          {tab === 2 && <PainelImportacao state={state} dispatch={dispatch} />}
          {tab === 3 && <PainelRegistro state={state} />}
        </div>
      </div>
    </div>
  );
}

// ==================== PAINEL: VISUAL RENDERER ====================
function PainelVisual({ state, dispatch }) {
  const td = todayStr();
  const sorted = sortTurmas(state.turmas);

  // Acordeão — quais seções estão abertas
  const [open, setOpen] = useState({ faltas: false, reposicoes: false, vagas: false, turmas: false, obs: false });
  const toggle = (key) => setOpen(prev => ({ ...prev, [key]: !prev[key] }));

  // Modal de detalhes
  const [det, setDet] = useState(null); // { tipo: 'falta'|'reposicao'|'vaga'|'marcada', obj }

  const BlockHeader = ({ children, sub, sKey, count }) => (
    <div
      onClick={sKey ? () => toggle(sKey) : undefined}
      className={`px-4 py-2.5 font-bold text-sm tracking-widest flex items-center justify-between
        ${sub ? 'bg-gray-100 text-gray-500 border-t border-gray-200 text-xs cursor-default'
               : `bg-gray-800 text-white ${open[sKey] ? 'rounded-t-xl' : 'rounded-xl'} ${sKey ? 'cursor-pointer hover:bg-gray-700 transition-colors' : ''}`}`}
    >
      <span>

        )}
      </span>
      {sKey && <span className="opacity-50 text-xs">{open[sKey] ? '▲' : '▼'}</span>}
    </div>
  );

  // --- FALTAS ---
  const pendentes = state.faltas
    .filter(f => f.status === 'pendente')
    .sort((a, b) => {
      const ea = getFaltaEarliest(a), eb = getFaltaEarliest(b);
      if (ea !== eb) return ea.localeCompare(eb);
      return (state.turmas.find(t=>t.id===a.turmaId)?.horario||'').localeCompare(state.turmas.find(t=>t.id===b.turmaId)?.horario||'');
    });

  const ausencias = state.ausencias
    .filter(a => !a.creditoUsado)
    .sort((a,b) => getLastDayOfMonth(a.mesAno).localeCompare(getLastDayOfMonth(b.mesAno)));

  const pendentesGrupos = (() => {
    const map = {};
    pendentes.forEach(f => {
      const key = `${f.alunoNome}|${f.turmaId}`;
      if (!map[key]) map[key] = { alunoNome: f.alunoNome, turmaId: f.turmaId, datas: [], faltas: [] };
      map[key].datas.push(f.datas[0]);
      map[key].faltas.push(f);
    });
    return Object.values(map).sort((a, b) => {
      const ea = [...a.datas].sort()[0], eb = [...b.datas].sort()[0];
      if (ea !== eb) return ea.localeCompare(eb);
      return (state.turmas.find(t=>t.id===a.turmaId)?.horario||'').localeCompare(state.turmas.find(t=>t.id===b.turmaId)?.horario||'');
    });
  })();

  const combined = [
    ...pendentesGrupos.map(g => ({ tipo:'falta', obj:g, sortKey: [...g.datas].sort()[0]+(state.turmas.find(t=>t.id===g.turmaId)?.horario||'') })),
    ...ausencias.map(a => ({ tipo:'ausencia', obj:a, sortKey: getLastDayOfMonth(a.mesAno) }))
  ].sort((a,b) => a.sortKey.localeCompare(b.sortKey));

  const marcadasGrupos = (() => {
    const map = {};
    state.faltas.filter(f => f.status === 'marcada').forEach(f => {
      const key = `${f.alunoNome}|${f.turmaId}`;
      if (!map[key]) map[key] = { alunoNome: f.alunoNome, turmaId: f.turmaId, datas: [], faltas: [] };
      map[key].datas.push(f.datas[0]);
      map[key].faltas.push(f);
    });
    return Object.values(map).sort((a, b) => [...a.datas].sort()[0].localeCompare([...b.datas].sort()[0]));
  })();

  // --- REPOSIÇÕES ---
  const reposAtivas = state.reposicoes
    .filter(r => !r.realizada)
    .sort((a,b) => {
      if (a.dataReposicao !== b.dataReposicao) return a.dataReposicao.localeCompare(b.dataReposicao);
      const ta = state.turmas.find(t => t.id === a.turmaReposicaoId);
      const tb = state.turmas.find(t => t.id === b.turmaReposicaoId);
      return (ta?.horario || '').localeCompare(tb?.horario || '');
    });

  // --- VAGAS (com alunos vinculados) ---
  const vagasGrupos = (() => {
    const map = {};
    state.vagas.filter(v => v.data >= td).forEach(v => {
      const key = `${v.data}|${v.turmaId}`;
      if (!map[key]) map[key] = { data: v.data, turmaId: v.turmaId, count: 0, vagas: [] };
      map[key].count++;
      map[key].vagas.push(v);
    });
    return Object.values(map).sort((a,b) => {
      if (a.data !== b.data) return a.data.localeCompare(b.data);
      return (state.turmas.find(t=>t.id===a.turmaId)?.horario||'').localeCompare(state.turmas.find(t=>t.id===b.turmaId)?.horario||'');
    });
  })();

  // --- OBSERVAÇÕES ---
  const in7 = (() => { const d = new Date(); d.setDate(d.getDate()+7); return dateToStr(d); })();
  const twoDaysAgo = (() => { const d = new Date(); d.setDate(d.getDate()-2); return dateToStr(d); })();
  const obs = [];
  state.faltas.filter(f => f.status==='pendente').forEach(f => {
    const exp = getFaltaExpiry(f);
    const t = state.turmas.find(x => x.id===f.turmaId);
    const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
    if (exp >= td && exp <= in7) obs.push({ level:'amber', text:`Falta expirando em ${fmtBRFull(exp)}: ${f.alunoNome} (${lbl})` });
  });
  arr((state.estatisticas || {}).faltasExpiradas)
    .filter(e => e.expiradaEm >= twoDaysAgo && e.expiradaEm < td)
    .forEach(e => {
      const t = state.turmas.find(x => x.id===e.turmaId);
      obs.push({ level:'red', text:`Falta expirada: ${e.alunoNome} (${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}) — ${fmtBR(e.data)}` });
    });
  state.ausencias.filter(a => !a.creditoUsado).forEach(a => {
    const exp = getAusenciaExpiry(a);
    if (exp < td) obs.push({ level:'red', text:`Crédito de férias expirado: ${a.alunoNome} (${getMesNome(a.mesAno)})` });
    else if (exp <= in7) obs.push({ level:'amber', text:`Férias de ${a.alunoNome} expirando em ${fmtBRFull(exp)}` });
  });
  const vagasExtrasAbertas = state.vagas.filter(v => v.vagaExtra && v.data >= td);
  if (vagasExtrasAbertas.length > 0) {
    const porTurmaData = {};
    vagasExtrasAbertas.forEach(v => {
      const key = v.turmaId + '|' + v.data;
      if (!porTurmaData[key]) porTurmaData[key] = { turmaId: v.turmaId, data: v.data, count: 0 };
      porTurmaData[key].count++;
    });
    Object.values(porTurmaData).sort((a,b) => a.data.localeCompare(b.data)).forEach(({ turmaId, data, count }) => {
      const t = state.turmas.find(x => x.id === turmaId);
      const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      obs.push({ level:'teal', text:`${count} vaga${count>1?'s':''} extra${count>1?'s':''} disponíve${count>1?'is':'l'}: ${lbl} — ${fmtBRFull(data)}` });
    });
  }
  state.faltas.filter(f => f.status === 'pendente' && f.semAntecedencia).forEach(f => {
    const t = state.turmas.find(x => x.id === f.turmaId);
    const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
    obs.push({ level:'orange', text:`Falta sem antecedência: ${f.alunoNome} (${lbl}) — ${fmtBR(f.datas[0])}` });
  });
  state.reposicoes.filter(r => !r.realizada && r.tipo==='aula_extra').forEach(r => {
    obs.push({ level:'blue', text:`Aula extra sem falta vinculada: ${r.alunoNome} — ${fmtBRFull(r.dataReposicao)}` });
  });
  state.reposicoes.filter(r => !r.realizada && r.semFaltaVinculada).forEach(r => {
    obs.push({ level:'blue', text:`Reposição sem falta vinculada: ${r.alunoNome} — ${fmtBRFull(r.dataReposicao)}` });
  });

  const obsColors = { red:'bg-red-50 text-red-700 border-red-200', amber:'bg-amber-50 text-amber-700 border-amber-200', blue:'bg-blue-50 text-blue-700 border-blue-200', teal:'bg-teal-50 text-teal-700 border-teal-200', orange:'bg-orange-50 text-orange-700 border-orange-200' };
  const obsIcons  = { red:'🔴', amber:'⚠️', blue:'ℹ️', teal:'✦', orange:'⏱️' };

  // ---- MODAL DE DETALHES ----
  const DetModal = () => {
    if (!det) return null;
    const { tipo, obj } = det;
    let title = '', body = null;

    if (tipo === 'falta') {
      const t = state.turmas.find(x => x.id === obj.turmaId);
      const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      title = `${obj.alunoNome} — ${lbl}`;
      body = (
        <div className="space-y-2">
          {[...obj.faltas].sort((a,b) => a.datas[0].localeCompare(b.datas[0])).map(f => {
            const exp = getFaltaExpiry(f);
            const expiring = exp >= td && exp <= in7;
            return (
              <div key={f.id} className={`rounded-lg px-3 py-2 text-sm ${expiring ? 'bg-amber-50 border border-amber-200' : 'bg-gray-50'}`}>
                <div className="font-semibold text-gray-800 flex items-center gap-2">
                  📅 {fmtBRFull(f.datas[0])}
                  {f.semAntecedencia && <span className="text-xs font-medium px-1.5 py-0.5 rounded-full bg-orange-100 text-orange-700">sem antecedência</span>}
                </div>
                <div className="text-gray-500 mt-0.5">Expira em: {fmtBRFull(exp)}
                  {expiring && <span className="ml-1 text-amber-600 font-medium">⚠️ em breve</span>}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    if (tipo === 'marcada') {
      const t = state.turmas.find(x => x.id === obj.turmaId);
      const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
      // Find linked reposição
      const repo = obj.faltas[0]?.reposicaoId ? state.reposicoes.find(r => r.id === obj.faltas[0].reposicaoId) : null;
      const tRepo = repo ? state.turmas.find(x => x.id === repo.turmaReposicaoId) : null;
      title = `${obj.alunoNome} — ${lbl}`;
      body = (
        <div className="space-y-2 text-sm">
          <div className="bg-gray-50 rounded-lg px-3 py-2">
            <div className="text-gray-500 text-xs mb-1">Falta(s) marcada(s)</div>
            <div className="font-semibold text-gray-800">{fmtDatesText([...obj.datas].sort())}</div>
          </div>
          {repo && (
            <div className="bg-blue-50 border border-blue-200 rounded-lg px-3 py-2">
              <div className="text-blue-600 text-xs mb-1">Reposição agendada</div>
              <div className="font-semibold text-gray-800">{EXTENSO[getDiaSemanaFromDateStr(repo.dataReposicao)]}, {fmtBRFull(repo.dataReposicao)}</div>
              <div className="text-gray-600">{tRepo ? `${ABREV[tRepo.diaSemana]} ${tRepo.horario}` : '?'}</div>
            </div>
          )}
        </div>
      );
    }

    if (tipo === 'reposicao') {
      const r = obj;
      const tOrigem = state.turmas.find(x => x.id === r.turmaOrigemId);
      const tRepo   = state.turmas.find(x => x.id === r.turmaReposicaoId);
      const dia     = getDiaSemanaFromDateStr(r.dataReposicao);
      const isExtra = r.tipo === 'aula_extra';
      const isFerias = r.tipo === 'reposicao_ferias';
      const faltaVinc = r.faltaId ? state.faltas.find(f => f.id === r.faltaId) : null;
      const faltaLiberou = r.vagaConsumedFaltaId ? state.faltas.find(f => f.id === r.vagaConsumedFaltaId) : null;
      const tLiberou = faltaLiberou ? state.turmas.find(x => x.id === faltaLiberou.turmaId) : null;
      const ausLiberou = r.vagaConsumedAusenciaId ? state.ausencias.find(a => a.id === r.vagaConsumedAusenciaId) : null;
      const ausVinc = isFerias && r.ausenciaId ? state.ausencias.find(a => a.id === r.ausenciaId) : null;
      title = `${r.alunoNome}`;
      body = (
        <div className="space-y-2 text-sm">
          <div className="grid grid-cols-2 gap-2">
            <div className="bg-gray-50 rounded-lg px-3 py-2">
              <div className="text-gray-400 text-xs">Turma origem</div>
              <div className="font-semibold">{tOrigem ? `${ABREV[tOrigem.diaSemana]} ${tOrigem.horario}` : '?'}</div>
            </div>
            <div className="bg-gray-50 rounded-lg px-3 py-2">
              <div className="text-gray-400 text-xs">Turma reposição</div>
              <div className="font-semibold">{tRepo ? `${ABREV[tRepo.diaSemana]} ${tRepo.horario}` : '?'}</div>
            </div>
          </div>
          <div className="bg-blue-50 border border-blue-200 rounded-lg px-3 py-2">
            <div className="text-blue-600 text-xs mb-0.5">{isExtra ? 'Aula extra em' : 'Repõe em'}</div>
            <div className="font-bold text-gray-900">{EXTENSO[dia]}, {fmtBRFull(r.dataReposicao)}, {tRepo?.horario || '?'}</div>
          </div>
          {ausVinc && (
            <div className="bg-teal-50 border border-teal-200 rounded-lg px-3 py-2">
              <div className="text-teal-600 text-xs mb-0.5">🏖️ Crédito de férias</div>
              <div className="font-semibold text-gray-800">Férias de {getMesNome(ausVinc.mesAno)}</div>
            </div>
          )}
          {faltaVinc && (
            <div className="bg-gray-50 rounded-lg px-3 py-2">
              <div className="text-gray-400 text-xs">Falta vinculada</div>
              <div className="font-semibold">{fmtBRFull(faltaVinc.datas[0])}</div>
            </div>
          )}
          {faltaLiberou ? (
            <div className="bg-green-50 border border-green-200 rounded-lg px-3 py-2">
              <div className="text-green-600 text-xs mb-0.5">Vaga liberada por</div>
              <div className="font-semibold text-gray-800">{faltaLiberou.alunoNome} ({tLiberou ? `${ABREV[tLiberou.diaSemana]} ${tLiberou.horario}` : '?'})</div>
              <div className="text-gray-500 text-xs mt-0.5">Falta de {fmtBRFull(faltaLiberou.datas[0])}</div>
            </div>
          ) : ausLiberou ? (
            <div className="bg-teal-50 border border-teal-200 rounded-lg px-3 py-2">
              <div className="text-teal-600 text-xs mb-0.5">🏖️ Vaga liberada por férias</div>
              <div className="font-semibold text-gray-800">{ausLiberou.alunoNome} ({getMesNome(ausLiberou.mesAno)})</div>
            </div>
          ) : !isFerias && (
            <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">
              <div className="text-amber-700 text-xs font-medium">
                {isExtra ? 'Aula extra — sem vaga vinculada' : 'Data extra — nenhuma falta liberou esta vaga'}
              </div>
            </div>
          )}
          <div className="flex items-center gap-2 flex-wrap">
            {isFerias && (
              <span className="bg-teal-100 text-teal-700 text-xs font-medium px-2 py-0.5 rounded-full">🏖️ Reposição de férias</span>
            )}
            {isExtra && (
              <span className="bg-purple-100 text-purple-700 text-xs font-medium px-2 py-0.5 rounded-full">Aula extra</span>
            )}
            {r.semFaltaVinculada && (
              <span className="bg-amber-100 text-amber-700 text-xs font-medium px-2 py-0.5 rounded-full">Sem falta vinculada</span>
            )}
            {isExtra && (
              <button
                onClick={() => { dispatch({ type: 'MARK_PAGO', id: r.id }); setDet(prev => prev ? { ...prev, obj: { ...r, pago: !r.pago } } : null); }}
                className={`text-xs font-semibold px-2.5 py-0.5 rounded-full border transition-colors ${r.pago ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-500 border-gray-300 hover:border-green-500 hover:text-green-600'}`}
              >{r.pago ? '✓ PAGO' : 'PAGO'}</button>
            )}
          </div>
        </div>
      );
    }

    if (tipo === 'vaga') {
      const v = obj;
      const t = state.turmas.find(x => x.id === v.turmaId);
      const dia = getDiaSemanaFromDateStr(v.data);
      const origens = v.vagas.map(vg => {
        if (vg.ausenciaId) {
          const aus = state.ausencias.find(a => a.id === vg.ausenciaId);
          return aus ? `${aus.alunoNome} (férias)` : null;
        }
        if (vg.faltaId) {
          const f = state.faltas.find(f => f.id === vg.faltaId);
          return f ? f.alunoNome : null;
        }
        return vg.vagaExtra ? 'vaga extra' : null;
      }).filter(Boolean);
      title = `Vagas — ${t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?'}`;
      body = (
        <div className="space-y-2 text-sm">
          <div className="bg-gray-50 rounded-lg px-3 py-2">
            <div className="text-gray-400 text-xs">Data</div>
            <div className="font-bold text-gray-900">{EXTENSO[dia]}, {fmtBRFull(v.data)}</div>
          </div>
          <div className="bg-blue-50 border border-blue-200 rounded-lg px-3 py-2">
            <div className="text-blue-600 text-xs mb-1">{v.count} vaga{v.count > 1 ? 's' : ''} gerada{v.count > 1 ? 's' : ''} por</div>
            {origens.length ? origens.map((a, i) => (
              <div key={i} className="font-semibold text-gray-800">· {a}</div>
            )) : <div className="text-gray-400 text-xs italic">vaga extra</div>}
          </div>
        </div>
      );
    }

    return (
      <Modal title={title} onClose={() => setDet(null)}>
        {body}
      </Modal>
    );
  };

  return (
    <div className="space-y-4">
      <DetModal />

      {/* FALTAS */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader sKey="faltas" count={combined.length + marcadasGrupos.length}>FALTAS</BlockHeader>
        {open.faltas && (
          <>
            {combined.length === 0 && marcadasGrupos.length === 0 && (
              <div className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma falta registrada.</div>
            )}
            <div className="divide-y divide-gray-100">
              {combined.map(({ tipo, obj }, i) => {
                const t = state.turmas.find(x => x.id === obj.turmaId);
                const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
                if (tipo === 'falta') {
                  const datasOrdenadas = [...obj.datas].sort();
                  const nearestExp = datasOrdenadas.map(d => { const dt = parseDate(d); dt.setDate(dt.getDate()+30); return dateToStr(dt); }).sort()[0];
                  const expiring = nearestExp >= td && nearestExp <= in7;
                  return (
                    <div key={i} onClick={() => setDet({ tipo:'falta', obj })}
                      className={`px-4 py-3 cursor-pointer hover:bg-gray-50 transition-colors ${expiring ? 'bg-amber-50 hover:bg-amber-100' : 'bg-white'}`}>
                      <div className="flex justify-between items-start">
                        <span className="font-semibold text-gray-800">{obj.alunoNome}</span>
                        <span className="text-xs text-gray-400 ml-2">{lbl}</span>
                      </div>
                      <div className="text-sm text-gray-600 mt-0.5">
                        Falta: <span className="font-bold text-gray-900">{fmtDatesText(datasOrdenadas)}</span>
                        {expiring && <span className="ml-2 text-xs text-amber-600 font-medium">· expira {fmtBRFull(nearestExp)}</span>}
                      </div>
                      {obj.faltas.some(f => f.semAntecedencia) && (
                        <div className="mt-1"><span className="text-xs font-medium px-2 py-0.5 rounded-full bg-orange-100 text-orange-700">sem antecedência</span></div>
                      )}
                    </div>
                  );
                } else {
                  return (
                    <div key={i} className="px-4 py-3 bg-white">
                      <div className="flex justify-between items-start">
                        <span className="font-semibold text-gray-800">{obj.alunoNome}</span>
                        <span className="text-xs text-gray-400 ml-2">{lbl}</span>
                      </div>
                      <div className="text-sm text-gray-600 mt-0.5">Férias: <span className="font-medium">{getMesNome(obj.mesAno).toLowerCase()}</span></div>
                    </div>
                  );
                }
              })}
            </div>

            {marcadasGrupos.length > 0 && (
              <>
                <BlockHeader sub>JÁ MARCADAS</BlockHeader>
                <div className="divide-y divide-gray-100">
                  {marcadasGrupos.map((g, i) => {
                    const t = state.turmas.find(x => x.id === g.turmaId);
                    const lbl = t ? `${ABREV[t.diaSemana]} ${t.horario}` : '?';
                    return (
                      <div key={i} onClick={() => setDet({ tipo:'marcada', obj: g })}
                        className="px-4 py-3 bg-white cursor-pointer hover:bg-gray-50 transition-colors">
                        <div className="flex justify-between items-start">
                          <span className="font-medium text-gray-500">{g.alunoNome}</span>
                          <span className="text-xs text-gray-400 ml-2">{lbl}</span>
                        </div>
                        <div className="text-sm text-gray-400 mt-0.5">Falta: {fmtDatesText([...g.datas].sort())}</div>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </>
        )}
      </div>

      {/* REPOSIÇÕES */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader sKey="reposicoes" count={reposAtivas.length}>REPOSIÇÕES</BlockHeader>
        {open.reposicoes && (
          <>
            {reposAtivas.length === 0 && (
              <div className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma reposição agendada.</div>
            )}
            <div className="divide-y divide-gray-100">
              {reposAtivas.map((r, i) => {
                const tOrigem = state.turmas.find(t => t.id === r.turmaOrigemId);
                const tRepo   = state.turmas.find(t => t.id === r.turmaReposicaoId);
                const dia     = getDiaSemanaFromDateStr(r.dataReposicao);
                const origemLbl = tOrigem ? `${ABREV[tOrigem.diaSemana]} ${tOrigem.horario}` : '?';
                const isExtra   = r.tipo === 'aula_extra';
                const isFerias  = r.tipo === 'reposicao_ferias';
                const semFalta  = r.semFaltaVinculada;
                const occupancyNum = calcOccupancy(r.turmaReposicaoId, r.dataReposicao, state);
                return (
                  <div key={i} onClick={() => setDet({ tipo:'reposicao', obj: r })}
                    className="px-4 py-3 bg-white cursor-pointer hover:bg-gray-50 transition-colors">
                    <div className="flex justify-between items-start">
                      <span className="font-semibold text-gray-800">{r.alunoNome}</span>
                      <span className="text-xs text-gray-400 ml-2">{origemLbl}</span>
                    </div>
                    <div className="text-sm text-gray-600 mt-0.5">
                      <span className="text-gray-400">{isExtra ? 'Aula extra:' : 'Repõe:'}</span>{' '}
                      <span className="font-bold text-gray-900">{EXTENSO[dia]}, {fmtBR(r.dataReposicao)}, {tRepo?.horario || '?'}</span>
                      {occupancyNum !== null && (
                        <span className="ml-2 text-xs text-gray-500">({occupancyNum} alunos esperados)</span>
                      )}
                    </div>
                    <div className="mt-1 flex items-center gap-2 flex-wrap">
                      {(r.vagaExtra || r.semVagaOficial) && !r.vagaConsumedFaltaId && !r.vagaConsumedAusenciaId && (
                        <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-teal-100 text-teal-700">
                          vaga extra
                        </span>
                      )}
                      {isFerias && (
                        <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-teal-100 text-teal-700">
                          🏖️ crédito de férias
                        </span>
                      )}
                      {(isExtra || semFalta) && (
                        <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${isExtra ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700'}`}>
                          {isExtra ? 'Aula extra' : 'Sem falta vinculada'}
                        </span>
                      )}
                      {isExtra && (
                        <button onClick={e => { e.stopPropagation(); dispatch({ type: 'MARK_PAGO', id: r.id }); }}
                          className={`text-xs font-semibold px-2.5 py-0.5 rounded-full border transition-colors ${r.pago ? 'bg-green-600 text-white border-green-600' : 'bg-white text-gray-500 border-gray-300 hover:border-green-500 hover:text-green-600'}`}>
                          {r.pago ? '✓ PAGO' : 'PAGO'}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* VAGAS */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader sKey="vagas" count={vagasGrupos.length}>VAGAS</BlockHeader>
        {open.vagas && (
          <>
            {vagasGrupos.length === 0 && (
              <div className="px-4 py-3 text-sm text-gray-400 italic">Nenhuma vaga aberta.</div>
            )}
            <div className="divide-y divide-gray-100">
              {vagasGrupos.map((v, i) => {
                const t   = state.turmas.find(x => x.id === v.turmaId);
                const dia = getDiaSemanaFromDateStr(v.data);
                return (
                  <div key={i} onClick={() => setDet({ tipo:'vaga', obj: v })}
                    className="px-4 py-3 bg-white cursor-pointer hover:bg-gray-50 transition-colors flex justify-between items-center">
                    <div>
                      <span className="font-bold text-gray-900">{EXTENSO[dia]}, {fmtBR(v.data)}</span>
                      <span className="text-gray-500 ml-2 text-sm">{t?.horario || '?'}</span>
                    </div>
                    {v.count > 1 && (
                      <span className="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-0.5 rounded-full">{v.count} vagas</span>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* TURMAS */}
      <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
        <BlockHeader sKey="turmas" count={sorted.length}>TURMAS</BlockHeader>
        {open.turmas && (
          <div className="divide-y divide-gray-100">
            {sorted.map((t, i) => {
              const over = t.alunos.length > t.capacidade;
              const full = t.alunos.length === t.capacidade;
              return (
                <div key={i} className="px-4 py-2.5 bg-white flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <span className="font-medium text-gray-700">{ABREV[t.diaSemana]} {t.horario}</span>
                    {t.observacao && <span className="text-xs text-gray-400">({t.observacao})</span>}
                  </div>
                  <span className={`text-sm font-medium ${over ? 'text-red-600' : full ? 'text-amber-600' : 'text-gray-500'}`}>
                    {t.alunos.length}/{t.capacidade}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* OBSERVAÇÕES */}
      {obs.length > 0 && (
        <div className="rounded-xl border border-gray-200 overflow-hidden shadow-sm">
          <BlockHeader sKey="obs" count={obs.length}>OBSERVAÇÕES</BlockHeader>
          {open.obs && (
            <div className="divide-y divide-gray-100">
              {obs.map((o, i) => (
                <div key={i} className={`px-4 py-3 text-sm border-l-4 ${obsColors[o.level]} border-l-current`}>
                  {obsIcons[o.level]} {o.text}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PainelLista({ state, dispatch }) {
  const [copied, setCopied]         = useState(false);
  const [copiedVagas, setCopiedVagas] = useState(false);
  const [snapLabel, setSnapLabel]   = useState('');
  const [snapSaved, setSnapSaved]   = useState(false);
  const [showRaw, setShowRaw]       = useState(false);

  const text = useMemo(() => generatePainelText(state), [state]);
  const vagasWhatsApp = useMemo(() => {
    const td = todayStr();
    const in6 = (() => { const d = new Date(); d.setDate(d.getDate()+6); return dateToStr(d); })();
    const seen = new Set();
    const linhas = [];
    [...state.vagas]
      .filter(v => v.data >= td && v.data <= in6)
      .sort((a, b) => {
        if (a.data !== b.data) return a.data.localeCompare(b.data);
        return (state.turmas.find(t => t.id === a.turmaId)?.horario||'').localeCompare(state.turmas.find(t => t.id === b.turmaId)?.horario||'');
      })
      .forEach(v => {
        const key = `${v.data}|${v.turmaId}`;
        if (seen.has(key)) return;
        seen.add(key);
        const t = state.turmas.find(x => x.id === v.turmaId);
        const dia = getDiaSemanaFromDateStr(v.data);
        const diaCurto = (EXTENSO[dia] || dia).replace('-feira', '');
        linhas.push(`${diaCurto}, ${fmtBR(v.data)}, ${t?.horario || '?'}`);
      });
    const corpo = linhas.length ? linhas.join('\n\n') : '_Nenhuma vaga nos próximos 6 dias_';
    return `Oi gente! Seguem as vagas para reposição essa semana\n\n\n${corpo}\n\nSe puder vir me manda uma mensagem!`;
  }, [state]);

  const handleCopy = () => {
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    });
  };

  const handleCopyVagas = () => {
    navigator.clipboard.writeText(vagasWhatsApp).then(() => {
      setCopiedVagas(true);
      setTimeout(() => setCopiedVagas(false), 2500);
    });
  };

  const handleSnap = () => {
    dispatch({ type: 'SAVE_SNAPSHOT', label: snapLabel || fmtBRFull(todayStr()), conteudo: text });
    setSnapSaved(true);
    setSnapLabel('');
    setTimeout(() => setSnapSaved(false), 3000);
  };

  return (
    <div className="space-y-4">
      {/* Ações */}
      <div className="flex flex-wrap gap-2 items-center">
        <button onClick={handleCopy}
          className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${copied ? 'bg-green-600 text-white' : 'bg-gray-800 text-white hover:bg-gray-900'}`}>
          {copied ? '✓ Copiado!' : '📋 Copiar lista'}
        </button>
        <button onClick={handleCopyVagas}
          className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-1.5 ${copiedVagas ? 'bg-green-600 text-white' : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
          {copiedVagas ? '✓ Copiado!' : '🪑 Copiar vagas'}
        </button>

function PainelImportacao({ state, dispatch }) {
  const [text, setText] = useState('');
  const [preview, setPreview] = useState(null);
  const [imported, setImported] = useState(false);

  function parseImport(txt) {
    // Build turma lookup: "Seg 09h" -> turmaId
    const turmaByLabel = {};
    state.turmas.forEach(t => {
      turmaByLabel[`${ABREV[t.diaSemana]} ${t.horario}`] = t.id;
    });

    // Parse date like "30/03" or "30/03/26" -> "2026-03-30"
    const parseImportDate = (s, year = new Date().getFullYear()) => {
      const m = s.trim().match(/^(\d{1,2})\/(\d{2})(?:\/(\d{2,4}))?$/);
      if (!m) return null;
      const d = m[1].padStart(2,'0'), mo = m[2].padStart(2,'0');
      const y = m[3] ? (m[3].length === 2 ? '20'+m[3] : m[3]) : String(year);
      return `${y}-${mo}-${d}`;
    };

    const newFaltas = [];
    const newVagas = [];
    const lines = txt.split('\n');
    let section = null;
    let i = 0;

    while (i < lines.length) {
      const line = lines[i].trim().replace(/\*/g, '');
      if (line === 'FALTAS' || line === 'JÁ MARCADAS') { section = 'faltas'; i++; continue; }
      if (line === 'REPOSIÇÕES') { section = 'repos'; i++; continue; }
      if (line === 'VAGAS') { section = 'vagas'; i++; continue; }
      if (line === 'TURMAS' || line === 'OBSERVAÇÕES') { section = null; i++; continue; }

      if (section === 'faltas' && line && !line.startsWith('Falta:') && !line.startsWith('Férias:')) {
        // Name line: "Nome (Seg 09h)"
        const nameMatch = line.match(/^(.+?)\s+\((.+?)\)$/);
        if (nameMatch && i+1 < lines.length) {
          const nome = nameMatch[1].trim();
          const turmaLabel = nameMatch[2].trim();
          const turmaId = turmaByLabel[turmaLabel];
          const nextLine = lines[i+1].trim().replace(/\*/g,'');
          if (nextLine.startsWith('Falta:') && turmaId) {
            const datesPart = nextLine.replace('Falta:','').trim();
            const dateStrs = datesPart.split(/\s+e\s+|\s*,\s*/).map(s => parseImportDate(s)).filter(Boolean);
            if (dateStrs.length) {
              // Check if already exists
              const exists = state.faltas.some(f => f.alunoNome === nome && f.turmaId === turmaId && JSON.stringify([...f.datas].sort()) === JSON.stringify([...dateStrs].sort()));
              if (!exists) {
                const fId = genId('f');
                newFaltas.push({ id: fId, alunoNome: nome, turmaId, datas: dateStrs, status: 'pendente' });
                dateStrs.forEach(d => newVagas.push({ id: genId('v'), turmaId, data: d, faltaId: fId }));
              }
            }
          }
        }
      }

      if (section === 'vagas' && line && !line.startsWith('*')) {
        // "Quarta-feira, 29/04, 10h"
        const m = line.match(/^(.+?),\s*(\d+\/\d+(?:\/\d+)?),\s*(\d+h)(?:\s+\((\d+)\))?$/);
        if (m) {
          const dateStr = parseImportDate(m[2]);
          // find turma by horario and day
          const diaNome = Object.keys(EXTENSO).find(k => EXTENSO[k] === m[1].trim());
          if (dateStr && diaNome) {
            const turma = state.turmas.find(t => t.diaSemana === diaNome && t.horario === m[3]);
            if (turma && !state.vagas.some(v => v.turmaId === turma.id && v.data === dateStr)) {
              newVagas.push({ id: genId('v'), turmaId: turma.id, data: dateStr, faltaId: null });
            }
          }
        }
      }
      i++;
    }

    return { faltas: newFaltas, vagas: newVagas };
  }

  const handleParse = () => {
    const result = parseImport(text);
    setPreview(result);
  };

  const handleConfirm = () => {
    dispatch({ type: 'IMPORT_MERGE', data: preview });
    setImported(true);
    setPreview(null);
    setText('');
    setTimeout(() => setImported(false), 4000);
  };

  return (
    <div className="space-y-4">
      <h3 className="font-semibold text-gray-700">Importar lista do WhatsApp</h3>
      <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-700">
        Cole a lista no formato WhatsApp abaixo. O sistema vai identificar faltas e vagas novas e fazer merge com o estado atual (sem sobrescrever o que já existe).
      </div>

      <textarea
        value={text}
        onChange={e => { setText(e.target.value); setPreview(null); }}
        className="w-full h-64 border border-gray-300 rounded-lg p-3 text-sm font-mono"
        placeholder="Cole a lista aqui..."
      />

      <button onClick={handleParse} disabled={!text.trim()} className="w-full py-2 bg-gray-700 text-white rounded-lg font-medium hover:bg-gray-800 disabled:opacity-40">
        Analisar texto
      </button>

      {preview && (
        <div className="bg-gray-50 border border-gray-200 rounded-lg p-4 space-y-3">
          <div className="font-semibold text-gray-700">Resumo da importação:</div>
          <div className="text-sm space-y-1">
            <div><span className="font-medium">Novas faltas:</span> {preview.faltas.length}</div>
            {preview.faltas.map((f,i) => (
              <div key={i} className="ml-4 text-gray-600">• {f.alunoNome} ({getTurmaLabel(state.turmas, f.turmaId)}) — {fmtDatesText(f.datas)}</div>
            ))}
            <div className="mt-2"><span className="font-medium">Novas vagas:</span> {preview.vagas.filter(v => !v.faltaId).length} (independentes)</div>
          </div>
          {preview.faltas.length === 0 && preview.vagas.length === 0 && (
            <div className="text-gray-400 text-sm">Nenhum dado novo encontrado.</div>
          )}
          {(preview.faltas.length > 0 || preview.vagas.length > 0) && (
            <div className="flex gap-2">
              <button onClick={() => setPreview(null)} className="flex-1 py-2 border border-gray-300 rounded-lg text-sm">Cancelar</button>
              <button onClick={handleConfirm} className="flex-1 py-2 bg-blue-600 text-white rounded-lg font-medium text-sm hover:bg-blue-700">Confirmar importação</button>
            </div>
          )}
        </div>
      )}

      {imported && <div className="bg-green-50 text-green-700 rounded-lg px-4 py-3 text-sm font-medium">Dados importados com sucesso!</div>}
    </div>
  );
}

function App() {
  const [state, baseDispatch] = useReducer(reducer, null, loadState);

  const [professor, setProfessor] = useState(() => localStorage.getItem(PROFESSOR_KEY) || '');
  const [section, setSection]     = useState(2);
  const [seedDismissed, setSeedDismissed] = useState(false);
  const [syncStatus, setSyncStatus] = useState('conectando');
  const lastOwnSave = useRef(0);
  const saveTimer   = useRef(null);
  const initialised = useRef(false);

  // Wrapper que injeta o professor em toda ação
  const dispatch = useCallback((action) => {
    baseDispatch({ ...action, professor });
  }, [professor]);

  const handleSelectProfessor = (p) => {
    localStorage.setItem(PROFESSOR_KEY, p);
    setProfessor(p);
  };

  const handleChangeProfessor = () => {
    localStorage.removeItem(PROFESSOR_KEY);
    setProfessor('');
  };

  // 1. Carrega Firebase + abre SSE + roda CLEANUP após sync
  useEffect(function() {
    fetchFromFirebase()
      .then(function(data) {
        if (data && typeof data === 'object' && Object.keys(data).length > 0) {
          baseDispatch({ type: 'SYNC_FROM_FIREBASE', data: normalizeState(data) });
        } else {
          saveToFirebase(Object.assign({}, SEED, { _updatedAt: Date.now() })).catch(function(){});
        }
        initialised.current = true;
        baseDispatch({ type: 'CLEANUP' }); // roda após sync e após initialised=true, para que vagasExtras sejam salvas
        setSyncStatus('ok');
      })
      .catch(function() { setSyncStatus('erro'); });

    var es = new EventSource(DB_URL + '/state.json');
    es.addEventListener('put', function(e) {
      try {
        var parsed = JSON.parse(e.data);
        var data = parsed.data;
        if (!data || typeof data !== 'object') return;
        if (data._updatedAt && data._updatedAt <= lastOwnSave.current + 3000) return;
        baseDispatch({ type: 'SYNC_FROM_FIREBASE', data: normalizeState(data) });
      } catch(err) {}
    });
    es.onerror = function() { setSyncStatus('erro'); };
    es.onopen  = function() { setSyncStatus('ok'); };

    return function() { es.close(); };
  }, []);

  // 2. Salva no Firebase a cada mudança (debounce 600ms)
  useEffect(function() {
    if (!initialised.current) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function() {
      var ts = Date.now();
      lastOwnSave.current = ts;
      saveToFirebase(Object.assign({}, state, { _updatedAt: ts }))
        .then(function() { setSyncStatus('ok'); })
        .catch(function() { setSyncStatus('erro'); });
    }, 600);
  }, [state]);

  const nav = [
    { label: 'Turmas', icon: '👥' },
    { label: 'Faltas & Reposições', icon: '📋' },
    { label: 'Painel', icon: '📊' }

  const showSeedWarning = state._seedWarning && !seedDismissed;
  const syncLabel = { conectando: '🔄 conectando', ok: '🟢 sincronizado', erro: '🔴 sem conexão' };
  const profColors = PROFESSOR_COLORS[professor] || { bg:'bg-gray-100', text:'text-gray-700', dot:'bg-gray-400' };

  // Tela do aluno — detecta ?c=CODIGO na URL
  const urlCode = useMemo(() => new URLSearchParams(window.location.search).get('c'), []);
  const acessoAluno = useMemo(() => urlCode ? state.acessos.find(a => a.codigo === urlCode) : null, [urlCode, state.acessos]);
  if (urlCode) {
    // Aguarda o Firebase carregar antes de mostrar "inválido"
    if (syncStatus === 'conectando') {
      return (
        <div className="min-h-screen bg-amber-50 flex items-center justify-center p-6">
          <div className="text-gray-400 text-sm">Carregando...</div>
        </div>
      );

    if (!acessoAluno) {
      return (
        <div className="min-h-screen bg-amber-50 flex items-center justify-center p-6">
          <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-8 max-w-sm text-center space-y-3">
            <div className="text-4xl">🔒</div>
            <div className="font-bold text-gray-800">Link inválido</div>
            <div className="text-sm text-gray-500">O código de acesso não foi encontrado. Peça ao ateliê um novo link.</div>
          </div>
        </div>
      );
    }
    return <AlunoView state={state} dispatch={baseDispatch} acesso={acessoAluno} />;
  }

  // PIN guard — bloqueia acesso ao painel sem PIN verificado
  if (!pinOk) {
    return <PinModal onSuccess={() => setPinOk(true)} />;
  }

  // Tela de seleção de professor — renderização condicional DENTRO do return
  if (!professor) {
    return <ProfessorModal onSelect={handleSelectProfessor} />;
  }

  return (
    <div className="min-h-screen bg-gray-100">
      {/* Header */}
      <div className="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
        <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold text-gray-900">🎨 Escola Passarinho</h1>
            <p className="text-xs text-gray-400">Gestão de Faltas e Reposições</p>
          </div>
          <div className="flex items-center gap-3">
            {professor === 'Pedro' && (
              <button onClick={() => {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                a.href = url;
                a.download = `passarinho-backup-${d.toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
              }} className="hidden sm:flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors" title="Exportar backup JSON">
                ⬇ Backup

            <div className="text-right flex flex-col items-end gap-1">
              <button onClick={handleChangeProfessor}
                className={`flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-lg ${profColors.bg} ${profColors.text} hover:opacity-75 transition-opacity`}>
                <span className={`w-2 h-2 rounded-full ${profColors.dot}`}></span>

              </button>
              <div className={`text-xs ${syncStatus === 'ok' ? 'text-green-600' : syncStatus === 'erro' ? 'text-red-500' : 'text-gray-400'}`}>{syncLabel[syncStatus]}</div>
            </div>
          </div>
        </div>
        <div className="border-t border-gray-100">
          <div className="max-w-4xl mx-auto flex">
            {nav.map((n,i) => (

                <span className="text-xs">{n.label}</span>

      {/* Seed warning */}

          <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 flex justify-between items-start gap-3 fade-in">
            <div>
              <div className="font-semibold text-amber-800">⚠️ Cadastro de alunos incompleto</div>
              <div className="text-sm text-amber-700 mt-0.5">Complete as turmas na seção <strong>Turmas</strong>. Os alunos identificados pelo histórico foram carregados; os demais precisam ser adicionados manualmente.</div>
            </div>
            <button onClick={() => { setSeedDismissed(true); dispatch({type:'DISMISS_SEED_WARNING'}); }} className="text-amber-500 hover:text-amber-700 text-xl leading-none flex-shrink-0">×</button>
          </div>
        </div>
      )}

      {/* Content */}
      <div className="pb-8">
        {section === 0 && <SectionTurmas state={state} dispatch={dispatch} />}
        {section === 1 && <SectionFaltasReposicoes state={state} dispatch={dispatch} />}
        {section === 2 && <SectionPainel state={state} dispatch={dispatch} />}
      </div>
    </div>
  );
}
