<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================
   App 2 — Controle de Barro & Repasse (Ateliê Passarinho)
   - LÊ (apenas leitura) /state.json do app 1: turmas, férias
   - ESCREVE somente em /barro.json (path próprio, não toca no app 1)
   ============================================================ */

// ==================== FIREBASE ====================
const DB_URL = 'https://atelie-passarinho-default-rtdb.firebaseio.com';
const READ_STATE = DB_URL + '/state.json';       // app 1 (somente leitura)
const WRITE_PATH = DB_URL + '/barro.json';        // app 2 (leitura + escrita)
const DB_WRITE_SECRET = '109';

function loadState() {                             // turmas + ausencias do app 1
  return fetch(READ_STATE).then(r => r.json());
}
function loadBarro() {
  return fetch(WRITE_PATH).then(r => r.json());
}
function saveBarro(data) {
  return fetch(WRITE_PATH, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...data, _auth: DB_WRITE_SECRET })
  });
}

// ==================== CONSTANTES DE NEGÓCIO ====================
const PIN = '109';
const MENSALIDADE_PADRAO = 465;          // R$ — padrão, editável por aluno/mês
const VALOR_BARRO_KG = 10;               // R$/Kg — fixo (custo de material)
const PCT_PEDRO_PADRAO = 0.5;            // 50% da mensalidade fica com Pedro (editável)

// Barro e extras: split configurável (hoje 0% Pedro / 100% Ateliê).

const EXTRA_CATEGORIAS = [               // pctPedro configurável por categoria
  { key: 'queima_extra',    label: 'Queima extra',    pctPedro: 0 },
  { key: 'terceira_queima', label: 'Terceira queima', pctPedro: 0 },
  { key: 'peca_carol',      label: 'Peça Carol',      pctPedro: 0 },
];
const CAT_LABEL = Object.fromEntries(EXTRA_CATEGORIAS.map(c => [c.key, c.label]));
const CAT_PCT   = Object.fromEntries(EXTRA_CATEGORIAS.map(c => [c.key, c.pctPedro]));

// ==================== PROFESSORES / TURMAS / RECEBEDORES ====================
const PROFESSORES_LOGIN = ['Pedro', 'Gláucio', 'Laura', 'Carol'];

// Turmas co-lecionadas por Carol + Laura (100% do pagamento vai p/ Carol)
const TURMAS_COMPARTILHADAS = ['seg-09h', 'seg-11h', 'sab-09h', 'sab-11h'];

// Turmas que cada professor VÊ ao logar

// ==================== HELPERS ====================
const DIAS_ORDER = ['segunda','terça','quarta','quinta','sexta','sábado'];
const ABREV = { segunda:'Seg', terça:'Ter', quarta:'Qua', quinta:'Qui', sexta:'Sex', sábado:'Sáb' };
const EXTENSO_DIA = { domingo:'Domingo', segunda:'Segunda', terça:'Terça', quarta:'Quarta', quinta:'Quinta', sexta:'Sexta', sábado:'Sábado' };
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const n2 = v => (Number(v) || 0);
// Formato BR com 2 casas: 465 -> "465,00", 232.5 -> "232,50", 1234.5 -> "1.234,50"
const fmt = v => n2(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function turmaLabel(t) {
  if (!t) return '';
  if (!t.diaSemana || !t.horario) return t.observacao || t.id;
  return `${ABREV[t.diaSemana] || t.diaSemana} ${String(t.horario).replace('h','h')}`;
}
function sortTurmas(turmas) {
  return [...turmas].sort((a, b) => {
    const da = DIAS_ORDER.indexOf(a.diaSemana), db = DIAS_ORDER.indexOf(b.diaSemana);
    if (da !== db) return (da < 0 ? 99 : da) - (db < 0 ? 99 : db);
    return String(a.horario || '').localeCompare(String(b.horario || ''));
  });
}
function mesLabel(mesAno) {
  if (!mesAno) return '';
  const [y, m] = mesAno.split('-');
  return `${MESES[Number(m) - 1]} ${y}`;
}
function mesAnoOptions() {
  // mês atual + 12 anteriores
  const out = [];
  const now = new Date();
  for (let i = 0; i < 13; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  return out;
}
function currentMesAno() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dateToDia(dateStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const wd = new Date(y, mo - 1, d).getDay(); // 0=domingo
  return ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'][wd];
}
function mesAnoDe(dateStr) { return dateStr.slice(0, 7); }
function fmtDataBR(dateStr) { const [y, m, d] = dateStr.split('-'); return `${d}/${m}`; }
// Kg com 1 casa: 0.8 -> "0,8"
const fmt1 = v => n2(v).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

// Cálculos por aluno ------------------------------------------------------
const AULA_EXTRA_VALOR = 120; // R$ por aula extra (reposição sem crédito, vem do app 1)
function barroDiasTotal(a) { return Object.values(a.barroDias || {}).reduce((s, v) => s + n2(v), 0); }
function reposDiasKg(a) { return Object.values(a.reposDias || {}).reduce((s, r) => s + (r && !r.faltou ? n2(r.kg) : 0), 0); }
function barroKgTotal(a) { return n2(a.barroKg) + barroDiasTotal(a) + reposDiasKg(a); } // manual + aula + reposição
function barroReais(a) { return barroKgTotal(a) * VALOR_BARRO_KG; }
function extrasTotal(a) { return (a.extras || []).reduce((s, e) => s + n2(e.valor), 0); }
function aulaExtraValor(a) { return n2(a.aulaExtra); } // preenchido em buildMesAlunos a partir das reposições do app 1
function totalAluno(a) { return n2(a.mensalidade) + barroReais(a) + extrasTotal(a) + aulaExtraValor(a); }
function repassePedroAluno(a) {
  let p = n2(a.mensalidade) * n2(a.pctPedro);
  p += barroReais(a) * PCT_PEDRO_BARRO;
  (a.extras || []).forEach(e => { p += n2(e.valor) * (CAT_PCT[e.categoria] ?? 0); });
  return p;
}
function repasseAtelieAluno(a) { return totalAluno(a) - repassePedroAluno(a); }

// Consumo pessoal de Pedro (descontado do repasse dele) -------------------
function pessoalTotal(mes) {
  const p = (mes && mes.pessoal) || {};
  return n2(p.barroKg) * VALOR_BARRO_KG + n2(p.queimaKg) * n2(p.queimaValorKg);
}

// ==================== REPASSE POR PROFESSOR ====================
const PROF_KEY = { 'Pedro': 'pedro', 'Laura': 'laura', 'Carol': 'carol', 'Gláucio': 'glaucio' };
// Fração da mensalidade que é ganho de aula do professor: 50% normal, 25% em turma compartilhada
function fracAula(turmaId) { return TURMAS_COMPARTILHADAS.includes(turmaId) ? 0.25 : 0.5; }
// Ganho de aula do professor logado para este aluno
function aulaAluno(a) { return n2(a.mensalidade) * fracAula(a.turmaId); }
// "Não é meu" — vai p/ ateliê (e co-professor), na visão do professor logado
function atelieViewAluno(a) { return totalAluno(a) - aulaAluno(a); }

// Fechamento do mês para um professor, sobre suas turmas
function fechamentoProf(prof, turmasVis, mesData) {
  const pk = PROF_KEY[prof] || '';
  let arrecadado = 0, ganho = 0, aPagar = 0, aReceber = 0, deveCoprof = 0;
  turmasVis.forEach(t => {
    const rec = TURMA_RECEBEDOR[t.id];
    const shared = TURMAS_COMPARTILHADAS.includes(t.id);
    (mesData.alunos[t.id] || []).forEach(a => {
      const aula = aulaAluno(a);
      arrecadado += totalAluno(a);
      ganho += aula;
      if (rec === pk) {
        // professor logado RECEBEU o dinheiro na conta
        if (pk === 'carol') deveCoprof += shared ? n2(a.mensalidade) * 0.25 : 0; // Carol deve à co-profa (Laura)
        else aPagar += totalAluno(a) - aula;                                     // deve repassar ao ateliê (Carol)
      } else {
        aReceber += aula; // Carol recebeu; o ateliê deve o ganho de aula ao professor
      }
    });
  });
  const pessoal = prof === 'Pedro' ? pessoalTotal(mesData) : 0;
  const netRepasse = aPagar - aReceber - pessoal; // >0: paga à Carol; <0: recebe da Carol
  return { arrecadado, ganho, aPagar, aReceber, deveCoprof, pessoal, netRepasse };
}
// Ganho de aula de um professor num mês salvo (para evolução)
function ganhoMesProf(prof, lc) {
  const permit = new Set(PROFESSOR_TURMAS[prof] || []);
  return Object.entries((lc && lc.alunos) || {})
    .filter(([tid]) => permit.has(tid))
    .flatMap(([, arr]) => arr)
    .reduce((s, a) => s + aulaAluno(a), 0);
}

// ==================== MONTAGEM DO MÊS ====================
// Junta o roster atual das turmas (app 1) com o que já foi salvo (app 2),
// preservando o histórico. Aluno de férias no mês → meia mensalidade (default).
function buildMesAlunos(turmas, ausencias, saved, mesAno, reposicoes) {
  // Férias casadas por NOME+mês (a ausência pode estar registrada em outra turma do aluno)
  const feriasNomes = new Set(
    (ausencias || [])
      .filter(a => a.tipo === 'ferias' && a.mesAno === mesAno)
      .map(a => (a.alunoNome || '').trim().toLowerCase())
  );
  // Aulas extras do mês por aluno (reposição sem crédito, tipo 'aula_extra' no app 1)
  const aulaExtraCount = {};
  (reposicoes || [])
    .filter(r => r.tipo === 'aula_extra' && (r.dataReposicao || '').slice(0, 7) === mesAno)
    .forEach(r => { const k = (r.alunoNome || '').trim().toLowerCase(); aulaExtraCount[k] = (aulaExtraCount[k] || 0) + 1; });
  const ehFerias = (nome) => feriasNomes.has((nome || '').trim().toLowerCase());
  const aulaExtraDe = (nome) => (aulaExtraCount[(nome || '').trim().toLowerCase()] || 0) * AULA_EXTRA_VALOR;

  const savedByKey = {};
  (saved || []).forEach(a => { savedByKey[`${a.turmaId}|${a.alunoNome}`] = a; });

  const result = {};
  turmas.forEach(t => {
    const list = [];
    const seen = new Set();
    // alunos do roster atual da turma
    (t.alunos || []).forEach(nome => {
      const key = `${t.id}|${nome}`;
      seen.add(key);
      const isFerias = ehFerias(nome);
      const base = { ...defaultAluno(t.id, nome, isFerias), ...(savedByKey[key] || {}) };
      base.ferias = isFerias;
      // Férias → mensalidade 50% (a menos que tenha sido definido um valor custom diferente do padrão)
      if (isFerias && (savedByKey[key]?.mensalidade == null || savedByKey[key]?.mensalidade === MENSALIDADE_PADRAO))
        base.mensalidade = MENSALIDADE_PADRAO / 2;
      base.aulaExtra = aulaExtraDe(nome);
      list.push(base);
    });
    // alunos que saíram do roster: só preserva quem tem lançamento real no mês (barro/extra/obs)
    (saved || []).filter(a => a.turmaId === t.id && !seen.has(`${t.id}|${a.alunoNome}`) && temLancamento(a))
      .forEach(a => list.push({ ...defaultAluno(t.id, a.alunoNome, false), ...a, aulaExtra: aulaExtraDe(a.alunoNome), _removido: true }));
    list.forEach(migraReposicaoParaBarro);
    list.sort((a, b) => a.alunoNome.localeCompare(b.alunoNome, 'pt-BR', { sensitivity: 'base' }));
    if (list.length) result[t.id] = list;
  });
  return result;
}
// Tem lançamento de verdade no mês? (barro, reposição, extra, aula extra ou observação)
function temLancamento(a) {
  return n2(a.barroKg) > 0
    || Object.values(a.barroDias || {}).some(v => n2(v) > 0)
    || Object.keys(a.reposDias || {}).length > 0
    || (a.extras || []).some(e => n2(e.valor) > 0)
    || n2(a.aulaExtra) > 0
    || !!(a.obs && String(a.obs).trim());
}

// Migração: extras antigos de "reposição" viram barro por dia (reposição conta como barro)
function migraReposicaoParaBarro(al) {
  if (!al.extras || !al.extras.some(e => e.categoria === 'reposicao')) return;
  const dias = { ...(al.barroDias || {}) };
  al.extras.filter(e => e.categoria === 'reposicao').forEach(e => {
    const dia = e.dia || 'repo';
    dias[dia] = n2(dias[dia]) + n2(e.valor) / VALOR_BARRO_KG;
  });
  al.barroDias = dias;
  al.extras = al.extras.filter(e => e.categoria !== 'reposicao');
}
function defaultAluno(turmaId, nome, isFerias) {
  return {
    turmaId, alunoNome: nome,
    mensalidade: isFerias ? MENSALIDADE_PADRAO / 2 : MENSALIDADE_PADRAO,
    pctPedro: PCT_PEDRO_PADRAO,
    ferias: !!isFerias,
    barroKg: 0,          // barro manual (ajuste no "Barro do mês")
    barroDias: {},       // barro por aula (Barro rápido): { 'YYYY-MM-DD': kg }
    reposDias: {},       // barro de reposição: { 'YYYY-MM-DD': { kg, faltou } }
    extras: [],          // { id, categoria, valor, dia? }
    recebidoPor: null,   // override de quem recebeu o pagamento (null = recebedor da turma)
    obs: '',
  };
}

// ==================== MENSAGEM WHATSAPP ====================
function buildMensagem(alunosTurma, turmaId) {
  const linhas = alunosTurma
    .filter(a => totalAluno(a) > 0)
    .map(a => {
      const partes = [`${fmt(a.mensalidade)} (mensalidade)`, `${fmt(barroReais(a))} (barro)`];
      (a.extras || []).forEach(e => {
        if (n2(e.valor) > 0) partes.push(`${fmt(e.valor)} (${CAT_LABEL[e.categoria] || 'extra'})`);
      });
      if (aulaExtraValor(a) > 0) partes.push(`${fmt(aulaExtraValor(a))} (aula extra)`);
      return `${a.alunoNome}: ${partes.join(' + ')} = ${fmt(totalAluno(a))}`;
    });
  const recebedor = TURMA_RECEBEDOR[turmaId] || 'pedro';
  const dados = DADOS_BANCARIOS[recebedor] || RECEBEDOR_PENDENTE;
  return `Olá, turma!
Tudo bem?

Segue abaixo relação de barro utilizado por cada aluno e o valor final a ser pago este mês:

${linhas.join('\n\n')}

Valor do barro/kg: ${fmt(VALOR_BARRO_KG)}

Dados para transferência:

${dados}

Lembrando que o pagamento deverá ser feito até dia 7.

Peço para que enviem o comprovante de pagamento por aqui para que possamos fazer o controle.

Obrigado! ❤️`;
}

function NumInput({ value, onChange, className = '', prefix, suffix, step = 'any', ...rest }) {
  return (
    <div className={`inline-flex items-center rounded-lg border border-gray-300 bg-white overflow-hidden ${className}`}>
      {prefix && <span className="px-2 text-gray-400 text-sm">{prefix}</span>}
      <input
        type="number" inputMode="decimal" step={step}
        className="w-full px-2 py-1.5 text-right outline-none"
        value={value === 0 ? '' : value}
        placeholder="0"
        onChange={e => onChange(e.target.value === '' ? 0 : parseFloat(e.target.value))}
        {...rest}
      />
      {suffix && <span className="px-2 text-gray-400 text-sm">{suffix}</span>}
    </div>
  );
}

// ==================== APP ====================
function App() {
  const [authed, setAuthed] = useState(sessionStorage.getItem('barro_auth') === '1');
  const [prof, setProf] = useState(sessionStorage.getItem('barro_prof') || null);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);

  const [state, setState] = useState(null);       // app 1: { turmas, ausencias }
  const [barro, setBarro] = useState({ lancamentos: {} });
  const [mesAno, setMesAno] = useState(currentMesAno());
  const [tab, setTab] = useState('menu');
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const dirty = useRef(false);
  const savingRef = useRef(false);
  const myStampRef = useRef(0);   // carimbo do nosso último save (p/ ignorar o eco do SSE)

  // Carrega dados
  useEffect(() => {
    if (!authed) return;
    Promise.all([loadState(), loadBarro()])
      .then(([st, br]) => {
        setState({
          turmas: (st && st.turmas) || [],
          ausencias: (st && st.ausencias) || [],
          faltas: (st && st.faltas) || [],
          reposicoes: (st && st.reposicoes) || [],
        });
        setBarro(br && typeof br === 'object' ? { lancamentos: br.lancamentos || {} } : { lancamentos: {} });
        setLoading(false);
      })
      .catch(e => { setErro(String(e)); setLoading(false); });
  }, [authed]);

  const turmas = useMemo(() => state ? sortTurmas(state.turmas) : [], [state]);

  // Turmas visíveis para o professor logado
  const turmasVisiveis = useMemo(() => {
    if (!prof) return turmas;
    const permitidas = PROFESSOR_TURMAS[prof] || [];
    return turmas.filter(t => permitidas.includes(t.id));
  }, [turmas, prof]);

  // Lançamento do mês atualmente selecionado (materializado)
  const lanc = barro.lancamentos[mesAno];
  const mesData = useMemo(() => {
    if (!state) return null;
    const savedAlunos = lanc ? Object.values(lanc.alunos || {}).flat() : [];
    return {
      alunos: buildMesAlunos(turmas, state.ausencias, savedAlunos, mesAno, state.reposicoes),
      pessoal: (lanc && lanc.pessoal) || { barroKg: 0, queimaKg: 0, queimaValorKg: 0 },
      obsGeral: (lanc && lanc.obsGeral) || '',
    };
  }, [state, turmas, lanc, mesAno]);

  // ---- mutadores (gravam no estado local; salvar envia p/ Firebase) ----
  const updateMes = useCallback((mutator) => {
    setBarro(prev => {
      const cur = prev.lancamentos[mesAno] || { alunos: {}, pessoal: { barroKg: 0, queimaKg: 0, queimaValorKg: 0 }, obsGeral: '' };
      // materializa o roster atual antes de mutar (garante que edições persistam)
      const materialAlunos = mesData ? mesData.alunos : (cur.alunos || {});
      const base = { alunos: JSON.parse(JSON.stringify(materialAlunos)), pessoal: { ...(cur.pessoal || {}) }, obsGeral: cur.obsGeral || '' };
      const next = mutator(base) || base;
      dirty.current = true;
      return { ...prev, lancamentos: { ...prev.lancamentos, [mesAno]: next } };
    });
  }, [mesAno, mesData]);

  const setAluno = useCallback((turmaId, idx, patch) => {
    updateMes(m => { Object.assign(m.alunos[turmaId][idx], patch); return m; });
  }, [updateMes]);

  // Edita um aluno por turma+nome (usado no fluxo "Lançar barro")
  const patchAluno = useCallback((turmaId, nome, fn) => {
    updateMes(m => {
      const al = (m.alunos[turmaId] || []).find(a => a.alunoNome === nome);
      if (al) fn(al);
      return m;
    });
  }, [updateMes]);

  const doSave = useCallback(() => {
    setSaving(true); savingRef.current = true;
    // garante materialização do mês corrente
    updateMes(m => m);
    setTimeout(() => {
      setBarro(prev => {
        const stamp = Date.now();
        myStampRef.current = stamp;
        saveBarro({ ...prev, _updatedAt: stamp })
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status + ' — verifique as regras de escrita do Firebase p/ o path /barro');
            dirty.current = false;
            setSavedAt(new Date());
            setErro(null);
          })
          .catch(e => setErro('Falha ao salvar: ' + e.message))
          .finally(() => { setSaving(false); savingRef.current = false; });
        return prev;
      });
    }, 50);
  }, [updateMes]);

  // Auto-save: grava sozinho ~1,2s após a última alteração
  useEffect(() => {
    if (!dirty.current) return;
    const t = setTimeout(() => { if (dirty.current && !savingRef.current) doSave(); }, 1200);
    return () => clearTimeout(t);
  }, [barro, doSave]);

  // Tempo real (SSE): reflete na hora mudanças do app 1 e saves de outros aparelhos no app 2
  const [sseKey, setSseKey] = useState(0);
  const aplicaState = useCallback((st) => st && setState({
    turmas: st.turmas || [], ausencias: st.ausencias || [],
    faltas: st.faltas || [], reposicoes: st.reposicoes || [],
  }), []);
  const aplicaBarro = useCallback((br) => {
    if (dirty.current || savingRef.current) return;                              // não sobrescrever edição em andamento
    if (br && br._updatedAt && br._updatedAt === myStampRef.current) return;     // eco do nosso próprio save
    setBarro(br && typeof br === 'object' ? { lancamentos: br.lancamentos || {} } : { lancamentos: {} });
  }, []);

  useEffect(() => {
    if (!authed) return;
    const es1 = new EventSource(DB_URL + '/state.json');
    const h1 = (e) => {
      try {
        const { path, data } = JSON.parse(e.data);
        if (path === '/') aplicaState(data);
        else loadState().then(aplicaState).catch(() => {});
      } catch (_) {}
    };
    es1.addEventListener('put', h1); es1.addEventListener('patch', h1);

    const es2 = new EventSource(WRITE_PATH);
    const h2 = (e) => {
      try {
        const { path, data } = JSON.parse(e.data);
        if (path === '/') aplicaBarro(data);
        else loadBarro().then(aplicaBarro).catch(() => {});
      } catch (_) {}
    };
    es2.addEventListener('put', h2); es2.addEventListener('patch', h2);
    return () => { es1.close(); es2.close(); };
  }, [authed, sseKey, aplicaState, aplicaBarro]);

  // iOS/Safari mata SSE em segundo plano: ao voltar pro app, re-busca tudo e reabre as conexões
  useEffect(() => {
    if (!authed) return;
    let last = 0;
    const revive = () => {
      if (document.visibilityState === 'hidden') return;
      const now = Date.now(); if (now - last < 1500) return; last = now;
      loadState().then(aplicaState).catch(() => {});
      loadBarro().then(aplicaBarro).catch(() => {});
      setSseKey(k => k + 1); // reabre o SSE
    };
    document.addEventListener('visibilitychange', revive);
    window.addEventListener('focus', revive);
    window.addEventListener('pageshow', revive);
    return () => {
      document.removeEventListener('visibilitychange', revive);
      window.removeEventListener('focus', revive);
      window.removeEventListener('pageshow', revive);
    };
  }, [authed, aplicaState, aplicaBarro]);

  // Aviso do navegador se fechar com alteração ainda não salva
  useEffect(() => {
    const h = (e) => { if (dirty.current) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, []);

  // ---------------- AUTH GATE ----------------
  if (!authed) return <AuthGate onOk={() => { sessionStorage.setItem('barro_auth', '1'); setAuthed(true); }} />;
  if (!prof) return <ProfPicker onPick={p => { sessionStorage.setItem('barro_prof', p); setProf(p); }} />;
  if (loading) return (
    <Centered>
      <div className="text-center">
        <img src={document.getElementById('favicon').href} alt="" className="w-16 h-16 rounded-2xl mx-auto mb-3 animate-pulse" />
        <div className="text-gray-400 text-sm">Carregando…</div>
      </div>
    </Centered>
  );
  if (erro && !state) return (
    <Centered>
      <div className="text-center max-w-md">
        <div className="text-red-600 text-sm mb-4">{erro}</div>
        <button onClick={() => location.reload()} className="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-6 py-2.5 rounded-xl">
          Tentar de novo
        </button>
      </div>
    </Centered>
  );

  const trocarProf = () => { sessionStorage.removeItem('barro_prof'); setProf(null); };

  // ---- MENU INICIAL ----
  if (tab === 'menu')
    return (<>
      <MenuScreen prof={prof} mesAno={mesAno} setMesAno={setMesAno} onPick={setTab} onTrocarProf={trocarProf} erro={erro}
        turmasVisiveis={turmasVisiveis} mesData={mesData} />
      <SaveChip saving={saving} erro={erro} onRetry={doSave} />
    </>);

  // ---- LANÇAR BARRO (tela própria: rápido/completo → turma → aluno → stepper) ----
  if (tab === 'lancar')
    return (<>
      <LancarBarro prof={prof} turmasVisiveis={turmasVisiveis} mesData={mesData} state={state}
        patchAluno={patchAluno} doSave={doSave} saving={saving} savedAt={savedAt} onVoltar={() => setTab('menu')} />
      <SaveChip saving={saving} erro={erro} onRetry={doSave} />
    </>);

  const TITULOS = { ajustes: 'Ajustes do aluno', mensagem: 'Mensagem', razao: 'Razão', stats: 'Estatísticas' };

  return (
    <div className="max-w-3xl mx-auto p-3 sm:p-4 pb-12">
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <button onClick={() => setTab('menu')} className="flex items-center gap-2 text-left">
          <span className="text-amber-500 text-xl">‹</span>
          <div>
            <div className="font-bold text-gray-800">{TITULOS[tab]}</div>
            <div className="text-xs text-gray-400">{prof} · menu</div>
          </div>
        </button>
        <select value={mesAno} onChange={e => setMesAno(e.target.value)}
                className="border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm font-medium">
          {mesAnoOptions().map(m => <option key={m} value={m}>{mesLabel(m)}</option>)}
        </select>
      </div>

      {erro && <div className="mb-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2">{erro}</div>}

      {tab === 'ajustes'  && <Ajustes turmas={turmasVisiveis} mesData={mesData} setAluno={setAluno} updateMes={updateMes} prof={prof} />}
      {tab === 'mensagem'   && <Mensagem turmas={turmasVisiveis} mesData={mesData} />}
      {tab === 'razao'      && <Razao turmas={turmasVisiveis} mesData={mesData} mesAno={mesAno} prof={prof} />}
      {tab === 'stats'      && <Stats turmas={turmasVisiveis} barro={barro} state={state} mesAno={mesAno} mesData={mesData} prof={prof} />}

      <SaveChip saving={saving} erro={erro} onRetry={doSave} />
    </div>
  );
}

// Teclado numérico próprio (não usa o teclado do sistema). Mostra o valor já dividido por 10.
function KgKeypad({ kg, onChange }) {
  const [digits, setDigits] = useState(kg ? String(Math.round(kg * 10)) : '');
  const aplica = (dg) => { setDigits(dg); onChange(dg === '' ? 0 : parseInt(dg, 10) / 10, dg !== ''); };
  const press = (d) => aplica((digits + d).replace(/^0+(?=\d)/, '').slice(0, 4));
  const back = () => aplica(digits.slice(0, -1));
  const val = digits === '' ? 0 : parseInt(digits, 10) / 10;
  const Key = ({ children, onClick, cls = '' }) => (
    <button onClick={onClick} className={`py-4 rounded-xl bg-gray-100 active:bg-gray-300 text-2xl font-semibold text-gray-800 ${cls}`}>{children}</button>
  );
  return (
    <div>
      <div className="text-center text-6xl font-bold text-gray-800 tabular-nums">
        {fmt1(val)}<span className="text-2xl text-gray-400 ml-2">Kg</span>
      </div>
      <div className="grid grid-cols-3 gap-2 mt-4 max-w-xs mx-auto">
        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => <Key key={d} onClick={() => press(String(d))}>{d}</Key>)}
        <Key onClick={() => aplica('')} cls="!text-sm !text-gray-500 !font-medium">limpar</Key>
        <Key onClick={() => press('0')}>0</Key>
        <Key onClick={back} cls="!text-xl !text-gray-500">⌫</Key>
      </div>
    </div>
  );
}

  const soma = vals.reduce((s, v) => s + (parseFloat(String(v).replace(',', '.')) || 0), 0);

          <div className="text-center mt-3">
            <button onClick={() => setCalc(c => !c)} className="text-xs text-amber-600 font-medium">🧮 {calc ? 'fechar' : 'calcular (somar aulas)'}</button>

                    className="flex-1 border border-gray-300 rounded-lg px-2 py-1.5 text-sm text-right outline-none" />
                  <span className="text-xs text-gray-400">Kg</span>
                  <button onClick={() => setVals(vs => vs.filter((_, j) => j !== i))} className="text-gray-300 px-1">✕</button>

              ))}
              <div className="flex items-center justify-between">

function LancarBarro({ prof, turmasVisiveis, mesData, state, patchAluno, doSave, saving, savedAt, onVoltar }) {
  const [modo, setModo] = useState(null);        // 'rapido' | 'completo'
  const [date, setDate] = useState(hojeISO());
  const [selTurma, setSelTurma] = useState(null);
  const [stepStart, setStepStart] = useState(null);
  const [pos, setPos] = useState(0);
  const dia = dateToDia(date);

  const turmasDisp = useMemo(() => {
    if (modo === 'rapido') return turmasVisiveis.filter(t => t.diaSemana === dia && (mesData.alunos[t.id] || []).length);
    return turmasVisiveis.filter(t => (mesData.alunos[t.id] || []).length);
  }, [modo, turmasVisiveis, dia, mesData]);

  const alunos = useMemo(() => {
    if (!selTurma) return [];
    const roster = mesData.alunos[selTurma] || [];
    if (modo === 'completo')
      return roster.map(a => ({ nome: a.alunoNome, isRepo: false, turmaId: selTurma }))
        .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));
    const faltas = state.faltas || [], reposicoes = state.reposicoes || [];
    const faltosos = new Set(faltas.filter(f => f.turmaId === selTurma && (f.datas || []).includes(date)).map(f => f.alunoNome));
    const out = roster.filter(a => !faltosos.has(a.alunoNome)).map(a => ({ nome: a.alunoNome, isRepo: false, turmaId: selTurma }));
    reposicoes.filter(r => r.turmaReposicaoId === selTurma && r.dataReposicao === date)
      .forEach(r => out.push({ nome: r.alunoNome, isRepo: true, turmaId: r.turmaOrigemId }));
    const seen = new Set();
    return out.filter(p => { const k = p.turmaId + '|' + p.nome; return seen.has(k) ? false : (seen.add(k), true); })
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' }));
  }, [selTurma, modo, mesData, state, date]);

  // entrada atual do participante: {kg, faltou} ou undefined (não lançado)
  const entryDe = (p) => {
    const al = (mesData.alunos[p.turmaId] || []).find(a => a.alunoNome === p.nome);
    if (!al) return undefined;
    if (p.isRepo) return (al.reposDias || {})[date];
    if (modo === 'completo') return { kg: barroKgTotal(al), faltou: false }; // total inclui o rápido
    return (date in (al.barroDias || {})) ? { kg: n2(al.barroDias[date]), faltou: false } : undefined;
  };
  const kgDe = (p) => { const e = entryDe(p); return e && !e.faltou ? n2(e.kg) : 0; };
  const faltouDe = (p) => { const e = entryDe(p); return !!(e && e.faltou); };
  const lancadoDe = (p) => entryDe(p) !== undefined;

  const setKg = (p, kg, hasInput) => patchAluno(p.turmaId, p.nome, al => {
    if (p.isRepo) {
      al.reposDias = { ...(al.reposDias || {}) };
      if (hasInput) al.reposDias[date] = { kg, faltou: false }; else delete al.reposDias[date];
    } else if (modo === 'completo') {
      const outros = barroDiasTotal(al) + reposDiasKg(al);
      al.barroKg = Math.max(0, kg - outros); // usuário digita o TOTAL; guarda só o ajuste manual
    } else {
      al.barroDias = { ...(al.barroDias || {}) };
      if (hasInput) al.barroDias[date] = kg; else delete al.barroDias[date]; // 0 é lançamento válido
    }
  });
  const setFaltou = (p) => patchAluno(p.turmaId, p.nome, al => {
    al.reposDias = { ...(al.reposDias || {}), [date]: { kg: 0, faltou: true } };
  });
  const extrasDe = (p) => { const al = (mesData.alunos[p.turmaId] || []).find(a => a.alunoNome === p.nome); return (al && al.extras) || []; };
  const setExtras = (p, extras) => patchAluno(p.turmaId, p.nome, al => { al.extras = extras; });

  // Progresso de lançamento por turma (mostrado nos botões)
  const progresso = (t) => {
    const roster = mesData.alunos[t.id] || [];
    if (modo === 'rapido') {
      const faltosos = new Set((state.faltas || []).filter(f => f.turmaId === t.id && (f.datas || []).includes(date)).map(f => f.alunoNome));
      const reg = roster.filter(a => !faltosos.has(a.alunoNome));
      const repos = (state.reposicoes || []).filter(r => r.turmaReposicaoId === t.id && r.dataReposicao === date);
      const doneReg = reg.filter(a => date in (a.barroDias || {})).length;
      const doneRepo = repos.filter(r => { const al = (mesData.alunos[r.turmaOrigemId] || []).find(a => a.alunoNome === r.alunoNome); return al && (al.reposDias || {})[date]; }).length;
      return { done: doneReg + doneRepo, tot: reg.length + repos.length };
    }
    return { done: roster.filter(a => barroKgTotal(a) > 0).length, tot: roster.length };
  };

  const sairStepper = () => { setStepStart(null); doSave(); };

  const header = (titulo, onBack) => (
    <div className="flex items-center justify-between mb-4">
      <button onClick={onBack} className="flex items-center gap-2 text-left">
        <span className="text-amber-500 text-xl">‹</span>
        <div><div className="font-bold text-gray-800">{titulo}</div><div className="text-xs text-gray-400">{prof}</div></div>
      </button>
      <span className="text-xs text-gray-400">{saving ? 'Salvando…' : savedAt ? `Salvo ${savedAt.toLocaleTimeString('pt-BR')}` : ''}</span>
    </div>
  );

  // 1) escolher modo
  if (!modo) return (
    <div className="max-w-lg mx-auto p-4">
      {header('🏺 Lançar barro', onVoltar)}
      <div className="space-y-3">
        <button onClick={() => setModo('rapido')} className="w-full flex items-center gap-4 bg-white rounded-2xl shadow-sm hover:shadow-md p-5 text-left">
          <div className="bg-amber-500 text-white text-2xl w-14 h-14 rounded-xl flex items-center justify-center">⚡</div>
          <div><div className="font-bold text-gray-800">Rápido</div><div className="text-xs text-gray-400">Barro da aula do dia, aluno por aluno</div></div>
        </button>
        <button onClick={() => setModo('completo')} className="w-full flex items-center gap-4 bg-white rounded-2xl shadow-sm hover:shadow-md p-5 text-left">
          <div className="bg-orange-400 text-white text-2xl w-14 h-14 rounded-xl flex items-center justify-center">📋</div>
          <div><div className="font-bold text-gray-800">Completo</div><div className="text-xs text-gray-400">Barro total do mês (com calculadora)</div></div>
        </button>
      </div>
    </div>
  );

  // 2) escolher turma
  if (!selTurma) return (
    <div className="max-w-lg mx-auto p-4">
      {header(modo === 'rapido' ? '⚡ Barro rápido' : '📋 Barro completo', () => setModo(null))}
      {modo === 'rapido' && (
        <div className="flex items-center gap-2 mb-4">
          <input type="date" value={date} onChange={e => setDate(e.target.value)}
            className="border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm font-medium" />
          <span className="text-sm text-gray-500">{EXTENSO_DIA[dia] || dia}</span>
        </div>
      )}
      <div className="text-xs text-gray-400 mb-2">Escolha a turma:</div>
      {turmasDisp.length === 0 ? (
        <div className="text-center text-gray-400 text-sm py-10">
          {modo === 'rapido' ? 'Nenhuma aula sua neste dia. Troque a data.' : 'Nenhuma turma com alunos.'}
        </div>
      ) : (
        <div className="grid grid-cols-2 gap-3">
          {turmasDisp.map(t => {
            const pr = progresso(t);
            const cheio = pr.tot > 0 && pr.done >= pr.tot;
            return (
              <button key={t.id} onClick={() => setSelTurma(t.id)}
                className="bg-white rounded-2xl shadow-sm hover:shadow-md p-4 text-center font-semibold text-gray-800">
                {turmaLabel(t)}
                <div className={`text-xs font-normal ${cheio ? 'text-emerald-600' : 'text-gray-400'}`}>
                  {cheio ? '✓ todos lançados' : `${pr.done}/${pr.tot} lançados`}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );

  const turmaSel = turmasVisiveis.find(t => t.id === selTurma);

  // 3) escolher aluno (botões)
  if (stepStart == null) return (
    <div className="max-w-lg mx-auto p-4">
      {header(turmaLabel(turmaSel), () => setSelTurma(null))}
      {modo === 'rapido' && <div className="text-xs text-gray-400 mb-3">{fmtDataBR(date)} · {EXTENSO_DIA[dia]} · toque num aluno pra lançar</div>}
      {alunos.length === 0 ? (
        <div className="text-center text-gray-400 text-sm py-10">Nenhum aluno presente.</div>
      ) : (
        <div className="space-y-2">
          {alunos.map((p, idx) => {
            const lancado = lancadoDe(p), faltou = faltouDe(p), kg = kgDe(p);
            return (
              <button key={p.turmaId + p.nome} onClick={() => { setStepStart(idx); setPos(0); }}
                className="w-full flex items-center justify-between bg-white rounded-xl shadow-sm hover:shadow-md p-3 text-left">
                <span className="font-medium text-gray-800">
                  {p.nome}{p.isRepo && <span className="ml-2 text-[10px] bg-teal-100 text-teal-700 px-1.5 py-0.5 rounded-full">🔄 repo</span>}
                </span>
                <span className={`text-sm font-semibold ${faltou ? 'text-red-400' : lancado ? 'text-emerald-600' : 'text-gray-300'}`}>
                  {faltou ? '✗ faltou' : lancado ? `${fmt1(kg)} Kg` : '—'}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );

  // 4) stepper circular
  const n = alunos.length;
  const curIdx = (stepStart + pos) % n;
  const p = alunos[curIdx];
  const ehUltimo = pos >= n - 1;
  const avancar = () => { if (ehUltimo) sairStepper(); else setPos(pos + 1); };
  return (
    <div className="max-w-lg mx-auto p-4 pb-4">
      {header(turmaLabel(turmaSel), sairStepper)}
      <div className="text-center text-xs text-gray-400 mb-1">{pos + 1} de {n}{modo === 'rapido' ? ` · ${fmtDataBR(date)}` : ''}</div>
      <div className="bg-white rounded-2xl shadow-sm p-5">
        <div className="text-center mb-4">
          <div className="text-2xl font-bold text-gray-800">{p.nome}</div>
          {p.isRepo && <div className="text-xs text-teal-600 mt-1">🔄 reposição — o barro entra como "barro de reposição" na conta dele</div>}
        </div>
        {faltouDe(p) ? (
          <div className="text-center py-6">
            <div className="text-4xl">✗</div>
            <div className="text-sm text-red-500 font-semibold mt-1">Faltou à reposição</div>
            <button onClick={() => setKg(p, 0, false)} className="text-xs text-gray-400 underline mt-2">desfazer</button>
          </div>
        ) : (
          <BarroInput key={p.turmaId + p.nome} kg={kgDe(p)} onChange={(v, has) => setKg(p, v, has)} completo={modo === 'completo'} />
        )}
        {p.isRepo && !faltouDe(p) && (
          <div className="text-center mt-3">
            <button onClick={setFaltou.bind(null, p)} className="text-xs text-red-500 font-medium border border-red-200 rounded-lg px-3 py-1.5">✗ Faltou à reposição</button>
          </div>
        )}
        {!p.isRepo && <ExtrasEditor extras={extrasDe(p)} onChange={ex => setExtras(p, ex)} />}
      </div>
      <div className="flex items-center gap-2 mt-3">
        <button onClick={() => setPos(Math.max(0, pos - 1))} disabled={pos === 0}
          className="px-4 py-3 rounded-xl bg-gray-100 text-gray-600 font-semibold disabled:opacity-40">‹</button>
        <button onClick={avancar} className="px-4 py-3 rounded-xl bg-gray-100 text-gray-600 font-medium">Pular</button>
        <button onClick={avancar}
          className={`flex-1 py-3 rounded-xl text-white font-semibold ${ehUltimo ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-amber-500 hover:bg-amber-600'}`}>
          {ehUltimo ? '✓ Concluir' : 'Próximo ›'}
        </button>
      </div>
    </div>
  );
}

function Mensagem({ turmas, mesData }) {
  const turmasComAlunos = turmas.filter(t => (mesData.alunos[t.id] || []).length);
  const [sel, setSel] = useState(turmasComAlunos[0]?.id || null);
  const [copied, setCopied] = useState(false);
  useEffect(() => {
    if (!turmasComAlunos.find(t => t.id === sel)) setSel(turmasComAlunos[0]?.id || null);
  }, [turmasComAlunos.map(t => t.id).join(',')]);
  const alunos = sel ? mesData.alunos[sel] : [];
  const texto = useMemo(() => alunos.length ? buildMensagem(alunos, sel) : '', [alunos, sel]);
  const rec = sel ? (TURMA_RECEBEDOR[sel] || 'pedro') : null;

  const copy = () => {
    navigator.clipboard.writeText(texto).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); });
  };

  return (
    <div className="space-y-3 fade-in">
      <select value={sel || ''} onChange={e => setSel(e.target.value)}
        className="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm font-medium">
        {turmasComAlunos.map(t => <option key={t.id} value={t.id}>{turmaLabel(t)}</option>)}
      </select>

      {rec && (
        <div className="flex items-center gap-2 text-xs">
          <span className="bg-white shadow-sm rounded-full px-3 py-1.5 text-gray-600">💳 Quem recebe: <b>{NOME_RECEBEDOR[rec] || rec}</b></span>
          {!DADOS_BANCARIOS[rec] && <span className="text-red-600 font-semibold">⚠️ dados bancários pendentes</span>}
        </div>
      )}

      {texto ? (
        <>
          <button onClick={copy}
            className={`w-full py-3 rounded-xl font-semibold text-white ${copied ? 'bg-green-500' : 'bg-amber-500 hover:bg-amber-600'}`}>
            {copied ? '✓ Copiado!' : '📋 Copiar mensagem'}
          </button>
          <pre className="bg-white rounded-xl shadow-sm p-4 text-sm text-gray-700 leading-relaxed">{texto}</pre>
        </>
      ) : <div className="text-gray-400 text-sm text-center py-8">Nenhuma turma com alunos neste mês.</div>}
    </div>
  );
}

// ==================== ABA: ESTATÍSTICAS ====================
function Stats({ turmas, barro, state, mesAno, mesData, prof }) {
  // Ganho + ocupação por turma (mês corrente)
  const porTurma = turmas.map(t => {
    const alunos = mesData.alunos[t.id] || [];
    const ganho = alunos.reduce((s, a) => s + aulaAluno(a), 0); // só o ganho de aula do professor
    const mensalArrecadada = alunos.reduce((s, a) => s + n2(a.mensalidade), 0);
    const potencial = CAPACIDADE_TURMA * MENSALIDADE_PADRAO;
    return { t, ganho, ocupacao: potencial ? mensalArrecadada / potencial : 0, alunos: alunos.length };
  }).filter(x => x.alunos > 0);

  const f = fechamentoProf(prof, porTurma.map(x => x.t), mesData);

  // Evolução: meu ganho de aula por mês salvo
  const historico = useMemo(() => {
    return Object.keys(barro.lancamentos || {}).sort()
      .map(m => ({ m, ganho: ganhoMesProf(prof, barro.lancamentos[m]) }));
  }, [barro, prof]);
  const maxHist = Math.max(1, ...historico.map(h => h.ganho));

  return (
    <div className="space-y-4 fade-in">
      {/* Resumo do mês */}
      <div className="grid grid-cols-2 gap-3">
        <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4">
          <div className="text-xs text-indigo-500 mb-1">Meu ganho de aula</div>
          <div className="text-2xl font-bold text-indigo-700">R$ {fmt(f.ganho)}</div>
        </div>
        {prof === 'Carol' ? (
          <div className="bg-teal-50 border border-teal-100 rounded-xl p-4">
            <div className="text-xs text-teal-600 mb-1">Devo à Laura (compart.)</div>
            <div className="text-2xl font-bold text-teal-700">R$ {fmt(f.deveCoprof)}</div>
          </div>
        ) : f.netRepasse >= 0 ? (
          <div className="bg-amber-50 border border-amber-100 rounded-xl p-4">
            <div className="text-xs text-amber-600 mb-1">Repasso à Carol</div>
            <div className="text-2xl font-bold text-amber-700">R$ {fmt(f.netRepasse)}</div>
          </div>
        ) : (
          <div className="bg-green-50 border border-green-100 rounded-xl p-4">
            <div className="text-xs text-green-600 mb-1">Recebo da Carol</div>
            <div className="text-2xl font-bold text-green-700">R$ {fmt(-f.netRepasse)}</div>
          </div>
        )}
      </div>

      {/* Por turma */}
      <div className="bg-white rounded-xl shadow-sm p-4">
        <div className="font-semibold text-gray-800 text-sm mb-3">Ganho e ocupação por turma</div>
        <div className="space-y-3">
          {porTurma.map(({ t, ganho, ocupacao, alunos }) => (
            <div key={t.id}>
              <div className="flex justify-between text-sm mb-1">
                <span className="text-gray-700">{turmaLabel(t)} <span className="text-gray-400 text-xs">({alunos})</span></span>
                <span className="font-medium text-gray-700">R$ {fmt(ganho)}</span>
              </div>
              <div className="flex items-center gap-2">
                <div className="flex-1 h-2 bg-gray-100 rounded-full overflow-hidden">
                  <div className="h-full bg-amber-400" style={{ width: `${Math.min(100, ocupacao * 100)}%` }} />
                </div>
                <span className="text-xs text-gray-400 w-10 text-right">{Math.round(ocupacao * 100)}%</span>
              </div>
            </div>
          ))}
          {!porTurma.length && <div className="text-gray-400 text-sm">Nada lançado neste mês.</div>}
        </div>
        <div className="text-[11px] text-gray-400 mt-3">Ocupação = mensalidade arrecadada ÷ ({CAPACIDADE_TURMA} × R$ {fmt(MENSALIDADE_PADRAO)}).</div>
      </div>

      {/* Evolução do meu ganho */}
      {historico.length > 1 && (
        <div className="bg-white rounded-xl shadow-sm p-4">
          <div className="font-semibold text-gray-800 text-sm mb-3">Evolução do meu ganho (meses salvos)</div>
          <div className="space-y-2">
            {historico.map(h => (
              <div key={h.m}>
                <div className="flex justify-between text-xs mb-0.5">
                  <span className={`${h.m === mesAno ? 'font-bold text-gray-800' : 'text-gray-500'}`}>{mesLabel(h.m)}</span>
                  <span className="text-indigo-600">R$ {fmt(h.ganho)}</span>
                </div>
                <div className="h-2.5 rounded-full overflow-hidden bg-gray-100">
                  <div className="h-full bg-indigo-400" style={{ width: `${(h.ganho / maxHist) * 100}%` }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
